<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <title>Bookcast · Sign in</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfaf7;
      --surface: #fff;
      --ink: #15140f;
      --muted: #7c766c;
      --line: #e5e0d6;
      --accent: #2c6e4f;
      --button-bg: #2c6e4f;
      --button-ink: #fff;
      --shadow: 0 8px 22px rgba(24, 20, 10, .045);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html[data-theme="dark"] {
      --bg: #12120f;
      --surface: #1b1a16;
      --ink: #f2efe6;
      --muted: #9a9486;
      --line: #2b2924;
      --accent: #7fc9a2;
      --button-bg: #7fc9a2;
      --button-ink: #12120f;
      --shadow: 0 10px 28px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.6 var(--sans); }
    main { width: min(880px, 100%); margin: 0 auto; padding: 24px 24px 72px; }
    .bar { display: flex; justify-content: flex-end; align-items: center; }
    .ctl { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); padding: 7px 12px; font: inherit; cursor: pointer; }
    .eyebrow { color: var(--muted); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font: 600 clamp(2.6rem, 8vw, 4.4rem)/1.05 var(--serif); }
    .intro, .status { color: var(--muted); }
    .card { max-width: 520px; margin-top: 40px; padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .card h2 { margin: 0 0 8px; font: 600 1.45rem/1.25 var(--serif); }
    .card p { margin: 0 0 20px; }
    .sign-in { border: 1px solid var(--button-bg); border-radius: 999px; background: var(--button-bg); color: var(--button-ink); padding: 10px 18px; font: 600 1rem var(--sans); cursor: pointer; }
    .sign-in:disabled { cursor: wait; opacity: .6; }
    .email-form { display: grid; gap: 10px; margin-bottom: 20px; }
    .email-form label { font-weight: 600; }
    .email-form input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
    .email-form .sign-in { justify-self: start; margin-top: 6px; }
    .email-form[hidden] { display: none; }
    .explore { display: inline-block; margin-right: 16px; font-weight: 600; }
    .explore[hidden] { display: none; }
    .status { margin: 16px 0 0 !important; overflow-wrap: anywhere; }
    a { color: var(--accent); text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="bar">
      <button id="theme" class="ctl" type="button" aria-label="Switch to dark mode">🌙</button>
    </div>
    <header>
      <div class="eyebrow">Bookcast · Reading library</div>
      <h1>Your reading starts here.</h1>
      <p class="intro">Sign in to explore books, listen to chapters, and learn at your own pace.</p>
    </header>
    <section class="card" aria-labelledby="sign-in-heading">
      <h2 id="sign-in-heading">Welcome to Bookcast</h2>
      <p id="account-message" hidden></p>
      <form id="email-form" class="email-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="email-sign-in" class="sign-in" type="submit" disabled>Sign in</button>
      </form>
      <button id="sign-in" class="sign-in" type="button" disabled>Continue with Google</button>
      <a id="explore" class="explore" href="index.html" hidden>Explore the library →</a>
      <button id="sign-out" class="sign-in" type="button" hidden>Sign out</button>
      <p id="status" class="status" role="status" aria-live="polite">Loading sign-in…</p>
    </section>
  </main>
  <script>
    const themeButton = document.getElementById('theme');
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButton.textContent = theme === 'dark' ? '☀️' : '🌙';
      themeButton.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      try { localStorage.setItem('reader.theme', theme); } catch (e) { /* ignore */ }
    }
    let savedTheme;
    try { savedTheme = localStorage.getItem('reader.theme'); } catch (e) { /* ignore */ }
    setTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    themeButton.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  </script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyC4ZCg4k2bnMJmwUqGefe4cX8DeHKFcFAM",
      authDomain: "bookcast-serhii.firebaseapp.com",
      projectId: "bookcast-serhii",
      storageBucket: "bookcast-serhii.firebasestorage.app",
      messagingSenderId: "367024278867",
      appId: "1:367024278867:web:42ba8c6841215113a7e5a6",
      measurementId: "G-EWG7LF2QYG"
    };
    const button = document.getElementById('sign-in');
    const emailForm = document.getElementById('email-form');
    const emailButton = document.getElementById('email-sign-in');
    const signOutButton = document.getElementById('sign-out');
    const heading = document.getElementById('sign-in-heading');
    const accountMessage = document.getElementById('account-message');
    const explore = document.getElementById('explore');
    const status = document.getElementById('status');
    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      async function recordLogin(user, provider) {
        let timeout;
        try {
          await Promise.race([
            (async () => {
              const { getFirestore, collection, addDoc, serverTimestamp, Timestamp } =
                await import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js');
              await addDoc(collection(getFirestore(app), 'loginEvents'), {
                userId: user.uid,
                email: user.email || null,
                provider,
                userAgent: navigator.userAgent.slice(0, 1024),
                loggedInAt: serverTimestamp(),
                expiresAt: Timestamp.fromMillis(Date.now() + 90 * 24 * 60 * 60 * 1000)
              });
            })(),
            new Promise((_, reject) => {
              timeout = setTimeout(() => reject(new Error('Login event timed out')), 3000);
            })
          ]);
        } catch (error) {
          console.warn('Unable to record login event.', error.code || 'unavailable');
        } finally {
          clearTimeout(timeout);
        }
      }
      onAuthStateChanged(auth, user => {
        heading.textContent = user ? 'You’re signed in' : 'Welcome to Bookcast';
        accountMessage.textContent = user ? `Welcome, ${user.displayName || user.email || 'reader'}. Ready to pick up a book?` : '';
        accountMessage.hidden = !user;
        status.textContent = '';
        button.hidden = !!user;
        emailForm.hidden = !!user;
        signOutButton.hidden = !user;
        explore.hidden = !user;
        button.disabled = false;
        emailButton.disabled = false;
      }, error => {
        console.error('Unable to check sign-in status:', error);
        status.textContent = 'Unable to check your sign-in status. Please try again.';
        button.disabled = false;
        emailButton.disabled = false;
      });
      emailForm.addEventListener('submit', async event => {
        event.preventDefault();
        emailButton.disabled = true;
        button.disabled = true;
        status.textContent = 'Signing in…';
        try {
          const result = await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
          await recordLogin(result.user, 'password');
          window.location.href = 'index.html';
        } catch (error) {
          console.error('Email sign-in failed:', error.code);
          status.textContent = error.code === 'auth/network-request-failed'
            ? 'We couldn’t connect. Check your connection and try again.'
            : error.code === 'auth/too-many-requests'
              ? 'Too many attempts. Please wait and try again.'
              : 'We couldn’t sign you in. Check your email and password and try again.';
        } finally {
          emailButton.disabled = false;
          button.disabled = false;
        }
      });
      button.addEventListener('click', async () => {
        button.disabled = true;
        emailButton.disabled = true;
        status.textContent = 'Opening Google sign-in…';
        try {
          const result = await signInWithPopup(auth, new GoogleAuthProvider());
          await recordLogin(result.user, 'google');
          window.location.href = 'index.html';
        } catch (error) {
          console.error('Sign-in failed:', error);
          if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
            status.textContent = 'Sign-in was canceled. You can try again whenever you’re ready.';
          } else if (error.code === 'auth/popup-blocked') {
            status.textContent = 'Your browser blocked the sign-in window. Allow popups and try again.';
          } else {
            status.textContent = 'We couldn’t sign you in. Please try again.';
          }
        } finally {
          button.disabled = false;
          emailButton.disabled = false;
        }
      });
      signOutButton.addEventListener('click', async () => {
        signOutButton.disabled = true;
        try {
          await signOut(auth);
        } catch (error) {
          console.error('Sign-out failed:', error);
          status.textContent = 'We couldn’t sign you out. Please try again.';
        } finally {
          signOutButton.disabled = false;
        }
      });
    } catch (error) {
      console.error('Unable to initialize sign-in:', error);
      status.textContent = 'We couldn’t sign you in. Please try again.';
    }
  </script>
</body>
</html>
