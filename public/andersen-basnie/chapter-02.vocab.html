": "kto go posiada, sprawia rozkosz niewymowną, w innych"}, {"pl": "rozkoszny (adj.)", "uk": "чудовий, приємний", "unit": 36, "frag": "przebyła ropucha w rozkosznym rowie, gdzie nie"}, {"pl": "spirytus (m.)", "uk": "спирт", "unit": 75, "frag": "egzemplarz! Mam wielką ochotę włożyć ją do spirytusu."}, {"pl": "tęsknota (ż.)", "uk": "туга", "unit": 21, "frag": "wydostać się na górę; tęsknota do jasnego, nieznanego"}, {"pl": "umknąć (dk.)", "uk": "утекти", "unit": 12, "frag": "wykrzywiły się pogardliwie i umknęły w głąb studni."}, {"pl": "w poprzek (wyraż.)", "uk": "впоперек", "unit": 31, "frag": "całą, kiedy na drugą stronę w poprzek przechodziła."}, {"pl": "wić się (ndk.)", "uk": "звиватися", "unit": 56, "frag": "zaraz tak mocno, że upadła na ziemię i wiła się z bólu."}, {"pl": "wodorost (m.)", "uk": "водорість", "unit": 2, "frag": "zielony mech i wodorosty, którymi porastały"}, {"pl": "wygoda (ż.)", "uk": "зручність", "unit": 36, "frag": "brakowało żywności ani wygód. Dziewiątego dnia jednak"}, {"pl": "wykręcić się (dk.)", "uk": "викрутитися", "unit": 63, "frag": "— A to się wykręciłam! — zaśmiał się zielony robak. —"}, {"pl": "wykrzywić się (dk.)", "uk": "скривитися", "unit": 12, "frag": "na nie z wielką dumą, wykrzywiły się pogardliwie i"}, {"pl": "wyrozumiały (adj.)", "uk": "поблажливий", "unit": 43, "frag": "na drobiazgi trzeba być wyrozumiałym. Co się tyczy"}, {"pl": "wzlecieć (dk.)", "uk": "злетіти", "unit": 34, "frag": "oderwał się od łodygi i wzleciał do góry, aby z wysoka"}, {"pl": "zazdrość (ż.)", "uk": "заздрість", "unit": 15, "frag": "w innych zaś budzi zazdrość. Zresztą nie pytajcie"}, {"pl": "zesztywnieć (dk.)", "uk": "затерпнути", "unit": 14, "frag": "skakać, a karki tak im zesztywniały od prostego"}, {"pl": "zrąb (m.)", "uk": "цямрина", "unit": 1, "frag": "do góry i ręka zabolała, zanim stanęło na zrębie."}, {"pl": "zwiastować (ndk.)", "uk": "віщувати", "unit": 37, "frag": "dobrze znane głosy, zwiastujące bliskość"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('rows').innerHTML=entries.map(e=>`<tr><td>${esc(e.pl)}</td><td>${esc(e.uk)}</td><td><a href="chapter-02.html#u-${e.unit}">„${esc(e.frag)}”</a></td></tr>`).join('');document.getElementById('count').textContent=`${entries.length} vocabulary items`;const theme=document.getElementById('theme');function setTheme(t){document.documentElement.dataset.theme=t;theme.textContent=t==='dark'?'☀️':'🌙';theme.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('reader.theme',t)}catch(e){}}theme.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));try{setTheme(localStorage.getItem('reader.theme')||'light')}catch(e){setTheme('light')}
