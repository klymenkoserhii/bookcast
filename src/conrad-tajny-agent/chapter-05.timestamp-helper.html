<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to chapter-05.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-05.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

</main>

 {
  "i": 41,
  "pl": "Były to właśnie słowa, które urzędnik o reputacji komisarza Heata powinien był wypowiedzieć i dlatego brzmiały tak rozkosznie.",
  "start": 534.51
 },
 {
  "i": 42,
  "pl": "Dygnitarz zaufał temu oświadczeniu, zgodnemu z jego pojęciem o właściwym porządku rzeczy.",
  "start": 541.53
 },
 {
  "i": 43,
  "pl": "Mądrość dygnitarza była z rodzaju mądrości urzędowych, bo inaczej zastanowiłby go pewien fakt wynikający nie z teorii, lecz z praktyki, a mianowicie to, że w gęstej sieci stosunków między spiskowcem a policją zdarzają się luki, nagłe dziury w czasie i przestrzeni.",
  "start": 547.77
 },
 {
  "i": 44,
  "pl": "Choćby strzeżono danego anarchistę krok za krokiem i minuta za minutą, może przyjść chwila, kiedy zniknie z oczu na parę godzin i wtedy zdarza się coś mniej lub więcej niepożądanego (zazwyczaj wybuch).",
  "start": 563.49
 },
 {
  "i": 45,
  "pl": "Lecz wysoki urzędnik uśmiechnął się pod wpływem swych wyobrażeń o porządku rzeczy i teraz wspomnienie tego uśmiechu było bardzo przykre dla komisarza Heata, głównego eksperta od spraw anarchistycznych.",
  "start": 576.53
 },
 {
  "i": 46,
  "pl": "Nie było to jedyne wspomnienie mącące zwykłą pogodę ducha wybitnego specjalisty. Drugie sięgało porannych godzin tego samego dnia. Heatowi dokuczała myśl, że gdy został nagle wezwany do prywatnego gabinetu nadinspektora, nie potrafił ukryć zdumienia.",
  "start": 589.64
 },
 {
  "i": 47,
  "pl": "Instynkt szczęściarza nauczył go już dawno, iż reputacja człowieka zależy nie tylko od jego czynów, ale i od jego sposobu bycia. A czuł, że w chwili gdy mu pokazano telegram, zachował się nieodpowiednio.",
  "start": 605.28
 },
 {
  "i": 48,
  "pl": "Otworzył szeroko oczy i wykrzyknął: „To niemożliwe!”, narażając się przez to na nieodpartą replikę — uderzenie palcem w telegram, który nadinspektor rzucił na biurko, przeczytawszy go głośno.",
  "start": 618.6
 },
 {
  "i": 49,
  "pl": "Komisarz poczuł się niejako zmiażdżony pod tym uderzeniem palca wskazującego, a to nie należy do przyjemności i bynajmniej nie pomaga w karierze. Co więcej, Heat wiedział, że sytuacji nie polepszył, pozwalając sobie na wyjawienie własnego zdania:",
  "start": 630.96
 },
 {
  "i": 50,
  "pl": "— Jedno mogę od razu powiedzieć: żaden z naszych anarchistów nie ma z tym nic wspólnego.",
  "start": 646.74
 },
 {
  "i": 51,
  "pl": "Opierał się na swym rozsądku dobrego detektywa, ale widział teraz, że nieprzenikniona, baczna powściągliwość wobec tego wypadku byłaby dla jego reputacji korzystniejsza.",
  "start": 652.14
 },
 {
  "i": 52,
  "pl": "Z drugiej strony powiedział sobie w duchu, iż trudno mu będzie utrzymać swą reputację, jeśli obcy anarchiści zaczną maczać palce w sprawach tego rodzaju. Partaccy intruzi są przekleństwem i dla policji, i dla wszystkich innych fachów.",
  "start": 662.52
 },
 {
  "i": 53,
  "pl": "Ton, jakim przemawiał nadinspektor, był tak cierpki, że Heat zacisnął zęby.",
  "start": 677.8
 },
 {
  "i": 54,
  "pl": "A przy tym od rannego śniadania nie miał czasu na jakikolwiek posiłek.",
  "start": 683.3
 },
 {
  "i": 55,
  "pl": "Zaraz po tej rozmowie wyruszył na miejsce wypadku, aby rozpocząć śledztwo, i wchłonął porządną porcję zimnej, niezdrowej mgły rozwleczonej po parku. Stamtąd udał się do szpitala, a gdy śledztwo w Greenwich dobiegało wreszcie końca, stracił zupełnie apetyt.",
  "start": 687.66
 },
 {
  "i": 56,
  "pl": "Nie był przyzwyczajony, jak lekarze, do rozpatrywania z bliska poszarpanych ludzkich szczątków; wstrząsnął nim widok, który odsłonił się przed jego wzrokiem, gdy zdjęto nieprzemakalną płachtę ze stołu znajdującego się w jednym z oddziałów szpitala.",
  "start": 703.04
 },
 {
  "i": 57,
  "pl": "Druga nieprzemakalna płachta okrywała ten stół na kształt obrusa, a jej podniesione końce spoczywały na stożkowatej kupie osmalonych i krwawych łachmanów, zasłaniając po części coś, co mogło ujść za surowiec przeznaczony na ucztę dla ludożerców.",
  "start": 716.35
 },
 {
  "i": 58,
  "pl": "Trzeba było nie byle jakiej siły ducha, żeby się nie cofnąć przed tym widokiem. Komisarz Heat, sprawny urzędnik swego wydziału, wytrwał na stanowisku, ale przez całą minutę nie posunął się naprzód. Miejscowy policjant w mundurze spojrzał z ukosa na stół i rzekł spokojnie z prostotą:",
  "start": 732.05
 },
 {
  "i": 59,
  "pl": "— On tu jest cały. Pozbierałem go co do kawałeczka. A to nie było łatwe.",
  "start": 750.01
 },
 {
  "i": 60,
  "pl": "Ów policjant znalazł się pierwszy na miejscu wybuchu. Zaczął o tym znów opowiadać. Zobaczył we mgle coś na kształt wielkiej błyskawicy. Stał wówczas u drzwi King William Street Lodge, rozmawiając z dozorcą. Wstrząs targnął całym jego ciałem. Rzucił się ku obserwatorium.",
  "start": 757.56
 },
 {
  "i": 61,
  "pl": "— Gnałem co sił w nogach — powtarzał raz po raz.",
  "start": 775.98
 },
 {
  "i": 62,
  "pl": "Komisarz Heat nie przerywał mu, zginając się nad stołem ruchem ostrożnym i pełnym obrzydzenia. Dozorca szpitala i jakiś człowiek odchylili rogi płachty i cofnęli się. Oczy komisarza badały szczegółowo ten straszny stos różnych rzeczy, które wyglądały jakby je kto pozbierał w jatkach i u gałganiarzy.",
  "start": 779.78
 },
 {
  "i": 63,
  "pl": "— Pan użył do tego szufli — rzekł Heat, spostrzegłszy trochę drobnego żwiru, małe kawałeczki kory i cieniutkie jak igły cząstki potrzaskanego drzewa.",
  "start": 798.63
 },
 {
  "i": 64,
  "pl": "— W jednym miejscu nie mogłem sobie poradzić — rzekł niewzruszony policjant. — Więc posłałem stróża po szuflę. Kiedy usłyszał, jak skrobię ziemię, oparł się o drzewo i zwymiotował.",
  "start": 810.04
 },
 {
  "i": 65,
  "pl": "Komisarz, pochylony ostrożnie nad stołem, opanował przykre uczucie w gardle. Gwałtowny, niszczycielski wstrząs, który uczynił z tego ciała kupę nieokreślonych szczątków, robił na nim wrażenie bezlitosnego okrucieństwa, choć rozum mówił, że skutek wybuchu musiał być błyskawiczny.",
  "start": 821.34
 },
 {
  "i": 66,
  "pl": "Kimkolwiek był ten człowiek, zginął w jednej chwili; a jednak niepodobna było uwierzyć, aby ludzkie ciało doszło do tego stanu, nie wycierpiawszy przedtem niepojętych mąk.",
  "start": 838.56
 },
 {
  "i": 67,
  "pl": "Komisarz Heat, obcy fizjologii i jeszcze bardziej obcy metafizyce, wzniósł się przez siłę współczucia, która jest pewną formą strachu, nad pospolite pojęcie o czasie. Błyskawiczny!",
  "start": 849.52
 },
 {
  "i": 68,
  "pl": "Przypomniał sobie wszystko, co czytał w popularnych książkach o długich, przerażających snach śnionych w chwili przebudzenia; przypomniał sobie, że tonący przeżywa z okropną wyrazistością całe swoje życie w chwili, gdy po raz ostatni wynurza głowę nad powierzchnię wody.",
  "start": 860.82
 },
 {
  "i": 69,
  "pl": "Niepojęte tajemnice świadomego istnienia osaczyły komisarza Heata, aż wreszcie doszedł do straszliwego wniosku, że wieki nieludzkich fizycznych tortur i mąk duchowych mogą się zmieścić między dwoma następującymi po sobie mrugnięciami oka.",
  "start": 876.38
 },
 {
  "i": 70,
  "pl": "Jednocześnie zaś wpatrywał się uważnie w stół z twarzą spokojną i nieco zatroskaną, niby ubogi klient, który z myślą o tanim obiedzie niedzielnym pochyla się nad czymś, co w sklepie rzeźniczym mogłoby ujść za odpadki.",
  "start": 891.48
 },
 {
  "i": 71,
  "pl": "A przez cały ten czas wyćwiczona czujność Heata, czujność świetnego detektywa, niegardzącego żadną okazją do zdobycia wiadomości, śledziła bezładną gadaninę policjanta, który bardzo był z siebie zadowolony.",
  "start": 904.68
 },
 {
  "i": 72,
  "pl": "— Miał jasne włosy — stwierdził spokojnie policjant i umilkł na chwilę. — Staruszka, która rozmawiała z sierżantem, zauważyła blondyna wychodzącego z Maze Hill Station. — Znów zamilkł, po czym ciągnął powoli dalej: — A on był właśnie blondynem.",
  "start": 919.42
 },
 {
  "i": 73,
  "pl": "Zauważyła dwóch ludzi wychodzących ze stacji po odejściu pociągu. Nie umiała powiedzieć, czy szli razem. Na wyższego mężczyznę nie zwróciła uwagi, ale spostrzegła, że ten drugi jest jasnowłosym szczupłym chłopcem i że niesie w ręku blaszankę od pokostu.",
  "start": 935.82
 },
 {
  "i": 74,
  "pl": "Policjant urwał.",
  "start": 951.43
 },
 {
  "i": 75,
  "pl": "— Pan zna tę kobietę? — mruknął komisarz, ciągle zapatrzony w stół, i mignęło mu przez myśl, że trzeba zaraz przeprowadzić śledztwo co do tego człowieka, którego tożsamości pewno się nigdy nie stwierdzi.",
  "start": 953.3
 },
 {
  "i": 76,
  "pl": "— Tak. Ona jest gospodynią u byłego właściciela baru i chodzi czasem do kaplicy w Park Place — rzekł policjant z powagą i urwał, zerknąwszy znowu na stół. Nagle podjął: — Więc mamy go tutaj… wszystko, co tylko mogłem znaleźć. Szczupły… dosyć szczupły. Niech pan spojrzy na tę nogę.",
  "start": 965.36
 },
 {
  "i": 77,
  "pl": "Najpierw podniosłem nogi, jedną, a potem drugą. Rozleciał się na takie kawałeczki, że nie wiedziałem, od czego zacząć.",
  "start": 986.64
 },
 {
  "i": 78,
  "pl": "Policjant umilkł; przebłysk naiwnego, pełnego dumy uśmiechu nadał jego okrągłej twarzy dziecinny wyraz.",
  "start": 994.01
 },
 {
  "i": 79,
  "pl": "— On się potknął — oświadczył stanowczo. — Kiedy tam biegłem, potknąłem się także i rozciągnąłem się jak długi. Wszędzie tam sterczą korzenie. Potknął się o korzeń i upadł, a to, co niósł, musiało wybuchnąć akurat pod jego piersiami, jak mi się zdaje.",
  "start": 1001.33
 },
 {
  "i": 80,
  "pl": "Słowa „tożsamość nieustalona” rozlegały się wciąż echem w duszy komisarza, doskwierając mu bardzo. Pragnął dla własnej ciekawości wyśledzić tę sprawę aż do tajemniczego jej źródła. Miał ciekawość zawodowca.",
  "start": 1017.04
 },
 {
  "i": 81,
  "pl": "A ustalając tożsamość tego człowieka, pragnął dowieść ogółowi, że jego wydział funkcjonuje jak należy. Heat był dobrym urzędnikiem. Lecz w tym przypadku ustalenie tożsamości wydawało się niemożliwe. Pierwsze słowa zagadki były nieczytelne — narzucały tylko myśl o straszliwym okrucieństwie.",
  "start": 1030.6
 },
 {
  "i": 82,
  "pl": "Aby zadosyćuczynić sumieniu, komisarz Heat, przezwyciężając odrazę, bez przekonania wyciągnął rękę i podniósł najmniej zbrukany ze strzępów. Był to wąski pas aksamitu złączony z większym trójkątnym kawałkiem ciemnogranatowego sukna. Heat podniósł go do oczu, a policjant rzekł:",
  "start": 1049.46
 },
 {
  "i": 83,
  "pl": "— Aksamitny kołnierz. Ciekawe, że staruszka zauważyła ten aksamitny kołnierz. Ciemnogranatowe palto z aksamitnym kołnierzem, tak nam powiedziała. To jego widziała, jak amen w pacierzu. Mamy go tu w całości, aksamitny kołnierz i wszystko. Nie zostawiłem chyba ani kawałeczka.",
  "start": 1067.48
 },
 {
  "i": 84,
  "pl": "W tej chwili wyćwiczone zmysły Heata przestały słyszeć głos policjanta. Komisarz podszedł do okna, gdzie było jaśniej. Jego twarz, odwrócona od pokoju, wyrażała zdumienie i wytężoną uwagę; oglądał bacznie trójkątny kawałek sukna.",
  "start": 1087.18
 },
 {
  "i": 85,
  "pl": "Nagłym ruchem oderwał go i wetknął do kieszeni, po czym odwrócił się i z powrotem cisnął aksamitny kołnierz na stół.",
  "start": 1102.36
 },
 {
  "i": 86,
  "pl": "— Zakryć to — rozkazał krótko towarzyszącym sobie ludziom i salutowany przez policjanta, nie spoglądając już ku stołowi, uniósł szybko swą zdobycz.",
  "start": 1109.5
 },
 {
  "i": 87,
  "pl": "Pochłonięty myślami, jechał pociągiem w stronę miasta, siedząc samotnie w przedziale trzeciej klasy. Ta osmalona szmatka sukna byłą bezcenna; komisarz nie mógł opanować zdziwienia nad zbiegiem okoliczności, dzięki któremu wpadła mu w ręce. Zdawało się, że sam Los wskazał mu drogę.",
  "start": 1118.68
 },
 {
  "i": 88,
  "pl": "I jak każdy przeciętny człowiek, którego ambicją jest wpływanie na bieg rzeczy, komisarz poczuł nieufność do powodzenia osiągniętego bez trudu, dzięki przypadkowi — właśnie dlatego, że wyglądało jakby mu je narzucono.",
  "start": 1138.46
 },
 {
  "i": 89,
  "pl": "Istotna wartość powodzenia jest względna, zależy w znacznym stopniu od tego, jak się na nie zapatrujemy. Ale Los jest bezwzględny i nie liczy się z niczym.",
  "start": 1152.28
 },
 {
  "i": 90,
  "pl": "Komisarz nie uważał już, aby było wskazane ujawnić przed publicznością tożsamość człowieka, który tego ranka unicestwił się tak straszliwie i tak doszczętnie. Lecz Heat nie był pewien, jak jego wydział będzie się na to zapatrywał.",
  "start": 1163.66
 },
 {
  "i": 91,
  "pl": "Wydział jest dla swych urzędników czymś skomplikowanym, czymś, co ma własne poglądy, a nawet kaprysy. Wydział zależy od wierności i oddania swych sług, a oddanie i wierność zaufanych sług kojarzą się z pewnego rodzaju lekceważącym przywiązaniem, które niejako tę wierność podsyca.",
  "start": 1177.62
 },
 {
  "i": 92,
  "pl": "Wskutek łaskawego zrządzenia natury żaden człowiek nie jest bohaterem dla swego lokaja, chyba że sam sobie czyści ubranie. Podobnie żaden wydział nie uchodzi za idealnie mądry w oczach spoufalonych z nim pracowników. Wydział nie wie tego wszystkiego, co wiedzą niektórzy z jego sług.",
  "start": 1194.98
 },
 {
  "i": 93,
  "pl": "Będąc organizmem beznamiętnym, nie może być nigdy idealnie informowany. Gdyby wiedział zbyt wiele, nie mógłby sprawnie funkcjonować.",
  "start": 1213.18
 },
 {
  "i": 94,
  "pl": "Komisarz Heat wysiadł z pociągu w zadumie dalekiej od nieprawomyślności, lecz nie pozbawionej szczypty tego zazdrosnego powątpiewania, które tak często kiełkuje na gruncie zupełnego poświęcenia się czy kobiecie, czy też instytucji.",
  "start": 1221.76
 },
 {
  "i": 95,
  "pl": "W takim to stanie ducha Heat, zgłodniały, lecz pod wpływem tego, co widział, wciąż jeszcze skłonny do mdłości, zetknął się z Profesorem. W tych warunkach, usposabiających do irytacji zdrowego, normalnego człowieka, spotkanie to było dla Heata szczególnie niepożądane. Nie myślał o Profesorze;",
  "start": 1234.72
 },
 {
  "i": 96,
  "pl": "nie myślał o żadnym konkretnym anarchiście.",
  "start": 1254.02
 },
 {
  "i": 97,
  "pl": "Ta skomplikowana sprawa narzuciła mu myśl, że w ogóle wszystkie ludzkie poczynania są pozbawione sensu — która to myśl nawet w teorii jest dość przykra dla człowieka niemającego nic wspólnego z filozofią, a w wypadkach konkretnych staje się nad wszelki wyraz drażniąca.",
  "start": 1256.32
 },
 {
  "i": 98,
  "pl": "Na początku swojej kariery komisarz Heat zajmował się poważniejszymi wypadkami kradzieży. Zdobył ostrogi na tym terenie i oczywiście zachował dlań — po awansie i przeniesieniu do innego wydziału — uczucie dość zbliżone do przywiązania. Kradzież nie jest czystym absurdem.",
  "start": 1272.22
 },
 {
  "i": 99,
  "pl": "Jest to pewien rodzaj ludzkiej pracy, oczywiście wypaczonej, lecz jednak pracy wykonywanej na tym pracowitym świecie; jest to czynność podejmowana dla tej samej przyczyny, co praca garncarza, praca w kopalniach węgla czy w polu, czy też w zakładzie szlifierskim.",
  "start": 1290.08
 },
 {
  "i": 100,
  "pl": "Ta praca różni się w praktyce od innych rodzajów pracy gatunkiem niebezpieczeństwa, które nie polega na groźbie reumatyzmu lub zatrucia się ołowiem, gazem węglowym czy pyłem z granitu;",
  "start": 1305.3
 },
 {
  "i": 101,
  "pl": "niebezpieczeństwo grożące złodziejowi polega na tym, co specjalna terminologia określa zwięźle jako „siedem lat kryminału”. Oczywiście komisarz Heat nie był obojętny na różnice natury moralnej. Ale i złodzieje, których śledził, nie byli na nie obojętni.",
  "start": 1316.46
 },
 {
  "i": 102,
  "pl": "Poddawali się z pewną rezygnacją surowym prawom moralności wyznawanej przez komisarza Heata. On zaś uważał ich za współobywateli wykolejonych na skutek złego wychowania;",
  "start": 1332.84
 },
 {
  "i": 103,
  "pl": "jednak, uwzględniwszy tę różnicę, był w stanie zrozumieć umysłowość włamywacza, ponieważ w gruncie rzeczy umysłowość i instynkty włamywacza należą do tej samej kategorii, co umysłowość i instynkty urzędnika policji.",
  "start": 1343.38
 },
 {
  "i": 104,
  "pl": "Obaj poddają się tym samym prawom, znają wzajemnie z praktyki swoje metody pracy i rutynę swoich zawodów. Rozumieją, co jest dla obu stron korzystne, i to nadaje pewnego rodzaju urok ich wzajemnym stosunkom.",
  "start": 1357.48
 },
 {
  "i": 105,
  "pl": "Obaj są wytworem tego samego mechanizmu, choć jednego z nich uważa się za wytwór użyteczny, a drugiego za szkodliwy; obaj uznają konieczność tegoż mechanizmu, uznają w sposób odmienny, lecz odnoszą się do niego w zasadzie z taką samą powagą.",
  "start": 1371.32
 },
 {
  "i": 106,
  "pl": "Umysł komisarza Heata był niedostępny dla pojęć rewolucyjnych. Ale i jego złodzieje nie byli buntownikami. Siła fizyczna Heata, jego chłodny, nieugięty sposób bycia, jego odwaga i prawość zdobyły mu wiele szacunku i nieco służalczych pochlebstw w sferze, gdzie pracował dawniej z powodzeniem.",
  "start": 1386.66
 },
 {
  "i": 107,
  "pl": "Czuł się tam szanowany i podziwiany. A teraz, stojąc o sześć kroków od anarchisty zwanego Profesorem, wspomniał z żalem świat złodziei — środowisko zdrowe, pozbawione chorobliwych ideałów, pracujące według pewnej rutyny, pełne szacunku dla ustanowionych władz, wolne od skaz nienawiści i rozpaczy.",
  "start": 1406.32
 },
 {
  "i": 108,
  "pl": "Złożywszy hołd temu, co normalne w ustroju społecznym (albowiem pojęcie złodziejstwa wydawało się Heatowi równie normalne jak pojęcie własności), komisarz rozgniewał się na siebie za to, że się zatrzymał, że przemówił do Profesora, że w ogóle wybrał tę ulicę, która skracała drogę od stacji do głównego urzędu policyjnego.",
  "start": 1426.48
 },
 {
  "i": 109,
  "pl": "I powtórzył silnym, stanowczym głosem, przytłumionym i groźnym w brzmieniu:",
  "start": 1445.04
 },
 {
  "i": 110,
  "pl": "— Mówię panu, że pana nie potrzebuję.",
  "start": 1450.48
 },
 {
  "i": 111,
  "pl": "Anarchista stał dalej bez ruchu. Niemy, szyderczy śmiech odsłonił nie tylko jego zęby, ale i dziąsła, targał nim całym, nie uzewnętrzniając się najlżejszym dźwiękiem. Komisarz Heat dodał mimo woli, wbrew podszeptom zdrowego rozsądku:",
  "start": 1453.7
 },
 {
  "i": 112,
  "pl": "— Tymczasem jeszcze nie. Kiedy przyjdzie na to czas, będę wiedział, gdzie pana znaleźć.",
  "start": 1469.91
 },
 {
  "i": 113,
  "pl": "Były to jedyne właściwe słowa, zgodne z tradycją, odpowiednie dla urzędnika policji, który zwraca się do owieczki z powierzonego mu stada. Ale sposób, w jaki zostały przyjęte, urągał tradycji i przyzwoitości. Był oburzający. Kusa, nikła postać stojąca przed Heatem przemówiła nareszcie:",
  "start": 1475.55
 },
 {
  "i": 114,
  "pl": "— Nie wątpię, że gazety poświęcą panu wówczas nekrolog. Pan wie najlepiej, czy to się panu opłaci. Łatwo sobie wyobrazić, jak taki nekrolog będzie wyglądał.",
  "start": 1493.77
 },
 {
  "i": 115,
  "pl": "I kto wie, czy się pan nie narazi na tę przykrość, że pochowają nas razem, choć sądzę, że pańscy przyjaciele dołożą wszelkich starań, aby rozsegregować nas możliwie najdokładniej.",
  "start": 1504.27
 },
 {
  "i": 116,
  "pl": "Komisarz Heat czuł należytą pogardę dla uczuć dyktujących te słowa, lecz mimo to zawarta w nich straszliwa aluzja wywarła na nim wrażenie. Nie zlekceważył jej jako absurdu, gdyż był na to zbyt przenikliwy i zbyt dobrze poinformowany.",
  "start": 1515.85
 },
 {
  "i": 117,
  "pl": "Mrok wąskiej uliczki nabrał czegoś złowieszczego od ciemnej, nikłej figurki opartej plecami o mur, mówiącej głosem słabym i pewnym siebie. Pełnemu sił i niewyczerpanej żywotności Heatowi nędzna postać tego stworzenia, tak widać niezdatnego do życia, wydała się złowroga;",
  "start": 1531.33
 },
 {
  "i": 118,
  "pl": "odniósł bowiem wrażenie, że gdyby miał nieszczęście urodzić się równie marnym stworem, byłoby mu wszystko jedno, czy umrze wcześniej, czy później. Tak silnie wrośnięty był w życie, że znów poczuł mdłości, a czoło zrosiło mu się potem.",
  "start": 1549.99
 },
 {
  "i": 119,
  "pl": "Gwar miejskiego życia, zgłuszony turkot kół na dwóch niewidocznych ulicach z prawej i lewej strony, dotarły do jego uszu półkolem niechlujnego zaułka; wydały mu się czymś swojskim i cennym, i pełnym nęcącej słodyczy. Heat był człowiekiem z krwi i kości.",
  "start": 1565.19
 },
 {
  "i": 120,
  "pl": "Ale był także mężczyzną i nie mógł puścić takich słów mimo uszu.",
  "start": 1582.8
 },
 {
  "i": 121,
  "pl": "— Wszystko to są strachy na Lachy — rzekł. — Jeszcze się do pana dobiorę.",
  "start": 1589.33
 },
 {
  "i": 122,
  "pl": "To było powiedziane bardzo dobrze, bez pogardy, z prawie surowym spokojem.",
  "start": 1596.92
 },
 {
  "i": 123,
  "pl": "— Nie wątpię o tym — brzmiała odpowiedź — ale niech mi pan wierzy: obecna chwila jest wymarzona. Dla człowieka zasad to piękna sposobność do poświęcenia się. Może pan nie znajdzie drugiej tak sprzyjającej, tak humanitarnej.",
  "start": 1603.14
 },
 {
  "i": 124,
  "pl": "Nie ma nawet kota w pobliżu, a z tych starych domów skazanych na zagładę byłaby porządna kupa gruzu, tam gdzie pan stoi. Nigdy już nie będzie pan mógł mnie dopaść, narażając w tak małym stopniu życie i własność obywateli, za których ochronę pana opłacają.",
  "start": 1619.46
 },
 {
  "i": 125,
  "pl": "— Pan nie wie, do kogo pan mówi — rzekł komisarz Heat ze stanowczością. — Gdybym teraz położył na panu rękę, byłbym tyleż wart, co i pan.",
  "start": 1636.4
 },
 {
  "i": 126,
  "pl": "— Aha! Więc to o prawidła gry panu chodzi!",
  "start": 1647.03
 },
 {
  "i": 127,
  "pl": "— Zapewniam pana, że w końcu nasza strona zwycięży. Może jednak trzeba będzie ludzi przekonać, że do niektórych z was powinno się strzelać jak do wściekłych psów. Wtedy nasza gra tak właśnie będzie wyglądać. Ale bodajbym zginął, jeśli wiem, co za grę wy prowadzicie. Chyba nie wiecie tego sami.",
  "start": 1651.33
 },
 {
  "i": 128,
  "pl": "Na tej drodze nigdy nic nie osiągniecie.",
  "start": 1667.69
 },
 {
  "i": 129,
  "pl": "— A tymczasem wy nieźle na swej grze wychodzicie… jak dotąd. Idzie wam jak z płatka. Nie mówię o pana dochodach, ale czy pan nie zdobył sobie rozgłosu po prostu przez niezrozumienie tego, do czego dążymy?",
  "start": 1671.4
 },
 {
  "i": 130,
  "pl": "— Do czegóż więc dążycie? — spytał komisarz Heat z lekceważącym pośpiechem, jak człowiek, który mało ma czasu i widzi, że go traci na próżno.",
  "start": 1686.32
 },
 {
  "i": 131,
  "pl": "Wzorowy anarchista uśmiechnął się w odpowiedzi, nie rozchylając wąskich, bezbarwnych warg, a sławny komisarz w poczuciu swej wyższości podniósł ostrzegawczo palec:",
  "start": 1694.62
 },
 {
  "i": 132,
  "pl": "— Bez względu na to jaki jest wasz cel, zaniechajcie go — rzekł tonem pouczającym, ale nie tak łaskawym, jak kiedy by udzielał rady słynnemu włamywaczowi. — Zaniechajcie go. Zobaczy pan, że sobie z nami nie poradzicie.",
  "start": 1704.72
 },
 {
  "i": 133,
  "pl": "Zastygłe w uśmiechu wargi Profesora drgnęły, jakby szyderczy duch w jego wnętrzu stracił na pewności siebie. Komisarz Heat ciągnął dalej:",
  "start": 1720.08
 },
 {
  "i": 134,
  "pl": "— Nie wierzy mi pan, co? Więc niech się pan tylko rozejrzy. Nie poradzicie sobie. I jakoś źle się do tego bierzecie. Musicie zawsze coś sknocić. Gdyby złodzieje nie znali swego fachu lepiej, niż wy znacie swój, umarliby z głodu.",
  "start": 1729.21
 },
 {
  "i": 135,
  "pl": "Poczucie, że za plecami tego człowieka tkwią niezwyciężone tłumy, wzbudziło ponury gniew w piersi Profesora. Z jego ust znikł szyderczy i zagadkowy uśmiech. Lęk wobec nieugiętej potęgi liczb, wobec odpornej na wszystko niewzruszoności mas, był upiorem nawiedzającym jego ponurą samotność.",
  "start": 1745.27
 },
 {
  "i": 136,
  "pl": "Wargi Profesora drżały jakiś czas, nim zdołał wyrzec zdławionym głosem:",
  "start": 1765.69
 },
 {
  "i": 137,
  "pl": "— Robię swoje lepiej niż wy.",
  "start": 1771.66
 },
 {
  "i": 138,
  "pl": "— Dość tego — przerwał śpiesznie komisarz Heat; Profesor roześmiał się, tym razem głośno. Zaczął iść, wciąż jeszcze się śmiejąc, ale nie śmiał się długo. Gdy się wyłonił z wąskiego zaułka, był znowu nędznym człowieczkiem o smutnej twarzy. Utonął w rozgardiaszu wielkiej ulicy;",
  "start": 1774.62
 },
 {
  "i": 139,
  "pl": "szedł bezsilnym krokiem wciąż dalej i dalej, niby włóczęga obojętny na deszcz lub słońce, nieczuły w swej ponurości na wygląd nieba i ziemi.",
  "start": 1793.64
 },
 {
  "i": 140,
  "pl": "Natomiast komisarz Heat, popatrzywszy za nim przez chwilę, ruszył naprzód z celową energią człowieka, który wprawdzie sobie lekceważy nielitościwe wybryki przyrody, lecz świadom jest zarówno misji, powierzonej mu na tej ziemi, jak i moralnego poparcia bliźnich.",
  "start": 1802.1
 },
 {
  "i": 141,
  "pl": "Mieszkańcy olbrzymiego miasta, ludność całego kraju i pleniące się miliony, które walczą o byt na tej planecie, wszyscy byli po jego stronie… aż do złodziei i żebraków włącznie. Tak, nawet złodzieje sprzyjają mu na pewno w obecnej pracy.",
  "start": 1818.82
 },
 {
  "i": 142,
  "pl": "Świadomość powszechnego poparcia dodała mu ducha w zmaganiu się z tym konkretnym zagadnieniem.",
  "start": 1834.68
 },
 {
  "i": 143,
  "pl": "Najbliższe zadanie oczekujące komisarza polegało na uporaniu się z bezpośrednim zwierzchnikiem, nadinspektorem wydziału. Jest to odwieczne zadanie zaufanych i wiernych urzędników; anarchizm nadał mu tylko specjalne zabarwienie i nic poza tym.",
  "start": 1840.22
 },
 {
  "i": 144,
  "pl": "Mówiąc szczerze, komisarz Heat nie miał wysokiego pojęcia o anarchizmie. Nie przypisywał mu zbytniej wagi i nie mógł się nigdy zmusić do brania go poważnie. Uważał, że anarchizm należy raczej do wykroczeń przeciw dobrym obyczajom;",
  "start": 1856.25
 },
 {
  "i": 145,
  "pl": "że jest nieobyczajnością, której nie przysługuje ta zrozumiała okoliczność łagodząca — pijaństwo, idące w parze z dobrodusznością i sympatycznym pociągiem do hulanek. Podobnie jak zbrodniarze, anarchiści nie są wyraźną klasą — w ogóle żadnej klasy nie tworzą.",
  "start": 1870.57
 },
 {
  "i": 146,
  "pl": "Inspektor Heat przypomniał sobie Profesora i nie zatrzymując się, mruknął przez zęby, idąc swym elastycznym krokiem:",
  "start": 1886.75
 },
 {
  "i": 147,
  "pl": "— Wariat.",
  "start": 1895.0
 },
 {
  "i": 148,
  "pl": "Pościg za złodziejami to zupełnie inna sprawa. Ma w sobie powagę cechującą każdy rodzaj sportu na świeżym powietrzu, sportu, w którym człowiek najdzielniejszy wygrywa na zasadzie prawideł bardzo przejrzystych. Lecz nie ma prawideł na postępowanie z anarchistami.",
  "start": 1896.34
 },
 {
  "i": 149,
  "pl": "I właśnie to przejęło Heata niesmakiem. Cała sprawa była wierutnym głupstwem, ale to głupstwo podniecało umysły, narażało osoby na wysokich stanowiskach i zahaczało o stosunki międzynarodowe. Twarda, bezlitosna pogarda zakrzepła na twarzy komisarza.",
  "start": 1911.96
 },
 {
  "i": 150,
  "pl": "Przebiegał myślą wszystkich anarchistów ze swej gromadki. Żaden z nich nie miał tej odwagi, co niektórzy ze znanych mu złodziei. Ani w połowie, ani nawet w dziesiątej części.",
  "start": 1927.6
 },
 {
  "i": 151,
  "pl": "W centrali komisarz został wpuszczony od razu do gabinetu nadinspektora. Zastał go z piórem w ręku, pochylonego nad wielkim stołem zarzuconym papierami; wyglądało to jakby nadinspektor oddawał cześć olbrzymiemu podwójnemu kałamarzowi z brązu i kryształu.",
  "start": 1938.95
 },
 {
  "i": 152,
  "pl": "Tuby głosowe⁴⁸ podobne do węży były przymocowane do oparcia drewnianego fotela, a ich rozszerzone paszcze zdawały się czyhać na odpowiednią chwilę, aby ugryźć nadinspektora w łokieć. Nie zmienił pozy, tylko podniósł oczy, których powieki były ciemniejsze niż twarz i bardzo pomarszczone.",
  "start": 1954.67
 },
 {
  "i": 153,
  "pl": "Oświadczył, że raporty już wpłynęły; sprawdzono dokładnie, co robił w ostatnich czasach każdy z anarchistów.",
  "start": 1973.31
 },
 {
  "i": 154,
  "pl": "Spuścił oczy, podpisał się szybko na dwóch pojedynczych arkuszach i dopiero wtedy, odłożywszy pióro, rozsiadł się w fotelu, zwracając badawcze spojrzenie na swego znakomitego urzędnika. Komisarz wytrzymał je, pełen szacunku, lecz niezbadany.",
  "start": 1980.35
 },
 {
  "i": 155,
  "pl": "— Sądzę, że pan miał rację — rzekł nadinspektor — kiedy mi pan od razu powiedział, że londyńscy anarchiści nie mają z tym nic wspólnego. Doceniam to w zupełności, że pana ludzie trzymają ich pod ścisłym dozorem.",
  "start": 1995.69
 },
 {
  "i": 156,
  "pl": "Ale znów jeśli chodzi o publiczność, sprawa wygląda tak, jakbyśmy się przyznawali, że nic nie wiemy.",
  "start": 2008.78
 },
 {
  "i": 157,
  "pl": "Nadinspektor mówił powoli, rzekłbyś, ostrożnie. Zdawało się, iż jego myśl usiłuje znaleźć drogę wśród rozlewiska błędów, przechodząc od słowa do słowa i zatrzymując się na każdym z nich jak na sterczących z wody kamieniach.",
  "start": 2015.04
 },
 {
  "i": 158,
  "pl": "— Chyba że przywiózł mi pan z Greenwich coś pożytecznego — dodał.",
  "start": 2029.73
 },
 {
  "i": 159,
  "pl": "Komisarz zaczął natychmiast zdawać sprawę ze swego śledztwa w sposób jasny i rzeczowy. Zwierzchnik obrócił się trochę wraz z fotelem, skrzyżował chude nogi i oparłszy się na łokciu, zasłonił ręką oczy. W tej jego zasłuchanej postawie był pewien wdzięk, jakby kanciasty i smutny.",
  "start": 2035.25
 },
 {
  "i": 160,
  "pl": "Gdy w końcu pochylił z wolna czarną jak heban głowę, po jej bokach przebiegły błyski niby po świetnie wypolerowanym srebrze.",
  "start": 2052.97
 },
 {
  "i": 161,
  "pl": "Komisarz Heat czekał, na pozór przeżuwając w myśli wszystko, co dotychczas powiedział, lecz w gruncie rzeczy zastanawiając się, czy należy jeszcze coś dodać. Zwierzchnik przerwał ten namysł:",
  "start": 2061.03
 },
 {
  "i": 162,
  "pl": "— Sądzi pan, że tam było dwóch ludzi?",
  "start": 2073.11
 },
 {
  "i": 163,
  "pl": "Zdaniem komisarza było to więcej niż prawdopodobne. Ci dwaj ludzie rozstali się zapewne w odległości jakich stu jardów od obserwatorium. Wyjaśnił również, jakim sposobem tamten drugi człowiek mógł wymknąć się z parku, nie będąc zauważonym. Sprzyjała mu mgła, choć niezbyt gęsta.",
  "start": 2075.92
 },
 {
  "i": 164,
  "pl": "Zdaje się, że przyprowadził na miejsce towarzysza, który miał już sam wykonać robotę.",
  "start": 2094.14
 },
 {
  "i": 165,
  "pl": "Zestawiwszy czas, w którym staruszka widziała tych dwóch ludzi wychodzących z Maze Hill Station, z czasem, kiedy usłyszano wybuch, komisarz sądził, że tamten człowiek mógł już być na Greenwich Park Station i oczekiwać najbliższego pociągu w kierunku miasta — w tej samej chwili, gdy jego towarzysz unicestwił się tak doszczętnie.",
  "start": 2099.24
 },
 {
  "i": 166,
  "pl": "— Doszczętnie w całym tego słowa znaczeniu, co? — szepnął nadinspektor spod ręki ocieniającej twarz.",
  "start": 2119.9
 },
 {
  "i": 167,
  "pl": "Komisarz opisał w paru jędrnych słowach wygląd szczątków.",
  "start": 2126.42
 },
 {
  "i": 168,
  "pl": "— Komisja stwierdzająca śmierć będzie miała używanie — dodał posępnie.",
  "start": 2131.0
 },
 {
  "i": 169,
  "pl": "Nadinspektor odsłonił oczy.",
  "start": 2136.72
 },
 {
  "i": 170,
  "pl": "— Nie będziemy mogli dać im żadnych wyjaśnień — zauważył wyczerpanym głosem.",
  "start": 2139.9
 },
 {
  "i": 171,
  "pl": "Spojrzał w górę i przez chwilę śledził wybitnie obojętną postawę swego komisarza. Nie należał do ludzi ulegających łatwo złudzeniom. Wiedział dobrze, iż każdy wydział jest na łasce drugorzędnych urzędników, którzy mają swoje własne pojęcie o lojalności.",
  "start": 2145.36
 },
 {
  "i": 172,
  "pl": "Jego kariera rozpoczęła się w kolonii podzwrotnikowej. Lubił swą tamtejszą robotę. Była to robota policyjna. Udało mu się wyśledzić i unieszkodliwić pewne zbrodnicze tajne stowarzyszenia wśród tubylców. Potem wyjechał na długi urlop i ożenił się pod wpływem nagłego porywu.",
  "start": 2160.34
 },
 {
  "i": 173,
  "pl": "Sądząc po światowemu, stanowili z żoną bardzo dobraną parę, ale nadinspektorowa wyrobiła sobie ze słyszenia niekorzystną opinię o klimacie kolonialnym. Miała wiele wpływowych znajomości — była to świetna partia. Lecz nadinspektor nie lubił swej obecnej roboty.",
  "start": 2178.5
 },
 {
  "i": 174,
  "pl": "Czuł się zależny od zbyt wielu podwładnych i zbyt wielu zwierzchników. Bezpośrednia bliskość tego dziwnego przejawu uczuć, zwanego opinią publiczną, przygnębiała go i niepokoiła swą irracjonalnością.",
  "start": 2196.97
 },
 {
  "i": 175,
  "pl": "Nie ulega wątpliwości, że przez brak doświadczenia wyolbrzymiał sobie jej siłę czynienia dobra i zła, zwłaszcza zaś zła; przy tym ostre wschodnie wiatry angielskiej wiosny (które służyły jego żonie) pogłębiały w nim zasadniczą nieufność do pobudek rządzących ludźmi i do sprawności ich organizacji.",
  "start": 2210.17
 },
 {
  "i": 176,
  "pl": "Jałowość pracy biurowej gnębiła go szczególnie w owych dniach tak przykrych dla jego wrażliwej wątroby.",
  "start": 2231.7
 },
 {
  "i": 177,
  "pl": "Wstał, rozprostował się w całej długości i krokiem ciężkim, zadziwiającym u człowieka tak szczupłego, ruszył przez pokój ku oknu. Szyby ociekały deszczem, a w dole krótka uliczka, na którą nadinspektor spoglądał, była mokra i pusta, jakby wymieciona nagle do czysta przez wielką powódź.",
  "start": 2239.08
 },
 {
  "i": 178,
  "pl": "Dzień bardzo był przykry, najpierw zdławiony przez zimną mgłę, a teraz pławiący się w zimnej ulewie. Migotliwe, zamazane płomienie gazowych latarni jak gdyby się rozpuszczały w wodnistym powietrzu.",
  "start": 2258.94
 },
 {
  "i": 179,

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
</body>
