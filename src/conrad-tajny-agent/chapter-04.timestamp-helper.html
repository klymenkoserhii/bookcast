<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to chapter-04.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-04.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

</style>

 {
  "i": 52,
  "pl": "— Oni wiedzą — przerwał cierpko człowieczek, opierając się plecami o krzesło, które górowało oparciem nad jego małą głową. — Nie zaaresztują mnie nigdy. Ten kawał nie opłaciłby się żadnemu policjantowi.",
  "start": 510.08
 },
 {
  "i": 53,
  "pl": "Uporanie się z takim człowiekiem jak ja wymaga bezinteresownego bohaterstwa, bohaterstwa bez sławy.",
  "start": 524.49
 },
 {
  "i": 54,
  "pl": "Znowu zacisnął usta z miną bardzo pewną siebie. Ossipon powściągnął ruch zniecierpliwienia i odparł:",
  "start": 531.64
 },
 {
  "i": 55,
  "pl": "— Albo zuchwałości… albo po prostu nieświadomości. Mogliby powierzyć to zadanie komuś, kto nie wie, że nosicie w kieszeni dość materiału wybuchowego, aby wysadzić w powietrze siebie i wszystko naokoło w promieniu sześćdziesięciu jardów.",
  "start": 538.18
 },
 {
  "i": 56,
  "pl": "— Nie twierdziłem nigdy, że nie można mnie usunąć — odparł tamten. — Ale to by nie było aresztowanie. Przy tym nie takie to łatwe, jak się zdaje.",
  "start": 552.47
 },
 {
  "i": 57,
  "pl": "— Et! — zaprzeczył Ossipon. — Nie bądźcie tacy pewni siebie. Któż zaręczy, że z pół tuzina policjantów nie skoczy na was z tyłu na ulicy? Gdyby wam przygwoździli ręce do boków, to byście nie mogli nic zrobić… no bo jakże?",
  "start": 563.99
 },
 {
  "i": 58,
  "pl": "— Owszem, mógłbym. Wychodzę rzadko o zmroku — rzekł obojętnie człowieczek — i nigdy bardzo późno. Trzymam rękę na gumowej gruszce, którą noszę zawsze w lewej kieszeni spodni. Naciśnięcie tej gruszki oddziaływa na zapalnik w środku flakonu, znajdującego się w przedniej kieszeni marynarki.",
  "start": 579.66
 },
 {
  "i": 59,
  "pl": "Na takiej samej zasadzie jest zbudowana migawka aparatu fotograficznego. Rurka prowadzi w górę do…",
  "start": 600.66
 },
 {
  "i": 60,
  "pl": "Szybkim ruchem uchylił marynarkę i Ossipon zobaczył gumową rurkę podobną do cienkiej brunatnej glisty, wychodzącą z kamizelki, z otworu pachy, i zanurzoną w wewnętrznej przedniej kieszeni marynarki.",
  "start": 607.16
 },
 {
  "i": 61,
  "pl": "Odzienie człowieczka, nieokreślonego brązowego koloru, było wytarte i poplamione, pełne kurzu w załamkach; dziurki od guzików były obszarpane.",
  "start": 619.68
 },
 {
  "i": 62,
  "pl": "— Zapalnik jest częściowo mechaniczny, a częściowo chemiczny — wyjaśnił człowieczek z niedbałą łaskawością.",
  "start": 630.3
 },
 {
  "i": 63,
  "pl": "— Działa oczywiście natychmiast? — szepnął Ossipon z lekkim dreszczem.",
  "start": 638.56
 },
 {
  "i": 64,
  "pl": "— Ale gdzież tam — wyznał tamten z niechęcią, która wykrzywiła mu usta jakby skurczem bólu. — Całych dwadzieścia sekund musi upłynąć od chwili, gdy nacisnę gruszkę, aż do chwili wybuchu.",
  "start": 643.48
 },
 {
  "i": 65,
  "pl": "— Fiu! — gwizdnął Ossipon, do reszty przerażony. — Dwadzieścia sekund! Okropność! I wy uważacie, że moglibyście to wytrzymać? Ja bym zwariował.",
  "start": 656.84
 },
 {
  "i": 66,
  "pl": "— Dziura by się w niebie nie zrobiła. Oczywiście jest to słaba strona tego systemu, który przeznaczyłem tylko na własny użytek. Co gorsza, sposób, w jaki wybuch następuje, jest stale słabą stroną naszych bomb.",
  "start": 670.37
 },
 {
  "i": 67,
  "pl": "Usiłuję wynaleźć zapalnik, który by się dostosowywał do wszystkich warunków akcji i nawet do nieoczekiwanych zmian tych warunków. Mechanizm giętki, a jednak idealnie precyzyjny. Zapalnik prawdziwie inteligentny.",
  "start": 681.45
 },
 {
  "i": 68,
  "pl": "— Dwadzieścia sekund — mruknął znów Ossipon. — Brr! A potem…",
  "start": 697.1
 },
 {
  "i": 69,
  "pl": "Człowieczek odwrócił z lekka głowę; połysk jego okularów zdawał się mierzyć objętość piwiarni mieszczącej się w podziemiach słynnej restauracji „Sylen”.",
  "start": 702.7
 },
 {
  "i": 70,
  "pl": "— Nikt nie uszedłby cało z tej sali — zabrzmiał wyrok, który był wynikiem oględzin. — Nawet tych dwoje idących w górę po schodach.",
  "start": 714.07
 },
 {
  "i": 71,
  "pl": "Pianino u stóp klatki schodowej huknęło mazura z bezczelną natarczywością. Klawisze zapadały się i podnosiły w tajemniczy sposób; wyglądało to na popis jakiegoś pospolitego i zuchwałego ducha. Potem wszystko ucichło.",
  "start": 724.23
 },
 {
  "i": 72,
  "pl": "Przez chwilę Ossipon wyobrażał sobie tę rozgorzałą od świateł salę zamienioną w straszną, czarną jamę pełną kotłującego się wstrętnego dymu, zawaloną ohydnym rumowiskiem ceglanego gruzu i okaleczonymi ciałami. Ujrzał tak wyraźnie obraz zniszczenia i śmierci, że wstrząsnął się znowu.",
  "start": 738.03
 },
 {
  "i": 73,
  "pl": "Jego towarzysz rzekł z miną spokojną i zarozumiałą:",
  "start": 756.97
 },
 {
  "i": 74,
  "pl": "— W gruncie rzeczy bezpieczeństwo człowieka zależy tylko od jego charakteru. Bardzo jest mało na świecie ludzi o charakterze tak opanowanym jak mój.",
  "start": 760.6
 },
 {
  "i": 75,
  "pl": "— Ciekawym, jakeście do tego doszli — burknął Ossipon.",
  "start": 771.22
 },
 {
  "i": 76,
  "pl": "— Siła indywidualności — rzekł tamten, nie podnosząc głosu; krzepki Ossipon słysząc to zdanie z ust człowieka o tak nędznej postaci, przygryzł dolną wargę. — Siła indywidualności — powtórzył człowieczek z ostentacyjnym spokojem.",
  "start": 777.33
 },
 {
  "i": 77,
  "pl": "— Mam środki po temu, aby być śmiercionośnym, ale rozumiecie, że ten fakt sam przez się nie jest dla mnie żadną ochroną. Broni mnie tylko przekonanie tych ludzi, że swoich środków użyję. Wierzą w to. Nieodparcie. I dlatego jestem śmiercionośny.",
  "start": 795.05
 },
 {
  "i": 78,
  "pl": "— Wśród nich są także silne indywidualności — mruknął złowrogo Ossipon.",
  "start": 813.47
 },
 {
  "i": 79,
  "pl": "— Możliwe. Ale widać chodzi o stopień siły, bo na przykład ja się ich nie boję. Na tym polega ich niższość. Oni nie mogą być inni. Ich charakter jest ugruntowany na konwencjonalnej moralności. Opiera się na społecznym porządku. Mój charakter wolny jest od wszystkiego, co sztuczne.",
  "start": 819.96
 },
 {
  "i": 80,
  "pl": "Oni są skrępowani mnóstwem konwencjonalnych przepisów. Związani są z życiem, które w tym wypadku jest tworem historycznym, zależnym od różnych względów i ograniczeń, złożonym, zorganizowanym tworem wystawionym zewsząd na ataki;",
  "start": 837.94
 },
 {
  "i": 81,
  "pl": "tymczasem ja związany jestem ze śmiercią, która nie zna żadnych ograniczeń i której atakować nie można. Moja wyższość jest oczywista.",
  "start": 853.2
 },
 {
  "i": 82,
  "pl": "— Ujmujecie to w sposób transcendentalny — rzekł Ossipon, śledząc zimny połysk okularów. — Słyszałem niedawno, jak Karl Yundt mówił coś bardzo podobnego.",
  "start": 864.61
 },
 {
  "i": 83,
  "pl": "— Karl Yundt — mruknął tamten pogardliwie — delegat Międzynarodowego Czerwonego Komitetu, był przez całe życie pozującym cieniem. Jest tu was trzech delegatów, prawda? Nie będę określał dwóch pozostałych, bo jednym z nich wy jesteście. To, co wszyscy trzej mówicie, nie ma w ogóle żadnego znaczenia.",
  "start": 876.56
 },
 {
  "i": 84,
  "pl": "Jesteście szacownymi delegatami do spraw propagandy rewolucyjnej, ale w tym sęk, że nie tylko nie potraficie myśleć niezależnie, zupełnie jak pierwszy lepszy szanowany kupiec czy dziennikarz, lecz żaden z was nie ma siły charakteru.",
  "start": 898.86
 },
 {
  "i": 85,
  "pl": "Ossipon nie mógł powstrzymać odruchu oburzenia.",
  "start": 913.45
 },
 {
  "i": 86,
  "pl": "— Czegóż wy od nas chcecie? — wykrzyknął stłumionym głosem. — I nad czym pracujecie sami?",
  "start": 917.84
 },
 {
  "i": 87,
  "pl": "— Nad udoskonaleniem zapalnika — brzmiała stanowcza odpowiedź. — Cóż znaczy ta krzywa mina? Widzicie, nie możecie znieść nawet wzmianki o czymś decydującym.",
  "start": 924.54
 },
 {
  "i": 88,
  "pl": "— Ja się wcale nie krzywię — warknął brutalnie udręczony Ossipon.",
  "start": 937.66
 },
 {
  "i": 89,
  "pl": "— Wy, rewolucjoniści — ciągnął tamten ze swobodną pewnością siebie — jesteście wszyscy w niewoli u porządku społecznego, który się was obawia; w niewoli zupełnie takiej samej, jak policja broniąca tego porządku.",
  "start": 942.92
 },
 {
  "i": 90,
  "pl": "To jasne, że jesteście jego niewolnikami, ponieważ chcecie ten porządek zrewolucjonizować. On rządzi zarówno waszą myślą, jak waszymi czynami, i dlatego ani wasze myśli, ani wasze czyny nigdy do niczego nie doprowadzą.",
  "start": 956.98
 },
 {
  "i": 91,
  "pl": "— Zamilkł spokojnie, rzekłbyś, ostatecznie, i prawie natychmiast podjął znów: — Nie jesteście ani o włos lepsi od sił przeciw wam zgrupowanych… na przykład od policji. Któregoś dnia zetknąłem się nagle z komisarzem Heatem na rogu Tottenham Court Road. Nie spuszczał ze mnie wzroku.",
  "start": 970.46
 },
 {
  "i": 92,
  "pl": "Ale ja na niego nie patrzyłem. Wystarczył mi jeden rzut oka. On myślał o wielu rzeczach — o swych przełożonych, o swej reputacji, o sądach, o swej pensji, o dziennikach… o tysiącu rzeczy. Ale ja myślałem tylko o swym doskonałym zapalniku. Komisarz Heat był dla mnie niczym.",
  "start": 988.42
 },
 {
  "i": 93,
  "pl": "Był dla mnie osobistością tak mało znaczącą jak… nic równie błahego nie mogę sobie przypomnieć — z wyjątkiem może Karla Yundta. Jeden wart drugiego. I terrorysta, i policjant — obaj z tej samej beczki.",
  "start": 1007.99
 },
 {
  "i": 94,
  "pl": "Rewolucja, legalność — to przeciwne sobie posunięcia w tej samej grze, formy nieróbstwa w gruncie rzeczy identyczne. Oni prowadzą swoją grę — i wy, ideowcy, swoją. Ale ja w żadną grę się nie bawię; ja pracuję czternaście godzin na dobę i czasem przymieram głodem.",
  "start": 1023.73
 },
 {
  "i": 95,
  "pl": "Moje doświadczenia wymagają niekiedy pieniędzy, a wtedy muszę się obejść parę dni bez jedzenia. Patrzycie na moje piwo. Tak. Wypiłem już dwa kufle i zaraz wypiję trzeci. Dziś urządziłem sobie święto i obchodzę je w samotności. Czemu nie?",
  "start": 1042.43
 },
 {
  "i": 96,
  "pl": "Mam dość sił, aby pracować samotnie, zupełnie samotnie, w absolutnej samotności. Pracuję w samotności od lat.",
  "start": 1057.27
 },
 {
  "i": 97,
  "pl": "Ciemny rumieniec pokrył twarz Ossipona.",
  "start": 1065.81
 },
 {
  "i": 98,
  "pl": "— Nad idealnym zapalnikiem… co? — zadrwił bardzo cicho.",
  "start": 1069.06
 },
 {
  "i": 99,
  "pl": "— Tak — odparł tamten. — Dobrzeście to określili. Nie znaleźlibyście nic nawet w części równie ścisłego na określenie waszej działalności, włączając w to wszystkie wasze komitety i delegacje. To ja jestem prawdziwym ideowcem.",
  "start": 1074.64
 },
 {
  "i": 100,
  "pl": "— Nie będziemy się o to spierać — rzekł Ossipon, przybierając minę wznoszenia się ponad względy osobiste. — Przykro mi, że będę jednak musiał zepsuć wam święto. Dziś rano w Greenwich Park jakiś człowiek został wysadzony w powietrze.",
  "start": 1091.4
 },
 {
  "i": 101,
  "pl": "— Skąd o tym wiecie?",
  "start": 1109.87
 },
 {
  "i": 102,
  "pl": "— Już od drugiej wykrzykują tę wiadomość na ulicach. Kupiłem dziennik i wbiegłem tutaj. Potem zobaczyłem, że siedzicie przy tym stoliku. Mam dziennik w kieszeni.",
  "start": 1111.8
 },
 {
  "i": 103,
  "pl": "Wyciągnął gazetę — duży różowy arkusz, jakby zarumieniony od żaru swych przekonań, które były optymistyczne. Przebiegł go wzrokiem.",
  "start": 1122.02
 },
 {
  "i": 104,
  "pl": "— Aha! Mam. Bomba w Greenwich, w parku. Mało szczegółów na razie. Pół do jedenastej. Mglisty ranek. Skutki wybuchu odczuto aż na Romney Road i Park Place. Olbrzymia wyrwa w ziemi pod drzewem, pełna zmiażdżonych korzeni i połamanych gałęzi. Naokoło szczątki ludzkiego ciała rozerwanego na strzępy.",
  "start": 1130.26
 },
 {
  "i": 105,
  "pl": "To już wszystko. Reszta same dziennikarskie bzdury. Piszą, że to z pewnością zbrodniczy zamach na obserwatorium. Hm. Trudno temu uwierzyć.",
  "start": 1150.3
 },
 {
  "i": 106,
  "pl": "Przez chwilę patrzył jeszcze w milczeniu na gazetę, wreszcie podał ją człowieczkowi, który spojrzał z roztargnieniem na dziennik i odłożył go bez słowa.",
  "start": 1160.35
 },
 {
  "i": 107,
  "pl": "Pierwszy odezwał się Ossipon tonem wciąż urażonym:",
  "start": 1169.77
 },
 {
  "i": 108,
  "pl": "— Uważacie, szczątki tylko jednego człowieka. Ergo³⁹: sam siebie wysadził w powietrze. To popsuje wam chyba nastrój… co? Czyście się spodziewali tego rodzaju posunięcia? Nie miałem najlżejszego wyobrażenia…",
  "start": 1174.11
 },
 {
  "i": 109,
  "pl": "nawet nie postało mi w głowie, że knują coś podobnego, że tego rodzaju historia ma się tu stać — tu, w Anglii. Zważywszy na obecne warunki jest to po prostu zbrodnia.",
  "start": 1188.51
 },
 {
  "i": 110,
  "pl": "Człowieczek podniósł rzadkie czarne brwi z obojętną pogardą.",
  "start": 1198.23
 },
 {
  "i": 111,
  "pl": "— Zbrodnia! Co przez to rozumiecie? Czym jest zbrodnia? Co chcecie przez to powiedzieć?",
  "start": 1203.31
 },
 {
  "i": 112,
  "pl": "— A jakże mam się wyrazić? Muszę używać ogólnie przyjętych słów — rzekł niecierpliwie Ossipon. — Chcę przez to powiedzieć, że owa historia może wpłynąć bardzo niekorzystnie na nasze położenie w Anglii. Mało wam jeszcze tej zbrodni?",
  "start": 1211.45
 },
 {
  "i": 113,
  "pl": "Jestem pewien, że w ostatnich czasach daliście komuś tego waszego towaru.",
  "start": 1226.07
 },
 {
  "i": 114,
  "pl": "Ossipon patrzył bacznie w twarz człowieczka. Tamten z całym spokojem podniósł z wolna głowę i opuścił ją.",
  "start": 1230.69
 },
 {
  "i": 115,
  "pl": "— Więc to wy! — wybuchnął dobitnym szeptem redaktor ulotek P. P. — Nie może być! Więc naprawdę rozdajecie to ot tak sobie, na żądanie, pierwszemu lepszemu durniowi, który się nawinie?",
  "start": 1238.9
 },
 {
  "i": 116,
  "pl": "— Tak jest! Skazany na zagładę ustrój społeczny nie został zbudowany z papieru i atramentu i nie wyobrażam sobie, aby kombinacja papieru z atramentem mogła położyć mu koniec, bez względu na to, co wy sobie wyobrażacie.",
  "start": 1252.7
 },
 {
  "i": 117,
  "pl": "Tak, rozdawałbym swój proch na wszystkie strony każdemu mężczyźnie, każdej kobiecie, każdemu durniowi, wszystkim, którym by się spodobało przyjść po to do mnie. Wiem, co myślicie. Ale ja się nie kieruję wskazówkami Czerwonego Komitetu.",
  "start": 1266.44
 },
 {
  "i": 118,
  "pl": "Gdyby was stąd wszystkich wyszczuli, albo uwięzili, albo na przykład ucięli wam głowy — nawet bym palcem nie kiwnął. To, co nas spotyka indywidualnie, nie ma najmniejszego znaczenia.",
  "start": 1280.25
 },
 {
  "i": 119,
  "pl": "Mówił niedbale, chłodno, prawie obojętnie i Ossipon, bardzo poruszony w skrytości ducha, starał się naśladować ten obojętny ton:",
  "start": 1294.05
 },
 {
  "i": 120,
  "pl": "— Gdyby tutejsza policja stała na wysokości zadania, podziurawiliby was kulami jak sito albo w biały dzień przygnietliby was z tyłu worami z piaskiem.",
  "start": 1302.47
 },
 {
  "i": 121,
  "pl": "Zdawało się, że człowieczek rozważył już ten punkt widzenia w swój zwykły, obojętny i pewny siebie sposób.",
  "start": 1313.36
 },
 {
  "i": 122,
  "pl": "— Tak — potwierdził z błyskawiczną gotowością. — Ale wówczas zadarliby z własnymi ustawami. Rozumiecie? To wymaga niepośledniej siły charakteru. Siły charakteru zupełnie specjalnej.",
  "start": 1319.51
 },
 {
  "i": 123,
  "pl": "Ossipon zmrużył oczy.",
  "start": 1334.35
 },
 {
  "i": 124,
  "pl": "— Przypuszczam, że tak by się właśnie z wami obeszli, gdybyście założyli wasze laboratorium w Stanach. Oni się nie ceremoniują ze swymi ustawami.",
  "start": 1336.79
 },
 {
  "i": 125,
  "pl": "— Nie mam zamiaru tam jechać, żeby się o tym przekonać. Zresztą wasza uwaga jest słuszna — przyznał człowieczek. — Tamci mają więcej charakteru i ten charakter jest na wskroś anarchistyczny. To urodzajny dla nas grunt. Stany Zjednoczone — bardzo dobry grunt.",
  "start": 1345.53
 },
 {
  "i": 126,
  "pl": "W tej wielkiej republice tkwi zaród zniszczenia. Temperament zbiorowy jest nastawiony przeciw prawu. Doskonale! Mogą nas powystrzelać, ale…",
  "start": 1361.25
 },
 {
  "i": 127,
  "pl": "— Jesteście dla mnie zbyt abstrakcyjni — burknął Ossipon, zatroskany i markotny.",
  "start": 1374.23
 },
 {
  "i": 128,
  "pl": "— Jestem tylko logiczny — zaprzeczył człowieczek. — Istnieje kilka rodzajów logiki. Moja należy do kategorii właściwej ludziom oświeconym. Ameryka jest w porządku. To Anglia jest niebezpieczna ze względu na swe idealistyczne wyobrażenia o praworządności.",
  "start": 1379.78
 },
 {
  "i": 129,
  "pl": "Duch społeczny tego narodu cechują skrupuły, uprzedzenia i to dla naszego dzieła jest zgubne. Mówicie, że Anglia jest jedynym naszym schronieniem. Tym gorzej. To nasza Kapua⁴⁰! Po co nam schronienie? Gadacie tu, drukujecie, knujecie i nic nie robicie.",
  "start": 1397.92
 },
 {
  "i": 130,

  "start": 1417.46
 },
 {
  "i": 131,
  "pl": "Wzruszył lekko ramionami i dodał z tą samą swobodną pewnością siebie:",

 {

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
</body>
</html>
