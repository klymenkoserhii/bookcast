<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to conrad-tajny-agent_014_xiii.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-13.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

<style>
  :root {

  .file{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}

</style>

const SECTIONS = [
 {
  "i": 0,
  "pl": "Olbrzymia żelazna kłódka na drzwiach schowka była w tym pokoju jedynym przedmiotem, na którym oczy mogły spocząć bez odrazy, jaką budziły wszystkie inne znajdujące się tam sprzęty, dziwnie brzydkie w kształcie i wykonane z lichego materiału.",
  "start": 2.15
 },
 {
  "i": 1,
  "pl": "Kłódki tej nikt nie chciał kupić z powodu jej okazałych rozmiarów i właściciel sklepu dla marynarzy we wschodniej części Londynu odstąpił ją Profesorowi za parę pensów.",
  "start": 16.89
 },
 {
  "i": 2,
  "pl": "Pokój był duży, czysty, przyzwoity i biedny tym rodzajem biedy, który ze wszystkich ludzkich głodów zaspokaja tylko jeden: głód chleba.",
  "start": 27.85
 },
 {
  "i": 3,
  "pl": "Na ścianach nie było nic oprócz tapet, płacht arsenowej zieleni⁹², pokrytych gdzieniegdzie nieokreślonymi smugami i plamami, co przypominało spłowiałe mapy niezamieszkanych kontynentów.",
  "start": 37.03
 },
 {
  "i": 4,
  "pl": "Przy sosnowym stole blisko okna siedział towarzysz Ossipon z głową wspartą na piersiach. Profesor, odziany w swoje jedyne ubranie, z tandetnego samodziału, kłapał tam i sam po gołych deskach parą niewiarygodnie zniszczonych pantofli, trzymając ręce głęboko w wypchanych kieszeniach kurtki.",
  "start": 49.08
 },
 {
  "i": 5,
  "pl": "Opowiadał gościowi o swoich niedawnych odwiedzinach u apostoła Michaelisa. Wzorowy anarchista trochę się nawet rozkrochmalił.",
  "start": 67.76
 },
 {
  "i": 6,
  "pl": "— Ten człowiek nie wiedział nic a nic o śmierci Verloca. Naturalnie. Przecież na dzienniki nawet nie spojrzy. Mówi, że zanadto go przygnębiają. Ale mniejsza z tym. Wszedłem do domku. Ani żywej duszy. Musiałem wołać ze sześć razy, zanim mi odpowiedział. Myślałem, że jeszcze leży w łóżku i śpi.",
  "start": 76.85
 },
 {
  "i": 7,
  "pl": "Ale nic podobnego. Pisał swoją książkę już od czterech godzin. Siedział w tej małej klatce wśród całych fur rękopisu. Na stole leżała obok niego niedojedzona marchew. Jest teraz na diecie złożonej z surowej marchwi i odrobiny mleka.",
  "start": 98.53
 },
 {
  "i": 8,
  "pl": "— No i jak on przy tym wygląda? — spytał obojętnie towarzysz Ossipon.",
  "start": 114.37
 },
 {
  "i": 9,
  "pl": "— Niebiańsko… Podniosłem garść kartek z podłogi. Ubóstwo jego rozumowania jest zdumiewające. Żadnej logiki. Nie umie myśleć konsekwentnie. Ale to jeszcze nic. Podzielił swą biografię na trzy części, zatytułowane: Wiara, Nadzieja, Miłość⁹³.",
  "start": 120.97
 },
 {
  "i": 10,
  "pl": "Opracowuje teraz plan świata pomyślanego jako olbrzymi, przyjemny szpital wśród kwiatów i ogrodów, w którym to szpitalu silni mają się oddawać pielęgnowaniu słabych.",
  "start": 138.08
 },
 {
  "i": 11,
  "pl": "Profesor umilkł na chwilę.",
  "start": 148.9
 },
 {
  "i": 12,
  "pl": "— Czy wy, Ossipon, możecie sobie wyobrazić ten absurd? Poświęcać się pielęgnowaniu słabych! Słabi to źródło wszystkiego zła na tej ziemi — ciągnął z ponurą pewnością siebie.",
  "start": 152.34
 },
 {
  "i": 13,
  "pl": "— Powiedziałem mu na to, że ja marzę o świecie podobnym do jatek, o świecie, gdzie wszystkich słabych wzięłoby się za łeb, aby ich wytępić. Rozumiecie mnie, Ossipon? To oni są źródłem wszystkiego zła!",
  "start": 164.59
 },
 {
  "i": 14,
  "pl": "Narzucają nam swoją złowrogą władzę — słabi, niedołężni, głupi, tchórzliwi, ludzie o wątłych sercach i niewolniczym duchu. Ale przedstawiają wielką siłę. Z nich składa się tłum. Ich jest królestwo ziemi⁹⁴. Tępić, tępić! to jedyna droga postępu. Jedyna! Słyszycie, Ossipon?",
  "start": 176.25
 },
 {
  "i": 15,
  "pl": "Najpierw musi zginąć mrowie słabych, a potem ci, co są tylko względnie silni. Rozumiecie? Najpierw ślepi, potem głusi i niemi, potem chromi i kulawi — i tak dalej. Każde zepsucie, każdy występek, każdy przesąd, każda tradycja musi znaleźć swój kres.",
  "start": 196.45
 },
 {
  "i": 16,
  "pl": "— A co zostanie? — zapytał Ossipon stłumionym głosem.",
  "start": 213.06
 },
 {
  "i": 17,
  "pl": "— Ja zostanę… jeśli jestem na to dość silny — oświadczył malutki, wybladły Profesor, którego wielkie uszy, cienkie jak błona i odstające od małej czaszki, zabarwiły się nagle ciemną czerwienią. — Nacierpiałem się już dość przez tyranię słabych — ciągnął gwałtownie.",
  "start": 218.73
 },
 {
  "i": 18,
  "pl": "Dotknął bocznej kieszeni i mówił dalej: — A jednak jestem siłą. Tylko muszę mieć czas! Czas! Dajcie mi czasu! Ach, to ludzkie mrowie, zbyt głupie, aby czuć litość lub strach. Niekiedy zdaje mi się, że wszystko jest po ich stronie. Wszystko… nawet śmierć — moja własna broń.",
  "start": 237.97
 },
 {
  "i": 19,
  "pl": "— Chodźcie i napijcie się ze mną piwa w „Sylenie” — rzekł krzepki Ossipon po chwili ciszy, przerywanej tylko szybkim kłapaniem pantofli Wzorowego Anarchisty. Profesor zgodził się. Był tego dnia na swój sposób wesoły. Uderzył Ossipona po ramieniu.",
  "start": 259.03
 },
 {
  "i": 20,
  "pl": "— Piwa? Dobrze! Pijmy i weselmy się, bo jesteśmy silni, a jutro umrzemy.",
  "start": 276.01
 },
 {
  "i": 21,
  "pl": "Zaczął wkładać trzewiki, nie przestając mówić właściwym sobie urywanym, stanowczym tonem.",
  "start": 281.25
 },
 {
  "i": 22,
  "pl": "— Co wam jest, Ossipon? Wyglądacie markotnie i poszukujecie nawet mojego towarzystwa. Słyszę, że widują was ciągle tam, gdzie się gada głupstwa przy kieliszku. Co się stało? Czyżbyście już porzucili kolekcję waszych kobiet? One są tymi słabymi, którzy karmią silnych — co?",
  "start": 287.41
 },
 {
  "i": 23,
  "pl": "Tupnął obutą nogą i wziął z podłogi drugi sznurowany but, ciężki, o grubej podeszwie, niewyczyszczony i pokryty łatami. Uśmiechnął się do siebie złośliwie.",
  "start": 306.38
 },
 {
  "i": 24,
  "pl": "— Powiedzcie mi, Ossipon, straszny człowieku, czy też któraś z waszych ofiar odebrała sobie kiedyś życie? A może wasze tryumfy są jeszcze niekompletne? Albowiem wielkość pieczętuje się tylko krwią. Krwią. Śmiercią. Spójrzcie na historię.",
  "start": 316.64
 },
 {
  "i": 25,
  "pl": "— Żebyście z piekła nie wyszli — rzekł Ossipon z głową wciąż odwróconą.",
  "start": 333.18
 },
 {
  "i": 26,
  "pl": "— Terefere! Zostawcie piekło słabym, którzy je wymyślili dla silnych. Ossipon, czuję do was życzliwą pogardę. Nie potrafilibyście zabić i muchy.",
  "start": 338.7
 },
 {
  "i": 27,
  "pl": "Ale tocząc się na szczycie omnibusu w stronę piwiarni „Sylen”, Profesor stracił na humorze.",
  "start": 350.44
 },
 {
  "i": 28,
  "pl": "Widok tłumów rojących się po chodnikach przygniótł jego pewność siebie ciężarem wątpliwości i niepokoju; ciężaru tego pozbywał się tylko wówczas, gdy przesiedział czas jakiś samotnie w izbie o wielkim schowku zamkniętym na olbrzymią kłódkę.",
  "start": 356.34
 },
 {
  "i": 29,
  "pl": "— A więc — doszedł go z tyłu głos Ossipona, który siedział w omnibusie tuż za nim — a więc Michaelis marzy o świecie wyglądającym jak wspaniały, wesoły szpital?",
  "start": 372.71
 },
 {
  "i": 30,
  "pl": "— Właśnie. Jak olbrzymi zakład dobroczynny do leczenia słabych — potwierdził szyderczo Profesor.",
  "start": 383.83
 },
 {
  "i": 31,
  "pl": "— Cóż za absurd — przyznał Ossipon. — Słabości uleczyć nie można. Ale w gruncie rzeczy Michaelis może się tak bardzo nie myli. Za dwieście lat światem będą władali lekarze. Nauka rządzi światem już teraz. Rządzi z ukrycia, lecz rządzi.",
  "start": 390.61
 },
 {
  "i": 32,
  "pl": "A cała nauka musi ześrodkować się w końcu na nauce leczenia — i to nie słabych, lecz silnych. Ludzkość pragnie żyć… żyć.",
  "start": 406.49
 },
 {
  "i": 33,
  "pl": "— Ludzkość sama nie wie, czego chce — oświadczył Profesor, błyskając zarozumiale okularami oprawnymi w żelazo.",
  "start": 416.84
 },
 {
  "i": 34,
  "pl": "— Ale wy wiecie — burknął Ossipon. — Dopiero co żądaliście czasu… czasu. No więc doktorzy dostarczą wam czasu pod dostatkiem, jeśli na to zasłużycie.",
  "start": 425.79
 },
 {
  "i": 35,
  "pl": "Uważacie się za silnego, ponieważ macie w kieszeni dość prochu, aby przenieść się do wieczności i zabrać z sobą jeszcze — powiedzmy — ze dwadzieścia osób. Ale wieczność jest próżnią, psiakrew. Czego wam potrzeba, to właśnie czasu.",
  "start": 435.87
 },
 {
  "i": 36,
  "pl": "Gdybyście spotkali człowieka, który by mógł wam zapewnić dziesięć lat życia, uznalibyście go za pana.",
  "start": 451.78
 },
 {
  "i": 37,
  "pl": "— Dewizą moją jest: ani Boga, ani pana — rzekł Profesor sentencjonalnie i wstał, aby wysiąść.",
  "start": 459.55
 },
 {
  "i": 38,
  "pl": "Ossipon szedł za nim.",
  "start": 467.27
 },
 {
  "i": 39,
  "pl": "— Poczekajcie aż przyjdzie wasza godzina i będziecie żegnać się z życiem — odparł, zeskakując za Profesorem — z waszym marnym, nędznym, parszywym życiem — ciągnął, mijając jezdnię i dając susa na chodnik.",
  "start": 470.52
 },
 {
  "i": 40,
  "pl": "— Ossipon, blagier z was i tyle — rzekł Profesor, otwierając władczą dłonią drzwi sławnego „Sylena”. A gdy już zasiedli przy stoliku, zaczął uzupełniać swą łaskawą opinię. — Nie jesteście nawet doktorem. Natomiast jesteście śmieszni.",
  "start": 485.14
 },
 {
  "i": 41,
  "pl": "Wasze wyobrażenia o ludzkości, która na całej ziemi, od bieguna do bieguna, będzie pokazywała język i zażywała pigułki na rozkaz kilku nadętych pajaców, oto proroctwo godne tego, co je wypowiedział. Proroctwo! Po kiego licha myśleć o tym, co będzie! — Podniósł kufel.",

 },
 {
  "i": 42,
  "pl": "— Za zagładę tego, co jest — rzekł spokojnie.",
  "start": 519.2
 },
 {
  "i": 43,
  "pl": "Wypił i zapadł z powrotem w zwykłe sobie, osobliwie znaczące milczenie. Gnębiła go myśl o ludzkości nieprzeliczonej jak piasek na morskim brzegu, równie jak piasek niezniszczalnej i trudnej do opanowania. Wśród bezmiaru jej biernych ziarenek huk pękających bomb zatraca się bez echa.",

 },

  "start": 539.88
 },
 {
  "i": 45,
  "pl": "Ossipon, niby przynaglony tajemniczą siłą, wyjął z kieszeni kilkakrotnie złożony dziennik. Profesor podniósł głowę, słysząc szelest.",

 },

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
</body>
</html>
