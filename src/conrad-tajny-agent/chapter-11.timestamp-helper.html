<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to conrad-tajny-agent_012_xi.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-11.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tajny agent · Rozdział XI — timestamp helper</title>
<style>
  :root {
    --bg:#fbfaf7; --surface:#fff; --ink:#15140f; --ink-soft:#3d3a33; --muted:#7c766c;
    --line:#e5e0d6; --line-strong:#d3ccbe; --accent:#2c6e4f; --accent-soft:#e6f1ea;
    --accent-ink:#fff; --warn:#b4541f; --warn-soft:#fdf0ea; --shadow:0 1px 2px rgba(24,20,10,.05),0 6px 18px rgba(24,20,10,.04);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#12120f; --surface:#1b1a16; --ink:#f2efe6; --ink-soft:#d6d1c4; --muted:#9a9486;
    --line:#2b2924; --line-strong:#3b3831; --accent:#7fc9a2; --accent-soft:#1e2b23;
    --accent-ink:#10231a; --warn:#e0a07c; --warn-soft:#2a1a14;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:15px}

  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hrow{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  h1{font-family:var(--serif);font-size:1rem;margin:0;flex:1 1 220px;font-weight:600}
  h1 small{display:block;font-family:var(--sans);font-size:.7rem;color:var(--muted);font-weight:400}

  .transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-size:.8rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
         background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--line-strong)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  button.ghost{background:transparent}
  button.danger{color:var(--warn);border-color:var(--line)}
  .time{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .time small{font-size:.75rem;color:var(--muted);letter-spacing:0}

  main{max-width:1080px;margin:0 auto;padding:14px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .panel h2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
            margin:0;padding:12px 14px 8px;font-weight:600}

  .seek{width:100%;accent-color:var(--accent);margin:0;padding:0 14px 10px;cursor:pointer}
  .bar{padding:0 14px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  ol.rows{list-style:none;margin:0;padding:0 6px 10px;max-height:62vh;overflow:auto}
  li.row{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  li.row:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
  li.row.active{border-color:var(--accent);background:var(--accent-soft)}
  li.row.empty .val{color:var(--warn)}
  .idx{font-family:var(--mono);font-size:.7rem;color:var(--muted);width:26px;flex:none;text-align:right}
  .txt{flex:1;min-width:0;font-size:.82rem;color:var(--ink-soft);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .val{font-family:var(--mono);font-size:.78rem;width:62px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
  input.t{font-family:var(--mono);font-size:.76rem;width:72px;flex:none;text-align:right;
          padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
  .stamp{font-size:.7rem;padding:2px 7px;flex:none}

  pre#out{margin:0;padding:10px 12px 14px;font-family:var(--mono);font-size:.68rem;line-height:1.5;
          max-height:44vh;overflow:auto;white-space:pre;color:var(--ink-soft);
          border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 14px 14px}
  .hint{font-size:.75rem;color:var(--muted);margin:0;padding:0 14px 12px}
  kbd{font-family:var(--mono);font-size:.7rem;padding:1px 5px;border:1px solid var(--line-strong);
      border-radius:5px;background:var(--bg-soft,#f4f1ea)}
  .flash{animation:flash .45s ease}
  @keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);
         padding:8px 14px;border-radius:999px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:.94}
  .file{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
  .file input{font-size:.72rem;max-width:180px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>Timestamp helper<small>Tajny agent · Rozdział XI · tap <kbd>Space</kbd> at every PL section start</small></h1>
    <div class="transport">
      <button id="play" class="primary" type="button">▶ Play</button>
      <span class="time"><span id="tnow">0:00.0</span> <small>/ <span id="tdur">0:00</span></small></span>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Sections — <span id="counter">0</span> stamped</h2>
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="bar">
      <button id="undo" class="ghost" type="button" title="Backspace">↩ Undo</button>
      <button id="markNext" type="button" title="Space">⟵ Stamp here</button>
      <button id="clear" class="ghost danger" type="button">Clear all</button>
      <label class="file">MP3 <input id="file" type="file" accept="audio/*"></label>
    </div>
    <ol class="rows" id="rows"></ol>
  </section>

  <section class="panel">
    <h2>Generated array</h2>
    <p class="hint">
      <kbd>Space</kbd> stamp · <kbd>P</kbd> play/pause · <kbd>↑↓</kbd> row ·
      <kbd>Enter</kbd> seek to row · <kbd>Backspace</kbd> undo
    </p>
    <div class="bar">
      <button id="copy" class="primary" type="button">Copy</button>
      <button id="download" type="button">Download .js</button>
      <button id="theme" class="ghost" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
    <pre id="out"></pre>
  </section>
</main>

<div class="toast" id="toast"></div>
