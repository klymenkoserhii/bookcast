<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to conrad-tajny-agent_011_x.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-10.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

<style>
  :root {

</style>

 {

  "pl": "Nadinspektor, jadący szybko dorożką od Soho w stronę Westminsteru, wysiadł w samym środku imperium, nad którym słońce nigdy nie zachodzi⁷⁵. Salutowało mu kilku dzielnych policjantów; nie wydawali się szczególnie przejęci obowiązkiem czuwania nad tym dostojnym terenem.",

 {

  "start": 19.67
 },
 {
  "i": 2,

 {

 {

  "pl": "Toodles ma nadzieję, że posłowie będą się z nudów wymykać i lada chwila posiedzenie zostanie odroczone ze względu na brak quorum⁷⁶. Ale może ów poseł umyślnie tak mowę przeciąga, aby żarłok Cheesemann mógł swobodnie zjeść obiad.",

 {

 {
  "i": 11,

 {

 {

 {

 {

 {

 {

 {

 },
 {
  "i": 40,
  "pl": "Nadinspektor zobaczył najpierw tylko dużą, białą rękę podpierającą dużą głowę i zasłaniającą górną część dużej bladej twarzy. Otwarte pudełko z depeszami stało na biurku obok kilku podłużnych arkuszy papieru i rozrzuconej wiązki gęsich piór.",

 {

 {

 {

 {

 },
 {
  "i": 52,
  "pl": "— Więc czego się pan dowiedział? — spytał wielki człowiek.",
  "start": 517.84
 },
 {
  "i": 53,
  "pl": "— Przede wszystkim dowiedziałem się, że były więzień Michaelis nie ma z tym nic wspólnego, choć istotnie chłopiec przebywał chwilowo razem z nim na wsi aż do dzisiaj, do ósmej rano. Jest więcej niż prawdopodobne, że Michaelis nie wie nic o wszystkim aż do tej chwili.",
  "start": 521.36
 },
 {
  "i": 54,
  "pl": "— Pan jest tego pewien? — zapytał wielki człowiek.",
  "start": 537.44
 },
 {
  "i": 55,
  "pl": "— Zupełnie pewien, sir Ethelredzie. Ten Verloc pojechał tam dziś rano i zabrał chłopca niby to na przechadzkę. Ponieważ działo się to nie po raz pierwszy, Michaelis nie mógł w tym widzieć nic niezwykłego. Zresztą Verloc, oburzony do żywego, wyjawił mi wszystko bez wyjątku.",
  "start": 541.91
 },
 {
  "i": 56,
  "pl": "Okazało się, że po prostu stracił głowę, zastraszony niesłychaną sceną, której ani pan, ani ja nie wzięlibyśmy na serio; na nim zrobiła jednak wielkie wrażenie.",
  "start": 556.81
 },
 {
  "i": 57,
  "pl": "Nadinspektor wyłożył zwięźle wielkiemu człowiekowi, który siedział bez ruchu i osłaniał dłonią oczy zażywające wypoczynku, jak pan Verloc ocenił postępowanie i charakter pana Władimira. Zdawało się, że nadinspektor nie odmawia tej ocenie pewnej słuszności. Lecz wielka osobistość wypowiedziała uwagę:",
  "start": 568.15
 },
 {
  "i": 58,
  "pl": "— To wszystko wygląda mi bardzo fantastycznie.",
  "start": 586.83
 },
 {
  "i": 59,
  "pl": "— Prawda? Niby jakiś okrutny żart. Ale nasz Verloc wziął to zdaje się na serio. Poczuł się zagrożony. Przedtem, jak pan wie, porozumiewał się bezpośrednio z samym Stott- -Wartenheimem i nabrał przekonania, że usługi jego, Verloca, są niezbędne. Otrzeźwiono go w sposób niezmiernie brutalny.",
  "start": 591.62
 },
 {
  "i": 60,
  "pl": "Najwidoczniej stracił głowę. Rozgniewał się i przestraszył. Według mego przekonania wyobraził sobie, że ci ludzie z ambasady mogą go nie tylko wyrzucić, ale i wydać w taki lub inny sposób…",
  "start": 610.64
 },
 {
  "i": 61,
  "pl": "— Jak długo pan z nim rozmawiał? — rozległ się nagle zza ręki głos wielkiego dygnitarza.",
  "start": 623.43
 },
 {
  "i": 62,
  "pl": "— Jakieś czterdzieści minut, sir Ethelredzie, w mocno podejrzanym hotelu Continental; siedzieliśmy zamknięci w pokoju, który wziąłem na noc. Okazało się, że Verloc jest pod wpływem reakcji następującej po zbrodniczym wysiłku. Nie można nazwać tego człowieka zatwardziałym przestępcą.",
  "start": 630.17
 },
 {
  "i": 63,
  "pl": "Najwidoczniej nie przewidywał śmierci owego nieszczęsnego chłopca — swojego szwagra. Jego śmierć zrobiła na Verlocu wstrząsające wrażenie — widziałem to wyraźnie. Może jest bardzo wrażliwy. Może nawet lubił chłopca… któż to wie?",
  "start": 647.55
 },
 {
  "i": 64,
  "pl": "Spodziewał się zapewne, że chłopiec ucieknie, a wówczas byłoby prawie niemożliwe ustalić, kto jest winowajcą. W najgorszym wypadku przewidywał co najwyżej aresztowanie szwagra.",
  "start": 662.49
 },
 {
  "i": 65,
  "pl": "Nadinspektor przerwał swe dociekania i przez chwilę rozmyślał.",
  "start": 673.2
 },
 {
  "i": 66,
  "pl": "— Ale jak mógł się w takim razie spodziewać, że jego udział w tej historii pozostanie ukryty, to jest dla mnie niezrozumiale — podjął znowu, gdyż nie wiedział o uwielbieniu Steviego dla pana Verloca (który był dobry) ani o niezłomności, z jaką chłopiec potrafił milczeć.",
  "start": 676.55
 },
 {
  "i": 67,
  "pl": "Dowiodła tego jeszcze owa dawna historia z fajerwerkami na schodach; Stevie opierał się wówczas przez całe lata prośbom i pieszczotom, i gniewowi, i wszelkim innym środkom badania stosowanym przez ukochaną siostrę. Bo Steviemu można było zaufać… — Nie mam pojęcia — ciągnął dalej nadinspektor.",
  "start": 693.29
 },
 {
  "i": 68,
  "pl": "— Może wcale o tym nie myślał? A teraz powiem coś, co wyda się dziwaczne, sir Ethelredzie: oto widok przerażonego Verloca przywiódł mi na myśl kogoś, kto odebrał sobie życie, aby położyć kres swym udręczeniom, i nagle przekonuje się, że samobójstwo wcale mu nie pomogło.",
  "start": 712.75
 },
 {
  "i": 69,
  "pl": "Nadinspektor wypowiedział to porównanie takim tonem, jakby za nie przepraszał. Ale pewna przesada stylu ma to do siebie, że uwydatnia treść wypowiadanej myśli i wielki człowiek nie poczuł się urażony.",
  "start": 730.63
 },
 {
  "i": 70,
  "pl": "Lekki skurcz targnął jego dużym ciałem, mało widocznym w półmroku zielonych jedwabnych abażurów, i dużą głową wspartą na dużej dłoni, a temu skurczowi towarzyszył przerywany, zduszony, lecz potężny odgłos: wielki człowiek roześmiał się.",
  "start": 743.39
 },
 {
  "i": 71,
  "pl": "— Co pan z nim zrobił?",
  "start": 760.24
 },
 {
  "i": 72,
  "pl": "Nadinspektor odrzekł natychmiast:",
  "start": 762.84
 },
 {
  "i": 73,
  "pl": "— Ponieważ śpieszyło mu się widać bardzo do żony, która została w sklepie, pozwoliłem mu odejść, sir Ethelredzie.",
  "start": 765.28
 },
 {
  "i": 74,
  "pl": "— Jak to? Przecież on ucieknie.",
  "start": 772.52
 },
 {
  "i": 75,
  "pl": "— Pozwolę sobie być innego zdania. Dokąd by mógł uciec? A przy tym trzeba pamiętać, że Verloc musi także się strzec niebezpieczeństwa grożącego mu ze strony kolegów. Tam w sklepie jest na swym stanowisku. Jak by mógł wyjaśnić opuszczenie tego stanowiska?",
  "start": 775.32
 },
 {
  "i": 76,
  "pl": "Ale nawet gdyby miał zupełną swobodę ruchów, nic by teraz nie zrobił. Brak mu dostatecznej energii, aby powziąć jakiekolwiek postanowienie.",
  "start": 792.32
 },
 {
  "i": 77,
  "pl": "Niech mi też będzie wolno zaznaczyć, że gdybym go był uwięził, musielibyśmy trzymać się pewnej linii postępowania, co do której pragnę najpierw usłyszeć pana zdanie.",
  "start": 800.22
 },
 {
  "i": 78,
  "pl": "Wielka osobistość dźwignęła się z krzesła — imponująca, niewyraźna w zielonawym mroku pokoju.",
  "start": 810.37
 },
 {
  "i": 79,
  "pl": "— Zobaczę się dziś z prokuratorem i poślę po pana jutro rano. Czy pan ma jeszcze coś do powiedzenia?",
  "start": 817.33
 },
 {
  "i": 80,
  "pl": "Nadinspektor podniósł się także, smukły i giętki.",
  "start": 824.53
 },
 {
  "i": 81,
  "pl": "— Sądzę, że nie, sir Ethelredzie, mógłbym tylko wejść w szczegóły, które…",
  "start": 829.56
 },
 {
  "i": 82,
  "pl": "— Nie, nie. Żadnych szczegółów.",
  "start": 835.34
 },
 {
  "i": 83,
  "pl": "Wielka, niewyraźna postać, rzekłbyś, cofnęła się, jakby w fizycznym lęku przed szczegółami, lecz zaraz potem podeszła do inspektora, rozdęta, olbrzymia, imponująca, wyciągając dużą rękę.",
  "start": 838.75
 },
 {
  "i": 84,
  "pl": "— I pan mówi, że ten człowiek ma żonę?",
  "start": 852.39
 },
 {
  "i": 85,
  "pl": "— Tak, sir Ethelredzie — rzekł nadinspektor, ściskając z szacunkiem wyciągniętą dłoń. — Ma naprawdę żonę, z którą żyje w poprawnym małżeńskim stosunku.",
  "start": 856.59
 },
 {
  "i": 86,
  "pl": "Powiedział mi, że po rozmowie w ambasadzie byłby wszystko rzucił, byłby usiłował sprzedać sklep i wyjechać z kraju, ale był pewien, że jego żona nie zechce nawet słyszeć o wyjeździe za granicę.",
  "start": 867.09
 },
 {
  "i": 87,
  "pl": "To bardzo charakterystyczne dla małżeńskich stosunków — ciągnął nieco chmurnie nadinspektor, którego żona również nie chciała słyszeć o wyjeździe za granicę. — Tak, to jest autentyczna żona. A delikwent był autentycznym szwagrem. Mamy tu pewnego rodzaju dramat rodzinny.",
  "start": 877.39
 },
 {
  "i": 88,
  "pl": "Nadinspektor roześmiał się z lekka, ale myśli wielkiego człowieka powędrowały już daleko, może do spraw polityki wewnętrznej kraju; był to teren jego mężnej krucjaty przeciw poganinowi zwanemu Cheesemannem.",
  "start": 897.18
 },
 {
  "i": 89,
  "pl": "Nadinspektor wyszedł cicho z pokoju; uszło to uwadze dygnitarza, który poniekąd zapomniał już o swym urzędniku.",
  "start": 911.82
 },
 {
  "i": 90,
  "pl": "W nadinspektorze także grały instynkty krzyżowca. Sprawa, która z tych lub innych względów zniechęciła do siebie komisarza Heata, wydała mu się opatrznościowym punktem wyjścia dla własnej krucjaty. Rozpoczęcie jej leżało mu bardzo na sercu.",
  "start": 919.0
 },
 {
  "i": 91,
  "pl": "Szedł z wolna ku domowi, rozmyślając po drodze o swym przedsięwzięciu i analizując psychologię pana Verloca z odrazą nie pozbawioną zadowolenia. Całą drogę odbył pieszo.",
  "start": 934.52
 },
 {
  "i": 92,
  "pl": "Przekonawszy się, że w salonie jest ciemno, poszedł na górę i spędził czas jakiś między ubieralnią a pokojem sypialnym, przebierając się i chodząc tu i tam niby zamyślony lunatyk. Ale otrząsnął się z zadumy i wyszedł znów na ulicę, aby się udać do wielkiej pani, która opiekowała się Michaelisem.",
  "start": 945.58
 },
 {
  "i": 93,
  "pl": "Wiedział, że będzie tam życzliwie przyjęty. Wchodząc do mniejszego z dwóch salonów, spostrzegł żonę w małej grupce gości obok fortepianu.",
  "start": 964.48
 },
 {
  "i": 94,
  "pl": "Młodociany kompozytor, będący na drodze do sławy, siedział na taborecie, rozmawiając z dwoma tęgimi panami, których plecy wyglądały staro, i z trzema smukłymi kobietami, których plecy wyglądały młodo.",
  "start": 973.59
 },
 {
  "i": 95,
  "pl": "Za niebieskim parawanem tylko dwie osoby towarzyszyły opiekunce Michaelisa: mężczyzna i kobieta; siedzieli obok siebie na fotelach u końca szezlongu⁷⁸. Wielka pani wyciągnęła rękę do nadinspektora.",
  "start": 985.81
 },
 {
  "i": 96,
  "pl": "— Nie spodziewałam się wcale, że zobaczę pana dziś wieczór. Annie mówiła mi…",
  "start": 998.23
 },
 {
  "i": 97,
  "pl": "— Tak. Sam nie miałem pojęcia, że uporam się tak prędko z robotą.",
  "start": 1004.16
 },
 {
  "i": 98,
  "pl": "Nadinspektor dodał ściszonym głosem:",
  "start": 1008.43
 },
 {
  "i": 99,
  "pl": "— Miło mi panią zawiadomić, że Michaelis jest zupełnie wyłączony z tej sprawy…",
  "start": 1011.56
 },
 {
  "i": 100,
  "pl": "Protektorka byłego więźnia przyjęła to z oburzeniem.",
  "start": 1016.84
 },
 {
  "i": 101,
  "pl": "— Jak to? Czyżby byli u nas idioci, podejrzewający go o związek z…",
  "start": 1020.68
 },
 {
  "i": 102,
  "pl": "— Bynajmniej nie idioci — przerwał z szacunkiem nadinspektor. — Nawet całkiem zręczni ludzie… zupełnie wystarczająco jak na swoje potrzeby.",
  "start": 1026.04
 },
 {
  "i": 103,
  "pl": "Zapadło milczenie. Mężczyzna u końca szezlongu przestał rozmawiać z sąsiadką i przyglądał się nadinspektorowi z niewyraźnym uśmiechem.",
  "start": 1035.34
 },
 {
  "i": 104,
  "pl": "— Nie pamiętam, czy panowie już się spotkali — rzekła wielka pani.",
  "start": 1043.84
 },
 {
  "i": 105,
  "pl": "Pan Władimir i nadinspektor, przedstawieni sobie, stwierdzili nawzajem swoje istnienie z drobiazgową i czujną uprzejmością.",
  "start": 1048.9
 },
 {
  "i": 106,
  "pl": "— Ten człowiek mnie nastraszył — oświadczyła nagle dama siedząca obok pana Władimira i kiwnęła głową w jego stronę. Nadinspektor znał ową damę.",
  "start": 1058.04
 },
 {
  "i": 107,
  "pl": "— Nie wygląda pani na przestraszoną — wyrzekł, przyjrzawszy się jej sumiennie swym zmęczonym, spokojnym wzrokiem. A jednocześnie pomyślał, że w tym domu wcześniej lub później można było się zetknąć z każdym.",
  "start": 1069.96
 },
 {
  "i": 108,
  "pl": "Różowa twarz pana Władimira mieniła się uśmiechem, albowiem był dowcipny, lecz oczy jego zachowały powagę, jak u człowieka, który wie, o co mu chodzi.",
  "start": 1083.38
 },
 {
  "i": 109,
  "pl": "— W każdym razie usiłował mnie nastraszyć — poprawiła się znajoma nadinspektora.",
  "start": 1094.09
 },
 {
  "i": 110,
  "pl": "— Może to jego zwyczaj — rzekł nadinspektor pod wpływem nieodpartego natchnienia.",
  "start": 1100.08
 },
 {
  "i": 111,
  "pl": "— Pan Władimir groził społeczeństwu przeróżnymi okropnościami — ciągnęła dama, wymawiając słowa z wolna i jakby pieszczotliwie — a wszystko z powodu tego wybuchu w Greenwich Park.",
  "start": 1106.46
 },
 {
  "i": 112,
  "pl": "Okazuje się, że powinniśmy wszyscy drżeć ze strachu przed tym, co nastąpi, jeśli ci ludzie nie zostaną wytępieni na całym świecie. Nie miałam pojęcia, że to taka ważna sprawa.",
  "start": 1119.0
 },
 {
  "i": 113,
  "pl": "Pan Władimir, udając, że nie zwraca na te słowa uwagi, pochylił się ku szezlongowi, mówiąc coś miłym, ściszonym głosem, ale usłyszał, jak nadinspektor rzekł:",
  "start": 1129.84
 },
 {
  "i": 114,
  "pl": "— Jestem przekonany, że pan Władimir ma bardzo dokładne pojęcie o istotnym znaczeniu tej sprawy.",
  "start": 1139.22
 },
 {
  "i": 115,
  "pl": "Pan Władimir zadał sobie pytanie, do czego zmierza ten przeklęty, natrętny policjant. Jako potomek pokoleń, które były ofiarą narzędzi służących samowładczej potędze, bał się policji rasowo i narodowo, a poza tym bał się jej indywidualnie.",
  "start": 1145.96
 },
 {
  "i": 116,
  "pl": "Była to słabość dziedziczna, zupełnie niezależna od jego rozsądku, czy rozumu, czy doświadczenia. Taki już się urodził.",
  "start": 1162.06
 },
 {
  "i": 117,
  "pl": "A uczucie to, przypominające irracjonalny wstręt, jaki niektórzy mają do kotów, bynajmniej się nie sprzeciwiało niezmiernej pogardzie, którą pan Władimir żywił dla policji angielskiej. Skończył zdanie skierowane do pani domu i obrócił się trochę na krześle.",
  "start": 1169.04
 },
 {
  "i": 118,
  "pl": "— Pan chce zapewne powiedzieć, że my mamy duże doświadczenie, jeśli chodzi o tych ludzi.",
  "start": 1186.61
 },
 {
  "i": 119,
  "pl": "Tak jest istotnie; cierpimy wiele od ich działalności, podczas gdy państwo tutaj — pan Władimir zawahał się chwilę, uśmiechnięty i jakby zakłopotany — podczas gdy państwo cierpicie z zadowoleniem obecność ich między sobą — zakończył, ukazując dołki w świeżo wygolonych policzkach.",
  "start": 1193.37
 },
 {
  "i": 120,
  "pl": "Potem dodał poważniej: — Powiedziałbym nawet, że cierpimy przez nich tyle właśnie dlatego, że państwo cierpicie ich między sobą.",
  "start": 1216.58
 },
 {
  "i": 121,
  "pl": "Gdy pan Władimir przestał mówić, nadinspektor spuścił oczy i rozmowa się urwała. Prawie bezpośrednio potem pan Władimir pożegnał się z gospodynią. Skoro się tylko odwrócił od szezlongu, nadinspektor wstał również.",
  "start": 1225.94
 },
 {
  "i": 122,
  "pl": "— Myślałam, że pan zostanie z nami i zabierze Annie do domu — rzekła opiekunka Michaelisa.",
  "start": 1240.19
 },
 {
  "i": 123,
  "pl": "— Przypomniałem sobie, że muszę dziś jeszcze trochę popracować.",
  "start": 1246.55
 },
 {
  "i": 124,
  "pl": "— W związku z…?",
  "start": 1250.98
 },
 {
  "i": 125,
  "pl": "— No tak, do pewnego stopnia.",
  "start": 1253.26
 },
 {
  "i": 126,
  "pl": "— Niechże mi pan powie, co to jest właściwie, ta okropna historia?",
  "start": 1256.96
 },
 {
  "i": 127,
  "pl": "— Trudno powiedzieć, co to jest, ale może wyniknie z tego une cause célebre⁷⁹ — rzekł nadinspektor.",
  "start": 1262.1
 },
 {
  "i": 128,
  "pl": "Wyszedł spiesznie z salonu i zastał jeszcze w hallu pana Władimira, otulającego starannie szyję dużym szalikiem. Za nim stał lokaj, trzymając palto. Drugi lokaj czekał u drzwi, aby je w odpowiedniej chwili otworzyć. Nadinspektorowi podano płaszcz; wyszedł natychmiast.",
  "start": 1268.02
 },
 {
  "i": 129,
  "pl": "Zstąpiwszy z kilku frontowych schodów przystanął, jakby się namyślając, w którą by stronę się udać. Pan Władimir dostrzegł to przez drzwi, które pozostały otwarte i zatrzymał się jeszcze w sieni, aby wyjąć cygaro i poprosić o ogień.",
  "start": 1285.4
 },
 {
  "i": 130,
  "pl": "Starszy mężczyzna we fraku podał mu zapałkę z miną pełną spokojnej troskliwości. Ale zapałka zgasła; wówczas lokaj zamknął drzwi i pan Władimir zapalił powoli i starannie duże hawańskie cygaro.",
  "start": 1298.88
 },
 {
  "i": 131,
  "pl": "Gdy nareszcie wydostał się z domu, spostrzegł z odruchem wstrętu, że ten „przeklęty policjant” sterczy jeszcze wciąż na chodniku.",
  "start": 1313.22
 },
 {
  "i": 132,
  "pl": "„Czyżby na mnie czekał?” — pomyślał pan Władimir, rozglądając się za dorożką. Nie było żadnej. Parę prywatnych wehikułów czekało tuż przy chodniku.",
  "start": 1322.37
 },
 {
  "i": 133,
  "pl": "Latarnie ich paliły się równo, konie stały w zupełnym spokoju jak wyrzeźbione z kamienia, stangreci siedzieli bez najlżejszego ruchu w obszernych futrzanych pelerynach; białe, skórzane końce wielkich batów wisiały nieporuszenie.",
  "start": 1332.51
 },
 {
  "i": 134,
  "pl": "Pan Władimir zaczął iść, a „przeklęty policjant” szedł krok w krok obok niego, nie mówiąc ani słowa. Za czwartym krokiem pan Władimir poczuł wściekłość i niepokój. Dłużej tak trwać nie mogło.",
  "start": 1346.69
 },
 {
  "i": 135,

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
