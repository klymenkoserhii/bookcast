<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to conrad-tajny-agent_013_xii.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-12.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

<head>
<meta charset="utf-8">

<title>Tajny agent · Rozdział XII — timestamp helper</title>
<style>
  :root {

    --line:#2b2924; --line-strong:#3b3831; --accent:#7fc9a2; --accent-soft:#1e2b23;

  h1 small{display:block;font-family:var(--sans);font-size:.7rem;color:var(--muted);font-weight:400}

  .transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-size:.8rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line);

          max-height:44vh;overflow:auto;white-space:pre;color:var(--ink-soft);

  .hint{font-size:.75rem;color:var(--muted);margin:0;padding:0 14px 12px}
  kbd{font-family:var(--mono);font-size:.7rem;padding:1px 5px;border:1px solid var(--line-strong);
      border-radius:5px;background:var(--bg-soft,#f4f1ea)}
  .flash{animation:flash .45s ease}
  @keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);
         padding:8px 14px;border-radius:999px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:.94}
  .file{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
  .file input{font-size:.72rem;max-width:180px}
</style>

<header>
  <div class="hrow">

<script>

/* ===================================================================== */

const SECTIONS = [
 {
  "i": 0,
  "pl": "Winnie Verloc, wdowa po panu Verlocu, siostra wiernego Stevie (który Bogu ducha winien został rozerwany na strzępy w przekonaniu, że spełnia czyn humanitarny), nie przekroczyła drzwi saloniku. Dobiegła aż do progu, uciekając od płynącej ciurkiem krwi, ale był to odruch instynktownego wstrętu.",
  "start": 1.61
 },
 {
  "i": 1,
  "pl": "Przystanęła z głową spuszczoną, zapatrzona w próżnię.",
  "start": 20.55
 },
 {
  "i": 2,
  "pl": "Jakby przebyła długi szereg lat w ucieczce przez mały salonik, pani Verloc stojąca u drzwi była osobą zupełnie różną od tamtej kobiety, co wsparta o kanapę wskutek lekkiego zawrotu głowy zażywała głębokiego spokoju, rozkoszując się bezczynnością i brakiem odpowiedzialności. Zawrót głowy minął.",
  "start": 23.91
 },
 {
  "i": 3,
  "pl": "Lecz pani Verloc nie była już spokojna. Zaczęła się bać.",
  "start": 43.39
 },
 {
  "i": 4,
  "pl": "Starała się nie patrzeć na spoczywającego małżonka, ale nie dlatego, aby w niej budził strach. Pan Verloc nie wyglądał przerażająco. Zdawało się, że wygodnie mu leżeć. A zresztą był martwy. Pani Verloc nie żywiła czczych złudzeń co do umarłych.",
  "start": 46.89
 },
 {
  "i": 5,
  "pl": "Nic nie sprowadzi ich z powrotem na ziemię, ani miłość, ani nienawiść. Umarli nic nam zrobić nie mogą. To tak jakby ich wcale nie było. Czuła coś na kształt surowej pogardy dla tego mężczyzny, który dał się zabić tak łatwo. Był panem domu, był jej mężem i mordercą Steviego.",
  "start": 63.83
 },
 {
  "i": 6,
  "pl": "A teraz nie liczył się już wcale. Znaczył mniej niż jego własne ubranie, palto, buty — niż ten kapelusz leżący na podłodze. Był niczym. Nie zasługiwał nawet na spojrzenie. Już nawet nie był mordercą biednego jej brata.",
  "start": 81.41
 },
 {
  "i": 7,
  "pl": "Jedynym mordercą, którego ludzie znajdą w tym pokoju, przyszedłszy do pana Verloca — będzie ona!",
  "start": 96.19
 },
 {
  "i": 8,
  "pl": "Ręce jej trzęsły się tak mocno, że na próżno usiłowała po dwakroć zawiązać woalkę. Nie była już osobą swobodną i nieodpowiedzialną. Bała się. Cios, którym przebiła pana Verloca, był zwykłym uderzeniem.",
  "start": 103.54
 },
 {
  "i": 9,
  "pl": "Ulżył krzykom zduszonym w gardle, łzom zaschłym w rozpalonych oczach, ulżył rozjątrzonej wściekłości i oburzeniu na straszliwą rolę odegraną przez tego człowieka, który był teraz niczym — człowieka, który jej wydarł Steviego. Jakaś tajemnicza siła pokierowała jej ręką.",
  "start": 116.57
 },
 {
  "i": 10,
  "pl": "A krew spływająca na ziemię spod rękojeści noża zamieniła cios w pospolite morderstwo. Pani Verloc, która powstrzymywała się zawsze od zgłębiania faktów, musiała teraz sięgnąć wzrokiem aż do dna tego faktu.",
  "start": 133.39
 },
 {
  "i": 11,
  "pl": "Nie zobaczyła tam prześladującej ją twarzy, ani widma patrzącego z wyrzutem, ani skruchy, ani żadnego oderwanego pojęcia. Zobaczyła tam co innego. Szubienicę. Pani Verloc bała się szubienicy.",
  "start": 147.19
 },
 {
  "i": 12,
  "pl": "Bała się jej jakby teoretycznie.",
  "start": 162.22
 },
 {
  "i": 13,
  "pl": "Nie widziała nigdy tego ostatniego argumentu ludzkiej sprawiedliwości — prócz drzeworytów ilustrujących pewien rodzaj opowieści⁸⁵, gdzie szubienica wznosi się na czarnym, burzliwym tle nieba obwieszona łańcuchami i szkieletami, wśród ptaków, które krążą i wydziobują oczy wisielcom.",
  "start": 164.47
 },
 {
  "i": 14,
  "pl": "Było to istotnie przerażające, lecz pani Verloc, choć mało wykształcona, miała jednak pewne wiadomości o różnych zwyczajach w swym kraju i wiedziała, że szubienic nie wznosi się już na wybrzeżach romantycznych, posępnych rzek lub na omiatanych wichrami przylądkach, lecz na podwórzach więzień⁸⁶.",
  "start": 182.17
 },
 {
  "i": 15,
  "pl": "Wprowadza się tam o świcie skazańca między cztery wysokie mury, niby do głębokiej jamy, aby dokonać wyroku ze straszliwym spokojem i, jak donosiły zawsze sprawozdania dzienników, „w obecności władz”.",
  "start": 199.91
 },
 {
  "i": 16,
  "pl": "Z oczyma wbitymi w ziemię, z nozdrzami drgającymi od męki i wstydu, wyobraziła sobie, że stoi osamotniona wśród tłumu obcych panów w cylindrach i że ci panowie przystępują z całym spokojem do założenia jej stryczka na szyję. Nigdy! Przenigdy! Jak się to może odbywać?",
  "start": 212.49
 },
 {
  "i": 17,
  "pl": "Nie umiała sobie wyobrazić szczegółów takiej spokojnej egzekucji i przerażenie jej nabrało cech obłędu. Dzienniki nie podawały szczegółów poza jednym, który był zawsze uwydatniony z pewnym naciskiem przy końcu pobieżnego sprawozdania. Pani Verloc zapamiętała ten szczegół.",
  "start": 231.31
 },
 {
  "i": 18,
  "pl": "Głowę jej przeszył okrutny, palący ból, jakby rozpalona igła ryła w jej mózgu zdanie: „Spuszczono delikwenta z wysokości czternastu stóp”.",
  "start": 249.05
 },
 {
  "i": 19,
  "pl": "Te słowa wstrząsnęły nią po prostu fizycznie. Jej gardło zaczęło naprężać się konwulsyjnie, aby przeciwdziałać uduszeniu, a strach przed zawiśnięciem na stryczku był tak żywy, że chwyciła się oburącz za głowę, jakby chciała zapobiec oderwaniu jej od tułowia.",
  "start": 259.76
 },
 {
  "i": 20,
  "pl": "„Spuszczono delikwenta z wysokości czternastu stóp”… Nie! To się stać nie może. Ona tego nie wytrzyma. Nie jest w stanie tego sobie wyobrazić. Nawet myśli o tym nie zniesie. Pani Verloc postanowiła pójść natychmiast i rzucić się z mostu do rzeki.",
  "start": 276.05
 },
 {
  "i": 21,
  "pl": "Udało jej się wreszcie zawiązać woalkę. Z twarzą jakby zamaskowaną, cała w czerni od stóp do głów poza paru kwiatami na kapeluszu, spojrzała machinalnie na zegar. Widać stanął. Nie mogła uwierzyć, aby tylko parę minut upłynęło od chwili, gdy patrzyła nań po raz ostatni. Naturalnie, że to niemożliwe.",
  "start": 293.18
 },
 {
  "i": 22,
  "pl": "Zegar stał przez cały ten czas. A w rzeczywistości zaledwie trzy minuty upłynęły, odkąd pierwszy raz odetchnęła głęboko, swobodnie po zadaniu ciosu, aż do chwili, gdy postanowiła rzucić się do Tamizy. Ale nie mogła temu uwierzyć.",
  "start": 313.46
 },
 {
  "i": 23,
  "pl": "Wydało jej się, że słyszała czy też czytała, iż zegary zatrzymują się zawsze w chwili morderstwa — aby świadczyć przeciw mordercy. Nic jej to nie obeszło. „Na most — i w wodę”. Lecz ruchy jej były powolne.",
  "start": 328.3
 },
 {
  "i": 24,
  "pl": "Wlokła się z trudem przez sklep i musiała oprzeć się o klamkę drzwi wejściowych, nim znalazła dość sił, by je otworzyć. Bała się ulicy, bo teraz ulica prowadziła albo na szubienicę, albo do rzeki. Przekroczyła próg, wyciągnąwszy naprzód głowę i ramiona, jakby rzucała się za parapet mostu.",
  "start": 343.74
 },
 {
  "i": 25,
  "pl": "Kontakt ze świeżym powietrzem miał przedsmak tonięcia; lepka wilgoć ją ogarnęła, dostała się do nozdrzy, osiadła na włosach. Deszczu właściwie nie było, ale każda z gazowych lamp miała wąską rdzawą aureolę z mgły.",
  "start": 361.52
 },
 {
  "i": 26,
  "pl": "Wóz z końmi odjechał; na mrocznej ulicy zasłonięte okno gospody żarzyło się słabo tuż nad chodnikiem czworokątną plamą brudnokrwawego światła.",
  "start": 375.38
 },
 {
  "i": 27,
  "pl": "Pani Verloc wlokła się z wolna ku temu oknu i myślała o tym, że nie ma żadnych przyjaciół. To była prawda. To była tak dalece prawda, że wśród nagłego porywu tęsknoty za przyjazną ludzką twarzą przyszła Winnie na myśl tylko pani Neale, posługaczka, i nikt poza tym. Nie miała żadnych znajomości.",
  "start": 385.62
 },
 {
  "i": 28,
  "pl": "Nikomu nie zabraknie jej towarzystwa. Nie trzeba jednak myśleć, że wdowa po panu Verlocu zapomniała o matce. Nic podobnego. Winnie była dobrą córką, ponieważ była pełną poświęcenia siostrą. Ale to właśnie matka szukała w niej zawsze oparcia.",
  "start": 406.48
 },
 {
  "i": 29,
  "pl": "Winnie nie mogła się z jej strony spodziewać ani rady, ani pociechy. A teraz, po śmierci Steviego, więzy między nią a matką jak gdyby się zerwały. Niepodobna było stawić się przed staruszką z tą straszliwą wieścią. Przy tym matka mieszkała w innej części miasta.",
  "start": 421.68
 },
 {
  "i": 30,
  "pl": "Winnie pragnęła tylko dotrzeć do rzeki. O matce usiłowała zapomnieć.",
  "start": 438.82
 },
 {
  "i": 31,
  "pl": "Każdy krok kosztował ją tyle wysiłku, że się wydawał ostatni. Wlokąc się z trudem, minęła żarzące się czerwono okno traktierni. „Na most — i w wodę” — powtórzyła z zaciekłym uporem. Lecz zaledwie zdążyła wyciągnąć rękę, aby się oprzeć o słup latarni.",
  "start": 443.92
 },
 {
  "i": 32,
  "pl": "„Nie ma mowy, żebym tam doszła przed ranem” — pomyślała. Strach śmierci paraliżował jej wysiłki, aby uciec od szubienicy. Miała wrażenie, że wlecze się tą ulicą od godzin. „Nie dojdę tam nigdy” — pomyślała. „Znajdą mnie błąkającą się po mieście. To za daleko”. Przystanęła, dysząc pod czarną woalką.",
  "start": 462.27
 },
 {
  "i": 33,
  "pl": "„Spuszczono delikwenta z wysokości czternastu stóp”.",
  "start": 484.64
 },
 {
  "i": 34,
  "pl": "Odepchnęła gwałtownie latarnię i poczuła, że idzie. Lecz fala słabości ogarnęła ją znów jak morze i zabrała jej serce z piersi.",
  "start": 489.17
 },
 {
  "i": 35,
  "pl": "— Nigdy tam nie dojdę — wyszeptała, przystając nagle i chwiejąc się z lekka. — Nigdy.",
  "start": 497.94
 },
 {
  "i": 36,
  "pl": "Zrozumiawszy, że niepodobna jej dotrzeć nawet do najbliższego mostu, pani Verloc pomyślała o ucieczce za granicę.",
  "start": 504.43
 },
 {
  "i": 37,
  "pl": "Błysnęło jej to nagle. Mordercy uciekają. Uciekają do obcych krajów. Do Hiszpanii, do Kalifornii. Dla niej były to puste dźwięki. Szeroki świat stworzony dla ludzkiej chwały był dla pani Verloc rozległą próżnią. Nie wiedziała dokąd się zwrócić.",
  "start": 511.87
 },
 {
  "i": 38,
  "pl": "Mordercy mają przyjaciół, stosunki, wspólników — mają doświadczenie. Ona nie miała nikogo. Była najbardziej samotną z zabójczyń.",
  "start": 528.71
 },
 {
  "i": 39,
  "pl": "W całym Londynie była zupełnie sama; to miasto pełne cudów i błota, i labirynt jego ulic, i morze jego świateł, wszystko było ogarnięte beznadziejnym mrokiem, spoczywało na dnie czarnej otchłani, z której żadna kobieta nie mogła wydostać się bez pomocy.",
  "start": 538.61
 },
 {
  "i": 40,
  "pl": "Pani Verloc zachwiała się, pochyliła naprzód i szła dalej przed siebie na oślep, bojąc się okropnie, aby nie upaść; nagle, uszedłszy kilka kroków, doznała uczucia ulgi i bezpieczeństwa. Podniósłszy głowę, zobaczyła męskie oblicze wpatrzone z bliska w jej twarz zasłoniętą woalką.",
  "start": 554.19
 },
 {
  "i": 41,
  "pl": "Towarzysz Ossipon nie lękał się nieznajomych kobiet i żadne poczucie fałszywej delikatności nie przeszkadzało mu zaznajomić się z tą kobietą najwidoczniej pijaniusieńką. Towarzysz Ossipon interesował się kobietami.",
  "start": 571.47
 },
 {
  "i": 42,
  "pl": "Podtrzymał ową kobietę dwiema szerokimi dłońmi, patrząc na nią ciągle w sposób rzeczowy, a gdy usłyszał cichy okrzyk: „Pan Ossipon!”, ledwie jej z rąk nie wypuścił.",
  "start": 584.73
 },
 {
  "i": 43,
  "pl": "— Pani Verloc! — zawołał. — Pani tutaj!",
  "start": 596.42
 },
 {
  "i": 44,
  "pl": "Wydało mu się niepodobieństwem, aby była pijana. Ale nigdy nie można wiedzieć. Przestał zastanawiać się nad tym i aby nie zniechęcić łaskawych losów, które oddawały mu w ręce wdowę po towarzyszu Verlocu, usiłował przyciągnąć ją do piersi.",
  "start": 600.9
 },
 {
  "i": 45,
  "pl": "Ku jego zdumieniu pozwoliła na to z łatwością i nawet wsparła się chwilę o jego ramię, zanim spróbowała się wyswobodzić. Towarzysz Ossipon nie chciał łaskawego losu przynaglać. Cofnął ramię naturalnym ruchem.",
  "start": 615.88
 },
 {
  "i": 46,
  "pl": "— Pan mnie poznał — wyjąkała, stojąc przed nim dość pewnie na nogach.",
  "start": 628.94
 },
 {
  "i": 47,
  "pl": "— Naturalnie, że panią poznałem — rzekł Ossipon bez zająknienia. — Bałem się, że pani upadnie. Zbyt często myślałem o pani w ostatnich czasach, aby pani nie poznać wszędzie, o każdej porze dnia. Myślałem o pani zawsze — od pierwszej chwili, kiedy panią zobaczyłem.",
  "start": 634.8
 },
 {
  "i": 48,
  "pl": "Pani Verloc zdawała się go nie słyszeć.",
  "start": 651.78
 },
 {
  "i": 49,
  "pl": "— Pan idzie do sklepu? — spytała nerwowo.",
  "start": 655.03
 },
 {
  "i": 50,
  "pl": "— Tak — odrzekł Ossipon. — Wyszedłem z domu natychmiast po przeczytaniu dziennika.",
  "start": 658.87
 },
 {
  "i": 51,
  "pl": "W rzeczywistości zaś towarzysz Ossipon ukrywał się przeszło dwie godziny w pobliżu Brett Street, nie mogąc się zdecydować na żaden odważny krok. Krzepki anarchista nie był właściwie mężnym zdobywcą. Pamiętał, że pani Verloc nie odpowiadała nigdy na jego spojrzenia najlżejszym znakiem zachęty.",
  "start": 665.38
 },
 {
  "i": 52,
  "pl": "Zresztą przyszło mu na myśl, iż sklep jest zapewne strzeżony przez policję, a nie życzył sobie, aby policja powzięła przesadne wyobrażenie o jego rewolucyjnych sympatiach. Nawet i teraz nie wiedział dokładnie, co robić.",
  "start": 682.5
 },
 {
  "i": 53,
  "pl": "W stosunku do jego zwykłych miłosnych poczynań było to przedsięwzięcie wielkie i poważne. Nie wiedział, jak dużo mógłby osiągnąć, ani jak daleko będzie się musiał posunąć, aby zdobyć to, co jest do zdobycia — jeśli w ogóle w tym wypadku coś zdobyć można.",
  "start": 694.46
 },
 {
  "i": 54,
  "pl": "Te wątpliwości przyćmiły radość Ossipona i nadały jego głosowi wstrzemięźliwość odpowiadającą sytuacji.",
  "start": 709.92
 },
 {
  "i": 55,
  "pl": "— Czy zechce mi pani powiedzieć, dokąd pani szła? — rzekł ściszonym głosem.",
  "start": 717.26
 },
 {
  "i": 56,
  "pl": "— Niech pan nie pyta! — zawołała pani Verloc, opanowując gwałtowny wstrząs. Cała jej potężna żywotność wzdrygnęła się na myśl o śmierci. — Wszystko jedno, dokąd szłam…",
  "start": 723.6
 },
 {
  "i": 57,
  "pl": "Ossipon doszedł do wniosku, że jest bardzo podniecona, ale najzupełniej trzeźwa. Milczała chwilę u jego boku, a potem nagle zrobiła coś, czego zupełnie nie oczekiwał. Wsunęła mu rękę pod ramię. Ten gest zaskoczył go, zwłaszcza stanowczość, którą wyczuł w dotknięciu.",
  "start": 736.81
 },
 {
  "i": 58,
  "pl": "Ale sprawa była delikatna i towarzysz Ossipon zachował się z delikatnością. Poprzestał na lekkim przytuleniu tej ręki do swych krzepkich żeber. Jednocześnie zaś uczuł, że pani Verloc ciągnie go naprzód i poddał się temu. Przy końcu Brett Street zdał sobie sprawę, iż pani Verloc zwraca się na lewo.",
  "start": 753.23
 },
 {
  "i": 59,
  "pl": "Znów jej się poddał.",
  "start": 770.87
 },
 {
  "i": 60,
  "pl": "Handlarz owoców na rogu zagasił gorejącą wspaniałość swych pomarańcz i cytryn; Brett Place pogrążył się w mroku usianym mglistymi aureolami nielicznych latarni, zaznaczających trójkątny kształt placu; w środku tkwiły trzy lampy na jednym słupie.",
  "start": 772.89
 },
 {
  "i": 61,
  "pl": "Dwie ciemne postacie mężczyzny i kobiety idących pod rękę sunęły z wolna wzdłuż murów, jak para bezdomnych kochanków wśród beznadziejnej nocy.",
  "start": 789.07
 },
 {
  "i": 62,
  "pl": "— Co pan na to powie, jeśli się przyznam, że pana szukałam? — rzekła pani Verloc, ściskając mocno jego ramię.",
  "start": 798.18
 },
 {
  "i": 63,
  "pl": "— Powiem, że nikt chętniej ode mnie nie dopomoże pani w jej troskach — odrzekł Ossipon, czując, iż zbliża się do celu z szybkością wręcz niesłychaną. Zawrotne tempo, jakie przybrała owa delikatna sprawa, tamowało mu oddech.",
  "start": 805.36
 },
 {
  "i": 64,
  "pl": "— W moich troskach — powtórzyła z wolna pani Verloc.",
  "start": 820.02
 },
 {
  "i": 65,
  "pl": "— Otóż to właśnie.",
  "start": 824.36
 },
 {
  "i": 66,
  "pl": "— A czy pan wie, jakie mam troski? — wyszeptała z dziwnym naciskiem.",
  "start": 826.26
 },
 {
  "i": 67,
  "pl": "— W dziesięć minut po przeczytaniu wieczornej gazety — odrzekł Ossipon z zapałem — natknąłem się na człowieka, którego pani może widziała parę razy w sklepie; pomówiłem z nim i ta rozmowa wyjaśniła mi wszystko. Zaraz potem wyruszyłem tutaj, nie wiedząc, czy pani…",
  "start": 831.38
 },
 {
  "i": 68,
  "pl": "Podobała mi się pani od pierwszej chwili, kiedy panią ujrzałem — zawołał, jakby nie mogąc się opanować.",
  "start": 848.94
 },
 {
  "i": 69,
  "pl": "Towarzysz Ossipon słusznie przypuszczał, że nie ma kobiety, która by choć trochę nie uwierzyła takiemu oświadczeniu. Ale nie wiedział, że pani Verloc uczepiła się jego słów z zapamiętałością, jaką instynkt samozachowawczy daje uchwytowi tonącego człowieka.",
  "start": 855.46
 },
 {
  "i": 70,
  "pl": "Dla wdowy po panu Verlocu ten krzepki anarchista był promiennym zwiastunem życia.",
  "start": 869.52
 },
 {
  "i": 71,
  "pl": "Szli powoli krok w krok.",
  "start": 874.54
 },
 {
  "i": 72,
  "pl": "— Tak mi się też zdawało — szepnęła po cichu pani Verloc.",
  "start": 877.23
 },
 {
  "i": 73,
  "pl": "— Wyczytała to pani z mych oczu — poddał Ossipon z wielką pewnością siebie.",
  "start": 881.82
 },
 {
  "i": 74,
  "pl": "— Tak — tchnęła w pochylone ku niej ucho.",
  "start": 886.73
 },
 {
  "i": 75,
  "pl": "— Tego rodzaju uczucie nie mogło się ukryć przed taką kobietą jak pani — ciągnął dalej, usiłując oderwać myśli od względów materialnych, jak na przykład rentowność sklepu na Brett Street oraz wysokość sumy, którą pan Verloc mógł zostawić w banku.",
  "start": 890.55
 },
 {
  "i": 76,
  "pl": "Ossipon usiłował patrzeć na tę sprawę tylko od strony uczuciowej. A w głębi ducha poniekąd gorszył się swym powodzeniem. Verloc był człowiekiem porządnym i, o ile można było sądzić, mężem bardzo przyzwoitym.",
  "start": 904.89
 },
 {
  "i": 77,
  "pl": "Lecz towarzysz Ossipon nie miał zamiaru przeciwstawiać się swemu szczęściu ze względu na człowieka, który już nie żył. Poskromił więc współczucie dla ducha towarzysza Verloca i mówił dalej:",
  "start": 918.41
 },
 {
  "i": 78,
  "pl": "— Nie potrafiłem ukryć swojej miłości. Pani przepełniała mi duszę. Ośmielę się twierdzić, że musiała pani wyczytać to z moich oczu. Ale nie byłem tego pewien. Pani wydawała mi się zawsze taka nieprzystępna…",
  "start": 929.46
 },
 {
  "i": 79,
  "pl": "— A czegóż innego mógł się pan spodziewać? — wybuchnęła pani Verloc. — Przecież byłam kobietą uczciwą…",
  "start": 944.72
 },
 {
  "i": 80,
  "pl": "Zamilkła, a potem rzekła z chmurną urazą jakby do samej siebie:",
  "start": 951.94
 },
 {
  "i": 81,
  "pl": "— Póki on nie zrobił mnie tym, czym jestem.",
  "start": 956.44
 },
 {
  "i": 82,
  "pl": "Ossipon pominął to milczeniem i podjął znowu:",
  "start": 959.3
 },
 {
  "i": 83,
  "pl": "— Ja zawsze uważałem, że on nie był pani godzien — rzekł, przestając się troszczyć o lojalność względem zmarłego. — Należał się pani lepszy los.",
  "start": 962.0
 },
 {
  "i": 84,
  "pl": "— Lepszy los! — przerwała gorzko pani Verloc. — Ukradł mi siedem lat życia.",
  "start": 972.42
 },
 {
  "i": 85,
  "pl": "— Wydawało się, że pani jest z nim bardzo szczęśliwa — starał się Ossipon usprawiedliwić obojętność swego dawnego postępowania. — To mnie właśnie onieśmielało. Miałem wrażenie, że pani go kocha. Dziwiłem się… i byłem zazdrosny — dodał.",
  "start": 978.82
 },
 {
  "i": 86,
  "pl": "— Ja miałam go kochać? — wybuchnęła szeptem pani Verloc ze wzgardą i wściekłością. — Kochać! Byłam mu dobrą żoną. Jestem kobietą uczciwą. A pan myślał, że go kochałam. Pan! Posłuchaj, Tomie…",
  "start": 995.48
 },
 {
  "i": 87,
  "pl": "Dźwięk tego imienia przejął dumą towarzysza Ossipona. Albowiem na imię było mu Aleksander, a Tomem zwali go tylko najbliżsi, używając tego spieszczenia w chwilach poufnych zwierzeń. Nie wiedział, że pani Verloc je znała.",
  "start": 1009.96
 },
 {
  "i": 88,
  "pl": "Tymczasem nie tylko je zauważyła, ale przechowała czule w pamięci — a może i w sercu.",
  "start": 1024.9
 },
 {
  "i": 89,
  "pl": "— Posłuchaj mnie, Tomie! Byłam kiedyś młodą dziewczyną. Życie mnie nie szczędziło. Czułam się znużona. Ze swojej pracy musiałam utrzymywać dwoje ludzi i zdawało mi się, że nie dam sobie rady. Dwoje ludzi — matkę i brata. Chłopiec był naprawdę bardziej moim dzieckiem niż dzieckiem matki.",
  "start": 1030.77
 },
 {
  "i": 90,
  "pl": "Ileż ja nocy przesiedziałam, trzymając go na rękach, samiutka na całym piętrze, a miałam wtedy zaledwie osiem lat. A potem… Mówię ci, on był moim dzieckiem… Ty nie możesz tego zrozumieć. Żaden mężczyzna tego nie zrozumie. Co miałam począć? Znałam wtedy jednego młodego człowieka…",
  "start": 1048.59
 },
 {
  "i": 91,
  "pl": "Wspomnienie wczesnej, romantycznej miłości do młodego rzeźnika — niby wizerunek objawionego ideału — przetrwało uporczywie w jej sercu, drżącym teraz ze strachu przed szubienicą i pełnym buntu przeciw śmierci.",
  "start": 1065.43
 },
 {
  "i": 92,
  "pl": "— Kochałam wtedy tego człowieka — ciągnęła wdowa po panu Verlocu. — On chyba także wyczytał mi to z oczu. Zarabiał dwadzieścia pięć szylingów na tydzień; ojciec zagroził, że go wypędzi z domu, jeśli będzie taki głupi, żeby się żenić z dziewczyną mającą na głowie matkę kalekę i brata półgłówka.",
  "start": 1079.36
 },
 {
  "i": 93,
  "pl": "Ale on mimo to kręcił się koło mnie, aż wreszcie raz wieczorem zdobyłam się na odwagę i zatrzasnęłam mu drzwi przed nosem. Musiałam to zrobić, choć go tak kochałam. Dwadzieścia pięć szylingów na tydzień! Nadarzył się drugi mężczyzna — porządny lokator. Co miałam zrobić? Pójść na ulicę?",
  "start": 1097.39
 },
 {
  "i": 94,
  "pl": "Tamten drugi wyglądał na zacnego człowieka. I chciał się koniecznie ze mną żenić. Co miałam począć z matką i tym biednym chłopcem? Co począć? Zgodziłam się. Wyglądał dobrodusznie, miał hojną rękę, miał pieniądze, nigdy mi nic nie wypominał.",
  "start": 1117.74
 },
 {
  "i": 95,
  "pl": "Siedem lat… siedem lat byłam dobrą żoną dla tego wzoru dobroci, zacności, hojności, dla tego… A on mnie kochał. O tak. Kochał mnie, aż nieraz chciałam…. Siedem lat. Siedem lat byłam mu żoną. A wiesz, czym on był naprawdę, ten twój kochany przyjaciel? Wiesz, czym on był?… Diabłem!",
  "start": 1133.8
 },
 {
  "i": 96,
  "pl": "W szepcie jej taka była siła i taka zawziętość, że towarzysz Ossipon oniemiał.",
  "start": 1155.15
 },
 {
  "i": 97,
  "pl": "Winnie Verloc chwyciła go za ramiona oburącz, stając naprzeciw niego wśród opadającej mgły, wśród mroku i pustki Brett Place, gdzie wszystkie odgłosy życia gubiły się jakby w trójkątnej studni z asfaltu i cegieł, ze ślepych domów i nieczułych kamieni.",
  "start": 1160.63
 },
 {
  "i": 98,
  "pl": "— Nie, nie wiedziałem o tym — oświadczył z pewnego rodzaju bezsilną głupotą, której śmieszność była stracona dla tej kobiety drżącej przed szubienicą — ale teraz już wiem.",
  "start": 1176.66
 },
 {
  "i": 99,
  "pl": "Ja… ja rozumiem — plątał się dalej, starając się odgadnąć, jakiego rodzaju okrucieństwom mógł się Verloc oddawać pod pokrywką sennych, spokojnych pozorów małżeńskiego pożycia. To było naprawdę okropne.",
  "start": 1189.18
 },
 {
  "i": 100,
  "pl": "— Ja rozumiem — powtórzył i pod wpływem natchnienia wyrzekł ze wzniosłym współczuciem; — Nieszczęsna kobieto! — zamiast użyć bardziej poufałego: „kochane biedactwo”, którym to zwrotem zwykle się posługiwał. Ale ten wypadek nie był przeciętny.",
  "start": 1204.0
 },
 {
  "i": 101,
  "pl": "Ossipon czuł, że dzieje się coś niezwykłego, a jednocześnie nie tracił z oczu wielkości stawki. — Dzielna, nieszczęsna kobieto!",
  "start": 1219.47
 },
 {
  "i": 102,
  "pl": "Cieszył się, że ten nowy zwrot przyszedł mu do głowy, lecz poza tym nie mógł nic więcej wymyślić.",
  "start": 1227.63
 },
 {
  "i": 103,
  "pl": "— No ale on już przecież nie żyje — to było wszystko, na co jeszcze potrafił się zdobyć. Zawarł należytą dozę wrogości w tym ostrożnym okrzyku. Pani Verloc chwyciła go za ramię w zapamiętaniu.",
  "start": 1234.18
 },
 {
  "i": 104,
  "pl": "— Zgadłeś, że on nie żyje — wyszeptała, jakby nie władnąc sobą. — Zgadłeś! Ty zgadłeś, co ja musiałam zrobić. Musiałam!",
  "start": 1249.03
 },
 {
  "i": 105,
  "pl": "Odcień tryumfu, ulgi, wdzięczności zabrzmiał w nieokreślonym tonie jej słów. Ton tych słów pochłonął całkowicie uwagę Ossipona z uszczerbkiem dla ich treści. Towarzysz Ossipon nie mógł zrozumieć, co się dzieje z tą kobietą i dlaczego doprowadziła się do stanu tak szalonego podniecenia.",
  "start": 1258.55
 },
 {
  "i": 106,
  "pl": "Zadał sobie nawet pytanie, czy ukrytą przyczyną zamachu w Greenwich Park nie było niefortunne małżeńskie pożycie tych dwojga ludzi. Posunął się tak daleko, że zaczął podejrzewać Verloca, czy aby nie popełnił samobójstwa w sposób tak nadzwyczajny.",
  "start": 1275.19
 },
 {
  "i": 107,
  "pl": "Naprawdę — myślał — to by tłumaczyło skończony absurd tego faktu. W danych okolicznościach zamach anarchistyczny nie był pożądany, wręcz przeciwnie, i Verloc zdawał sobie z tego sprawę tak samo jak każdy z wybitniejszych rewolucjonistów.",
  "start": 1288.81
 },
 {
  "i": 108,
  "pl": "Cóż by to był za niesłychany kawał, gdyby się okazało, że Verloc po prostu wystrychnął na dudka całą Europę wraz ze światem rewolucyjnym, z policją, prasą i nadętym pychą Profesorem w dodatku. Naprawdę — myślał Ossipon w zdumieniu — on chyba na pewno to zrobił! Biedaczysko!",
  "start": 1303.75
 },
 {
  "i": 109,
  "pl": "Przyszło mu do głowy, że z tych dwojga małżonków niekoniecznie mąż był diabłem.",
  "start": 1321.79
 },
 {
  "i": 110,
  "pl": "Aleksander Ossipon, zwany Doktorem, miał wrodzoną skłonność do pobłażliwej oceny swoich przyjaciół. O przyjaciółkach zaś myślał pod specjalnym, a mianowicie praktycznym kątem widzenia. Zerknął na panią Verloc wspartą o jego ramię.",
  "start": 1326.57
 },
 {
  "i": 111,
  "pl": "Nie przejął się nadmiernie jej okrzykiem zdumienia na wieść, że on, Ossipon, wie o śmierci Verloca, której bynajmniej zgadywać nie potrzebował. Kobiety mówią często od rzeczy. Natomiast był ciekaw, skąd ona ma tę wiadomość.",
  "start": 1339.57
 },
 {
  "i": 112,
  "pl": "Z gazet mogła się dowiedzieć tylko o nagim fakcie: o tym, że człowiek rozerwany na sztuki w Greenwich Park nie został zidentyfikowany. Ze wszystkich względów wydawało się niemożliwe, aby Verloc zdradził się przed żoną ze swym zamiarem — jakikolwiek był ten zamiar.",
  "start": 1353.27
 },
 {
  "i": 113,
  "pl": "Zagadnienie to interesowało niezmiernie towarzysza Ossipona. Zatrzymał się. Obeszli już wszystkie trzy strony Brett Place i znaleźli się znów blisko końca Brett Street.",
  "start": 1369.25
 },
 {
  "i": 114,
  "pl": "— A skąd ty się o tym dowiedziałaś? — zapytał Ossipon, usiłując dostosować ton głosu do rewelacyjnych zwierzeń uczynionych mu przez kobietę stojącą u jego boku.",
  "start": 1380.48
 },
 {
  "i": 115,
  "pl": "Gwałtowny dreszcz ją przebiegł, zanim odpowiedziała niedbale:",
  "start": 1390.26
 },
 {
  "i": 116,
  "pl": "— Od policji. Przyszedł komisarz. Powiedział mi, że się nazywa komisarz Heat. Pokazał mi…",
  "start": 1393.88
 },
 {
  "i": 117,
  "pl": "Pani Verloc zatchnęła się.",
  "start": 1402.4
 },
 {
  "i": 118,
  "pl": "— Czy wiesz… musieli zgarniać go szuflą…",
  "start": 1404.2
 },
 {
  "i": 119,
  "pl": "Piersi jej falowały od suchych łkań. Ossipon w jednej chwili odzyskał głos.",
  "start": 1408.6
 },
 {
  "i": 120,
  "pl": "— Policja! Czy chcesz przez to powiedzieć, że policja już była? Że komisarz Heat sam przyszedł ci to powiedzieć?",
  "start": 1415.12
 },
 {
  "i": 121,
  "pl": "— Tak — potwierdziła równie niedbałym tonem. — Przyszedł. Mówię ci przecież, że przyszedł. Nie wiedziałam o niczym. Pokazał mi kawałek palta i ot tak po prostu zapytał: „Czy pani to zna?”.",
  "start": 1423.38
 },
 {
  "i": 122,
  "pl": "— Heat! Heat! I co on potem zrobił?",
  "start": 1435.49
 },
 {
  "i": 123,
  "pl": "Głowa pani Verloc opadła na piersi.",
  "start": 1438.05
 },
 {
  "i": 124,
  "pl": "— Nic. Nic nie zrobił. Poszedł sobie. Policja była po stronie tego człowieka — wyszeptała z rozpaczą. — I drugi też przychodził.",
  "start": 1441.45
 },
 {
  "i": 125,
  "pl": "— Drugi… drugi komisarz, co? — zapytał Ossipon w wielkim podnieceniu, głosem bardzo podobnym do głosu przestraszonego dziecka.",
  "start": 1451.38
 },
 {
  "i": 126,
  "pl": "— Ja nie wiem. Przyszedł. Wyglądał na cudzoziemca. Może to był ktoś z ambasady.",
  "start": 1459.77
 },
 {
  "i": 127,
  "pl": "Towarzysz Ossipon ledwie nie zemdlał od tego nowego wstrząsu.",
  "start": 1465.47
 },
 {
  "i": 128,
  "pl": "— Z ambasady! Czy ty wiesz, co mówisz? Z jakiej ambasady? Co przez to rozumiesz?",
  "start": 1469.33
 },
 {
  "i": 129,
  "pl": "— No z tej ambasady na Chesham Square. To są ci ludzie, których tak przeklinał. Ja nic nie wiem. Cóż to nas obchodzi!",
  "start": 1475.09
 },
 {
  "i": 130,
  "pl": "— A ten drugi, co on zrobił albo powiedział?",
  "start": 1484.63
 },
 {
  "i": 131,
  "pl": "— Nie pamiętam… Nic… Wszystko mi jedno. Nie pytaj mnie — prosiła zmęczonym głosem.",
  "start": 1488.18
 },
 {
  "i": 132,
  "pl": "— Dobrze, dobrze. Już nie będę pytał — rzekł czule Ossipon. Uległ nie dlatego, aby był wzruszony jej tragicznym, błagalnym głosem, tylko czuł, że się gubi w labiryncie tej mrocznej sprawy. Policja! Ambasada! Fiu!",
  "start": 1494.72
 },
 {
  "i": 133,
  "pl": "Odsunął od siebie ze stanowczością wszelkie przypuszczenia, domysły, hipotezy, gdyż lękał się, aby go nie zaprowadziły na drogi, po których wrodzona mu inteligencja nie umiałaby go bezpiecznie prowadzić. Ta oto kobieta dosłownie rzuciła mu się na szyję i to jest najważniejsze.",
  "start": 1510.04
 },
 {
  "i": 134,
  "pl": "Po tym, co usłyszał, nic go już więcej zdziwić nie mogło. I gdy pani Verloc, jakby zbudzona nagle z marzeń o bezpieczeństwie, zaczęła gwałtownie nalegać, by uciekali zaraz na kontynent, wcale się jej nie sprzeciwił.",
  "start": 1526.84
 },
 {
  "i": 135,
  "pl": "Odrzekł po prostu ze szczerym żalem, że pociąg odchodzi dopiero rano i stał pogrążony w myślach, patrząc na jej twarz zasłoniętą gęstą czarną woalką, w świetle latarni zasnutej gazą mgły.",
  "start": 1539.68
 },
 {
  "i": 136,
  "pl": "Obok niego czarna jej postać wtapiała się w noc jak posąg na wpół wyciosany z bryły czarnego kamienia. Niepodobna było odgadnąć, co ona wie, jak głęboko jest uwikłana w te sprawy z policją i ambasadami. Ale jeśli chce uciekać, nie on będzie się temu sprzeciwiał. Sam pragnął także uciec.",
  "start": 1551.1
 },
 {
  "i": 137,
  "pl": "Czuł, że ta cała historia, ten sklep tak dziwnie spoufalony z komisarzami policji i członkami obcych ambasad — że to nie jest dlań odpowiednie. Trzeba się od tego odsunąć. Ale wchodziło w grę jeszcze coś innego. Oszczędności. Pieniądze!",
  "start": 1569.78
 },
 {
  "i": 138,
  "pl": "— Musisz schować mnie gdzieś aż do rana — rzekła przerażonym głosem.",
  "start": 1587.31
 },
 {
  "i": 139,
  "pl": "— Niestety, moja droga, nie mogę cię zabrać do swojego pokoju. Mieszkam razem z przyjacielem.",
  "start": 1592.29
 },
 {
  "i": 140,
  "pl": "Sam był też zalękniony. Rano przeklęci szpicle będą z pewnością czyhać na wszystkich stacjach. A gdy raz dostaną ją w ręce, z tego lub innego powodu będzie dla niego stracona.",
  "start": 1597.92
 },
 {
  "i": 141,
  "pl": "— Ależ ty musisz mnie ukryć. Jak to, więc wcale ci o mnie nie chodzi? Nad czym tak myślisz?",
  "start": 1610.67
 },
 {
  "i": 142,
  "pl": "Powiedziała to gwałtownie i opuściła splecione ręce ze zniechęceniem. Mgła opadała wciąż i mrok panował niepodzielnie na Brett Place. Nie pojawiła się żadna żywa dusza, nawet kot, niesforny, kochliwy włóczęga, nie pokazał się w pobliżu mężczyzny i kobiety stojących naprzeciw siebie.",
  "start": 1618.76
 },
 {
  "i": 143,
  "pl": "— Może dałoby się gdzieś wyszukać jakieś bezpieczne mieszkanie — odezwał się wreszcie Ossipon. — Ale mówiąc szczerze, moja droga, za mało mam na to pieniędzy — ledwie kilka pensów. My, rewolucjoniści, nie jesteśmy bogaci.",
  "start": 1637.56
 },
 {
  "i": 144,
  "pl": "Miał w kieszeni piętnaście szylingów.",
  "start": 1651.58
 },
 {
  "i": 145,
  "pl": "— A tu jeszcze podróż przed nami — i to wczesnym rankiem — dodał.",
  "start": 1654.84
 },
 {
  "i": 146,
  "pl": "Nie odrzekła nic, nie poruszyła się wcale i towarzysza Ossipona zaczęło ogarniać rozczarowanie. Widać pani Verloc nie miała na to żadnej rady. Nagle chwyciła się za pierś, jakby ją coś silnie zabolało.",
  "start": 1659.56
 },
 {
  "i": 147,
  "pl": "— Przecież ja mam pieniądze — wyszeptała. — Mam dosyć pieniędzy. Tomie! Jedźmy stąd.",
  "start": 1672.4
 },
 {
  "i": 148,
  "pl": "— A ile? — zapytał, nie ruszając się z miejsca, choć go ciągnęła; był to człowiek ostrożny.",
  "start": 1681.29
 },
 {
  "i": 149,
  "pl": "— Mówię ci, że mam pieniądze. Wszystkie pieniądze.",
  "start": 1687.69
 },
 {
  "i": 150,
  "pl": "— Jak to? Wszystkie pieniądze, które były w banku, czy co? — spytał niedowierzająco, gotów jednak nie dziwić się szczęśliwemu zrządzeniu losu.",
  "start": 1691.11
 },
 {
  "i": 151,
  "pl": "— Tak, tak! — rzekła nerwowo. — Wszystko, co było w banku. Mam wszystko.",
  "start": 1700.29
 },
 {
  "i": 152,
  "pl": "— Jakim sposobem potrafiłaś już do nich się dobrać? — zdumiał się.",
  "start": 1706.18
 },
 {
  "i": 153,
  "pl": "— Sam mi je dał — szepnęła, nagle zgaszona i drżąca. Towarzysz Ossipon poskromił z siłą wzrastające w nim zdumienie.",
  "start": 1710.7
 },
 {
  "i": 154,
  "pl": "— No więc… jesteśmy ocaleni — wyrzekł powoli.",
  "start": 1720.27
 },
 {
  "i": 155,
  "pl": "Pochyliła się naprzód i opadła znów na jego piersi. Objął ją serdecznie. Miała przy sobie wszystkie pieniądze! Jej kapelusz, a także i woalka przeszkadzały gwałtownemu upustowi uczuć. Ossipon ujawnił je w odpowiedniej mierze, ale nic ponadto.",
  "start": 1724.41
 },
 {
  "i": 156,
  "pl": "Poddała mu się bez oporu i bez uniesienia, biernie, jakby na wpół przytomna. Uwolniła się łatwo z jego luźnego uścisku.",
  "start": 1740.37
 },
 {
  "i": 157,
  "pl": "— Ty mnie uratujesz, Tomie — wybuchnęła, cofając się, lecz trzymała go wciąż za wyłogi wilgotnego palta. — Ocal mnie. Ukryj mnie. Nie pozwól, aby mnie wzięli. Raczej mnie zabij. Ja nie potrafię się zabić — nie potrafię, nie potrafię — nawet ze strachu przed tym, czego się boję.",
  "start": 1748.24
 },
 {
  "i": 158,
  "pl": "„Skończona dziwaczka”, pomyślał. Zaczynała go przejmować niejasnym lękiem. Rzekł zgryźliwie, albowiem zaprzątały go ważne myśli:",
  "start": 1768.38
 },
 {
  "i": 159,
  "pl": "— Czegóż ty u diabła się boisz?",
  "start": 1777.98
 },
 {
  "i": 160,
  "pl": "— Przecież odgadłeś, co ja musiałam zrobić! — krzyknęła kobieta. Szał ją ogarniał od straszliwie wyrazistych przeczuć, w głowie jej dźwięczały gwałtowne słowa uprzytamniające grozę położenia, a jednocześnie była przekonana, że jej bezładne wyznania są jasne i przejrzyste.",
  "start": 1780.67
 },
 {
  "i": 161,
  "pl": "Nie miała pojęcia, jak niewiele mógł Ossipon zrozumieć z tych urywanych zdań, które uzupełniała tylko w myśli. Odczuła ulgę niby po wyczerpującej spowiedzi i każde słowo Ossipona wydawało jej się pełne szczególnego znaczenia, a tymczasem Ossipon ani w części tego, co ona, nie wiedział.",
  "start": 1797.03
 },
 {
  "i": 162,
  "pl": "— Przecież odgadłeś, co ja musiałam zrobić! — powtórzyła załamującym się głosem. — Więc łatwo ci się domyślić, przed czym drżę — szeptała dalej gorzko i ponuro. — Nie chcę tego! Nie chcę! Nie chcę! Nie chcę! Musisz przyrzec, że mnie przedtem zabijesz! — Targnęła wyłogami jego palta.",
  "start": 1816.72
 },
 {
  "i": 163,
  "pl": "— To się stać nie może!",
  "start": 1837.71
 },
 {
  "i": 164,
  "pl": "Zapewnił ją w krótkich słowach, że wszelkie obietnice są z jego strony zbyteczne i pilnował się, aby jej wyraźnie nie przeczyć;",
  "start": 1839.7
 },
 {
  "i": 165,
  "pl": "miał wiele do czynienia ze zdenerwowanymi kobietami i zawsze skłonny był raczej kierować się nabytym już doświadczeniem, niż traktować indywidualnie każdy konkretny wypadek.",
  "start": 1847.62
 },
 {
  "i": 166,
  "pl": "Zresztą w tym wypadku jego roztropny umysł pracował w innych kierunkach. Słowa kobiece lecą z wiatrem jak plewy, lecz braki w komunikacji statkami są nie do usunięcia. Wyspiarski charakter Wielkiej Brytanii narzucił się uwadze Ossipona w przykry sposób.",
  "start": 1858.08
 },
 {
  "i": 167,
  "pl": "„Człowiek ma wrażenie, że każdej nocy biorą go pod klucz” — pomyślał ze złością, taki skłopotany, jakby musiał drapać się na mur, dźwigając tę kobietę na grzbiecie. Nagle uderzył się w czoło: wysiliwszy pamięć, przypomniał sobie o linii Southampton – St. Malo. Statek wyruszał około północy.",
  "start": 1875.16
 },
 {
  "i": 168,
  "pl": "Dziesiąta trzydzieści odchodził pociąg. Ossipon poweselał i nabrał ochoty do czynu.",
  "start": 1894.55
 },
 {
  "i": 169,
  "pl": "— Odjedziemy ze stacji Waterloo. Jeszcze mnóstwo czasu. Właściwie to wszystko w porządku… O co ci znów chodzi? Ależ nie tędy — protestował.",
  "start": 1900.86
 },
 {
  "i": 170,
  "pl": "Pani Verloc, trzymając mocno jego ramię, usiłowała ciągnąć go z powrotem na Brett Street.",
  "start": 1913.2
 },
 {
  "i": 171,
  "pl": "— Zapomniałam zamknąć drzwi sklepu — szepnęła w okropnym wzburzeniu.",
  "start": 1918.78
 },
 {
  "i": 172,
  "pl": "Towarzysz Ossipon przestał już interesować się sklepem oraz całą jego zawartością. Umiał ograniczać się w swych pragnieniach. Już, już chciał powiedzieć: „Więc co? Dajmy temu spokój”, lecz się powstrzymał. Nie lubił sprzeczać się o drobnostki.",
  "start": 1923.5
 },
 {
  "i": 173,
  "pl": "Nawet przyśpieszył znacznie kroku, pomyślawszy, że zostawiła może pieniądze w szufladzie. Ale jego gotowość nie mogła sprostać gorączkowej niecierpliwości pani Verloc.",
  "start": 1939.84
 },
 {
  "i": 174,
  "pl": "Z początku sklep wydał mu się zupełnie ciemny. Drzwi były uchylone. Pani Verloc oparła się o futrynę i wyszeptała:",
  "start": 1949.54
 },
 {
  "i": 175,
  "pl": "— Nie było tu nikogo. Patrz! Pali się gaz… pali się w saloniku.",
  "start": 1957.46
 },
 {
  "i": 176,
  "pl": "Ossipon wysunął głowę i dostrzegł nikłe światło wśród ciemności sklepu.",
  "start": 1963.18
 },
 {
  "i": 177,
  "pl": "— Tak, rzeczywiście — odrzekł.",
  "start": 1968.48
 },
 {
  "i": 178,
  "pl": "— Zapomniałam je zgasić. — Głos pani Verloc dochodził słabo zza woalki. Gdy Ossipon stał, chcąc ją puścić przodem, rzekła głośniej: — Wejdź i zgaś, bo inaczej zwariuję.",
  "start": 1971.98
 },
 {
  "i": 179,
  "pl": "Nie sprzeciwił się na razie tej propozycji tak dziwnie uzasadnionej.",
  "start": 1984.89
 },
 {
  "i": 180,
  "pl": "— Gdzie są te wszystkie pieniądze? — zapytał.",
  "start": 1989.94
 },
 {
  "i": 181,
  "pl": "— Mam je przy sobie. Idź, Tomie. Prędko! Zgaś światło… Idźże! — krzyknęła, chwytając go z tyłu za ramiona.",
  "start": 1993.38
 },
 {
  "i": 182,
  "pl": "Nieprzygotowany do stawienia oporu towarzysz Ossipon, pchnięty przez panią Verloc, znalazł się w głębi sklepu. Zdumiała go siła tej kobiety, a jednocześnie zgorszył się jej obejściem. Nie wrócił jednak na ulicę, aby ją skarcić. Jej fantastyczne postępowanie zaczynało budzić w nim niesmak.",
  "start": 2000.46
 },
 {
  "i": 183,
  "pl": "Ale kiedyż miał pobłażać jej zachciankom, jeśli nie teraz?",
  "start": 2017.67
 },
 {
  "i": 184,
  "pl": "Towarzysz Ossipon wyminął z łatwością koniec lady i zbliżył się spokojnie do oszklonych drzwi saloniku. Firanka zasłaniająca szyby była trochę ściągnięta na bok i Ossipon pod wpływem naturalnego odruchu zajrzał do saloniku przed naciśnięciem klamki.",
  "start": 2021.99
 },
 {
  "i": 185,
  "pl": "Zajrzał machinalnie, bez żadnego celu, bez ciekawości. Zajrzał, bo zajrzeć musiał. Zajrzał — i zobaczył pana Verloca leżącego spokojnie na kanapie.",
  "start": 2037.21
 },
 {
  "i": 186,
  "pl": "W piersi Ossipona zrodził się wrzask i zamarł bez dźwięku, przeistoczony w tłusty, mdlący posmak na wargach. Jednocześnie zaś duchowa istota towarzysza Ossipona wykonała oszalały skok w tył. Lecz jego ciało, pozbawione kierownictwa rozumu, trzymało się klamki z bezmyślną siłą instynktu.",
  "start": 2048.95
 },
 {
  "i": 187,
  "pl": "Krzepki anarchista nawet się nie zachwiał. Patrzył z twarzą tuż przy szybie, a oczy wyłaziły mu z głowy. Byłby oddał wszystko za to, aby móc odejść, ale powracająca przytomność ostrzegła go, że lepiej klamki nie puszczać. Co to jest? Napad szału? Zmora?",
  "start": 2068.35
 },
 {
  "i": 188,
  "pl": "A może pułapka, do której został znęcony z szatańską chytrością? Dlaczego? Po co? Nie miał pojęcia.",
  "start": 2084.57
 },
 {
  "i": 189,
  "pl": "Nie poczuwał się do żadnej winy względem tych ludzi, sumienie miał zupełnie spokojne, a jednak przeszyła go myśl, że dla jakichś tajemniczych przyczyn zostanie zamordowany przez oboje Verloców — przeszyła nie tyle jego mózg, co żołądek, i znikła, pozostawiając chorobliwą omdlałość i nudności.",
  "start": 2092.05
 },
 {
  "i": 190,
  "pl": "Przez chwilę, przez długą chwilę towarzysz Ossipon nie czuł się bynajmniej dobrze — i to w sposób bardzo specjalny. Lecz wciąż patrzył.",
  "start": 2110.23
 },
 {
  "i": 191,
  "pl": "A tymczasem pan Verloc leżał bez ruchu, z wiadomych sobie powodów udając sen, jego żona zaś, ta dzika kobieta, strzegła drzwi — niewidoczna i niema wśród mroku opustoszałej ulicy. Czyżby to wszystko było jakąś straszliwą machinacją uknutą przez policję na intencję jego, Ossipona?",
  "start": 2118.45
 },
 {
  "i": 192,
  "pl": "W swej skromności odrzucił takie rozwiązanie zagadki.",
  "start": 2136.83
 },
 {
  "i": 193,
  "pl": "Lecz właściwe znaczenie sceny, na którą patrzył, zrozumiał dopiero, przyglądając się kapeluszowi. Ten kapelusz wydał mu się czymś nadzwyczajnym, jakimś złowrogim symbolem.",
  "start": 2140.03
 },
 {
  "i": 194,
  "pl": "Czarny, obrócony rondem do góry, leżał na ziemi przed kanapą, jakby go przygotowano dla zbierania składek od ludzi, którzy za chwilę nadejdą, aby oglądać pana Verloca, spoczywającego na kanapie i rozkoszującego się pełnią spokoju i wygody domowego ogniska.",
  "start": 2151.43
 },
 {
  "i": 195,
  "pl": "Od kapelusza oczy krzepkiego anarchisty powędrowały ku odsuniętemu stołowi, patrzyły chwilę na stłuczony półmisek i doznały jakby optycznego wstrząsu, dostrzegłszy połyskliwą białość pod niedomkniętymi powiekami człowieka leżącego na kanapie.",
  "start": 2166.59
 },
 {
  "i": 196,
  "pl": "Wydało się teraz Ossiponowi, że pan Verloc niekoniecznie śpi, że raczej leży z przechyloną głową i patrzy uporczywie na swą lewą pierś. A gdy towarzysz Ossipon dostrzegł wreszcie rękojeść noża, odwrócił się od szklanych drzwi, wstrząśnięty gwałtownym kurczem zwiastującym wymioty.",
  "start": 2182.35
 },
 {
  "i": 197,
  "pl": "Nagle usłyszał, że drzwi od ulicy się zatrzaskują i dusza uciekła mu w pięty. Ten dom ze swym nieszkodliwym mieszkańcem mógł jednak służyć za pułapkę — i to straszliwą. Towarzysz Ossipon nie miał już teraz pojęcia, co się z nim dzieje.",
  "start": 2200.39
 },
 {
  "i": 198,
  "pl": "Zaczepiwszy udem o koniec lady, obrócił się w kółko i zachwiał z okrzykiem bólu; wśród przerażającego grzechotu dzwonka poczuł, że konwulsyjny uścisk przygważdża mu ramiona do boków, a zimne wargi kobiece pełzną po jego uchu, wypowiadając słowa:",
  "start": 2215.35
 },
 {
  "i": 199,
  "pl": "— Policjant! Widział mnie!",
  "start": 2230.03
 },
 {
  "i": 200,
  "pl": "Ossipon przestał się wydzierać: ona go nie puści. Ręce jej splotły się nierozerwalnym węzłem na krzepkich plecach Ossipona. Kroki na ulicy zbliżały się; dyszeli oboje pierś w pierś ciężko, mozolnie, co wyglądało na śmiertelną walkę, choć postawa ich wyrażała śmiertelny strach.",
  "start": 2233.43
 },
 {
  "i": 201,
  "pl": "Czas dłużył się w nieskończoność.",
  "start": 2251.61
 },
 {
  "i": 202,
  "pl": "Policjant obchodzący dzielnicę dostrzegł był istotnie panią Verloc; ale ponieważ mijał właśnie oświetlone skrzyżowanie ulic, idąc ku przeciwległemu końcowi Brett Street, Winnie wydała mu się tylko jakimś trzepotem wśród mroku. I nawet niezupełnie był pewien, czy dojrzał istotnie ów trzepot.",
  "start": 2253.79
 },
 {
  "i": 203,
  "pl": "Nie potrzebował się spieszyć. Znalazłszy się na jednej linii ze sklepem, zauważył, że zamknięto go wcześnie. Nie było w tym nic nadzwyczajnego.",
  "start": 2272.09
 },
 {
  "i": 204,
  "pl": "Policjanci pełniący służbę mieli odrębne wskazówki tyczące się sklepu Verloców; nie wolno im było się wtrącać do tego, co się tam działo, chyba w razie wyraźnego przekroczenia porządku, lecz musieli donosić o wszystkim, co zauważyli.",
  "start": 2281.61
 },
 {
  "i": 205,
  "pl": "W tym wypadku nie było pola do spostrzeżeń, ale policjant, wiedziony poczuciem obowiązku i dbałością o spokój sumienia, przeszedł w poprzek jezdni i nacisnął klamkę.",
  "start": 2296.01
 },
 {
  "i": 206,
  "pl": "Sprężynowy zatrzask, od którego klucz spoczywał na wieki w kieszonce od kamizelki nieboszczyka Verloca, trzymał równie dobrze jak zazwyczaj. W chwili gdy sumienny agent policji potrząsał klamką, Ossipon poczuł znów zimne wargi kobiece muskające mu ucho:",
  "start": 2305.73
 },
 {
  "i": 207,
  "pl": "— Jeśli wejdzie, zabij mnie… zabij mnie, Tomie.",
  "start": 2322.34
 },
 {
  "i": 208,
  "pl": "Policjant ruszył dalej i przechodząc, oświetlił ślepą latarką⁸⁷ wystawę sklepu, spełniając zwykłą formalność. Przez chwilę jeszcze mężczyzna i kobieta stali wewnątrz bez ruchu, dysząc ciężko z piersią przy piersi, wreszcie palce Winnie rozplotły się i ramiona jej z wolna opadły.",
  "start": 2326.72
 },
 {
  "i": 209,
  "pl": "Ossipon wsparł się o ladę. Krzepki anarchista potrzebował na gwałt podpory. To, co przeżył, było straszliwe. Ogarnął go wielki niesmak i nie chciało mu się mówić. Zdobył się jednak na wypowiedzenie żałosnej myśli świadczącej przynajmniej o tym, że zdawał sobie sprawę z położenia:",
  "start": 2344.64
 },
 {
  "i": 210,
  "pl": "— Jeszcze parę chwil i z twojej winy byłbym się nadział na tego draba obmacującego sklep swoją, psiakrew, latarką.",
  "start": 2361.06
 },
 {
  "i": 211,
  "pl": "Wdowa po panu Verlocu, stojąc bez ruchu w środku sklepu, zaczęła nalegać:",
  "start": 2367.54
 },
 {
  "i": 212,
  "pl": "— Idź tam i zgaś światło, Tomie. Zgaś, bo oszaleję.",
  "start": 2372.86
 },
 {
  "i": 213,
  "pl": "Ujrzała niewyraźnie jego porywczy gest odmowy. Za żadne skarby świata Ossipon nie wróciłby do saloniku. Nie był przesądny, ale widział tam za wiele krwi na podłodze; kapelusz był otoczony wielką kałużą. Już i tak oglądał zbyt blisko tego trupa; zagrażało to spokojowi jego duszy, a może i życiu!",
  "start": 2376.64
 },
 {
  "i": 214,
  "pl": "— Więc przekręć kurek tam na gazomierzu. Patrz. W tamtym rogu.",
  "start": 2397.08
 },
 {
  "i": 215,
  "pl": "Krzepka postać towarzysza Ossipona przeszła przez sklep jak cień wielkimi, porywczymi krokami i przykucnęła posłusznie w kącie; ale w tym posłuszeństwie było dużo niechęci.",
  "start": 2402.28
 },
 {
  "i": 216,
  "pl": "Ossipon szukał teraz nerwowo kurka, mrucząc przekleństwa; za oszklonymi drzwiami zapadła nagle ciemność i prawie natychmiast rozległo się chrapliwe, histeryczne westchnienie kobiety.",
  "start": 2413.36
 },
 {
  "i": 217,
  "pl": "Noc, niezawodna nagroda za uczciwy ludzki trud na tym padole, otoczyła pana Verloca, ciężko doświadczonego rewolucjonistę ze „starej gwardii”, skromnego stróża społeczeństwa, bezcennego tajnego agenta Δ z raportów barona Stott- -Wartenheima;",
  "start": 2424.24
 },
 {
  "i": 218,
  "pl": "agenta, który był sługą prawa i porządku, sługą wiernym, zaufanym, sumiennym, godnym podziwu i miał tylko jedną sympatyczną słabość, a mianowicie pełne idealizmu przekonanie, że jest kochany dla siebie samego.",
  "start": 2440.5
 },
 {
  "i": 219,
  "pl": "Ossipon szedł po omacku z powrotem ku ladzie przez duszny mrok, czarny teraz jak sadza. Głos pani Verloc stojącej w środku sklepu zadrgał w ciemności rozpaczliwym protestem:",
  "start": 2454.4
 },
 {
  "i": 220,
  "pl": "— Ja nie chcę, żeby mnie powiesili, Tomie. Ja nie chcę…",
  "start": 2465.42
 },
 {
  "i": 221,
  "pl": "Umilkła. Ossipon rzucił od lady przestrogę:",
  "start": 2469.04
 },
 {
  "i": 222,
  "pl": "— Nie krzycz tak. — Zdawał się głęboko namyślać. — Zrobiłaś to zupełnie sama? — zapytał głucho, ale z wszelkimi pozorami władczego spokoju, co przepełniło serce pani Verloc wdzięcznością i wiarą w jego opiekuńczą siłę.",
  "start": 2473.0
 },
 {
  "i": 223,
  "pl": "— Tak — szepnęła, niewidzialna wśród mroku.",
  "start": 2488.32
 },
 {
  "i": 224,
  "pl": "— Nigdy bym w to nie uwierzył — mruknął. — Nikt by nie uwierzył.",
  "start": 2492.09
 },
 {
  "i": 225,
  "pl": "Posłyszała jego ruchy w ciemności i odgłos zatrzasku w drzwiach saloniku.",
  "start": 2496.71
 },
 {
  "i": 226,
  "pl": "Towarzysz Ossipon, przekręciwszy klucz, zapewnił panu Verlocowi spokój; nie uczynił tego przez szacunek dla wiecznotrwałości jego spoczynku, ani też wiedziony jakimś innym uczuciowym względem, lecz wyłącznie dlatego, że wcale nie był pewien, czy ktoś nie ukrywa się jeszcze gdzieś w domu.",
  "start": 2500.79
 },
 {
  "i": 227,
  "pl": "Nie wierzył słowom tej kobiety, a raczej nie umiał na razie osądzić, co jest rzeczywiste, prawdopodobne lub nawet możliwe na tym zdumiewającym świecie.",
  "start": 2516.85
 },
 {
  "i": 228,
  "pl": "Strach wyzuł Ossipona z wszelkich uczuć wiary lub zwątpienia odnośnie do tej niesłychanej sprawy, która zaczęła się przy współudziale komisarzy policji i ambasad, a skończy się Bóg raczy wiedzieć gdzie — może na szafocie?",
  "start": 2525.43
 },
 {
  "i": 229,
  "pl": "Przerażała go myśl, że nie potrafiłby dowieść, co robił z czasem począwszy od godziny siódmej, albowiem krył się w okolicy Brett Street. Przerażała go ta dzika kobieta, która przyprowadziła go tutaj i może oskarżyć go o wspólnictwo, jeśli nie będzie się zachowywał z wielką ostrożnością.",
  "start": 2540.51
 },
 {
  "i": 230,
  "pl": "Przerażała go szybkość, z jaką dał się wciągnąć w tak wielkie niebezpieczeństwo — z jaką dał się zwabić. Upłynęło zaledwie dwadzieścia minut, odkąd spotkał panią Verloc — nie więcej.",
  "start": 2556.51
 },
 {
  "i": 231,
  "pl": "Głos Winnie rozległ się znów, stłumiony, błagalny, żałosny:",
  "start": 2568.3
 },
 {
  "i": 232,
  "pl": "— Nie pozwól mnie powiesić, Tomie! Zabierz mnie z kraju. Będę dla ciebie pracować. Będę harować. Będę cię kochać. Nie mam nikogo na świecie… Kto się mną zajmie, jeżeli ty mnie porzucisz!",
  "start": 2572.3
 },
 {
  "i": 233,
  "pl": "Milczała przez chwilę. W głębi osamotnienia, które wkoło niej wytworzyła cienka nić krwi sączącej się spod rękojeści noża, znalazła Winnie straszne natchnienie — straszne dla niej, uczciwej dziewczyny z dzielnicy Belgravia, a potem uczciwej, wiernej żony pana Verloca.",
  "start": 2583.96
 },
 {
  "i": 234,
  "pl": "— Ja nie będę wymagała, abyś się ze mną ożenił — szepnęła wstydliwie.",
  "start": 2600.56
 },
 {
  "i": 235,
  "pl": "Posunęła się naprzód w ciemności. Przerażenie zdjęło Ossipona. Nie zdziwiłby się, gdyby nagle wydobyła drugi nóż, aby go zatopić w jego piersi. Aniby myślał się bronić. W owej chwili nie miał po prostu sił krzyknąć, żeby ją osadzić na miejscu. Ale zapytał głuchym, dziwnym głosem:",
  "start": 2604.9
 },
 {
  "i": 236,
  "pl": "— Czy on spał?",
  "start": 2623.84
 },
 {
  "i": 237,
  "pl": "— Nie — zawołała i ciągnęła prędko dalej: — Nie spał. Skąd znowu. Mówił właśnie, że nic mu się stać nie może. Mówił to — on, który zabrał mi sprzed oczu chłopca, żeby go zabić — zabrał mi to kochające, naiwne, niewinne dziecko, które nie potrafiłoby skrzywdzić nikogo, moje dziecko.",
  "start": 2626.48
 },
 {
  "i": 238,
  "pl": "I leżał wygodnie na kanapie, zabiwszy chłopca — mojego chłopca. Chciałam sobie pójść, żeby go już nigdy nie widzieć. A on mi mówi: „Chodź tutaj”. A przedtem powiedział, że to ja pomogłam mu zabić chłopca. Słyszysz, Tomie?",
  "start": 2645.7
 },
 {
  "i": 239,
  "pl": "Mówi mi: „Chodź tutaj”, a przedtem wydarł mi serce, i zmiażdżył je razem z chłopcem, i wdeptał w błoto.",
  "start": 2659.6
 },
 {
  "i": 240,
  "pl": "Umilkła; po chwili rzekła jak przez sen:",
  "start": 2665.88
 },
 {
  "i": 241,
  "pl": "— Krew i błoto. Krew i błoto.",
  "start": 2668.18
 },
 {
  "i": 242,
  "pl": "Błysk światła przeszył mózg towarzysza Ossipona: to ten półgłówek zginął w parku! Cóż za niesłychana mistyfikacja, wszyscy bez wyjątku zostali nabrani. Ossipon wykrzyknął w najwyższym zdumieniu:",
  "start": 2671.3
 },
 {
  "i": 243,
  "pl": "— Słowo daję, to ten degenerat!",
  "start": 2683.98
 },
 {
  "i": 244,
  "pl": "— Powiedział do mnie: „Chodź tu” — rozległ się znów głos pani Verloc. — Czy on myślał, że jestem z kamienia? Słyszysz, Tomie? Powiedział: „Chodź tu”. Mnie! Mnie wołał! Spojrzałam na nóż i pomyślałam, że przyjdę, jeśli on tak się tego domaga. Przyszłam — po raz ostatni… Z nożem.",
  "start": 2687.08
 },
 {
  "i": 245,
  "pl": "Ossipon bał się jej straszliwie — tej siostry degenerata, która sama była degeneratką typu zbrodniczego… a może kłamliwego. Poza wszystkimi innymi rodzajami strachu, budziła w nim także lęk, rzekłbyś, naukowy.",
  "start": 2705.62
 },
 {
  "i": 246,
  "pl": "Przerażenie Ossipona, bezgraniczne i skomplikowane, właśnie wskutek swego nadmiaru robiło w ciemnościach wrażenie spokojnej, głębokiej rozwagi, gdyż poruszał się i mówił z trudem, jakby wola i myśl w nim zamarły, a upiornej jego twarzy nie było widać. Czuł się na wpół martwy.",
  "start": 2718.72
 },
 {
  "i": 247,
  "pl": "Nagle skoczył do góry, bo pani Verloc wydała raptem ostry, straszliwy krzyk, który zbezcześcił nienaruszoną, pełną powściągliwości przyzwoitość jej domowego ogniska.",
  "start": 2736.48
 },
 {
  "i": 248,
  "pl": "— Ratunku! Tomie, ratuj mnie! Ja nie chcę, żeby mnie powiesili!",
  "start": 2746.24
 },
 {
  "i": 249,
  "pl": "Rzucił się naprzód, szukając w ciemności jej ust, aby je zatkać i krzyk ucichł. Ale przewrócił Winnie w rozpędzie. Nagle poczuł, że opasała mu nogi; strach jego przekroczył wszelką miarę, zaczął działać jak trucizna, zrodził halucynacje, nabrał cech białej gorączki.",
  "start": 2750.96
 },
 {
  "i": 250,
  "pl": "Ossipon naprawdę widział teraz węże. Widział, że ta kobieta owija się wokół niego jak wąż, który nie pozwoli się strząsnąć. Nie była morderczynią. Była wcieloną śmiercią — towarzyszką życia.",
  "start": 2768.6
 },
 {
  "i": 251,
  "pl": "Pani Verloc ucichła, jakby ten wybuch przyniósł jej ulgę.",
  "start": 2780.26
 },
 {
  "i": 252,
  "pl": "— Tomie, nie możesz mnie teraz odepchnąć — szepnęła z podłogi. — Chyba że zmiażdżysz mi głowę obcasem⁸⁸. Ja ciebie nie opuszczę.",
  "start": 2785.03
 },
 {
  "i": 253,
  "pl": "— Wstań — rzekł Ossipon.",
  "start": 2793.83
 },
 {
  "i": 254,
  "pl": "Jego twarz była tak blada, że się stała widoczna wśród gęstych ciemności; natomiast pani Verloc, zasłonięta woalką, nie miała twarzy, była prawie niewidzialna. Migot czegoś białego i drobnego — kwiatu na kapeluszu — zdradzał jej ruchy, miejsce, gdzie się znajdowała.",
  "start": 2796.23
 },
 {
  "i": 255,
  "pl": "Biała plamka uniosła się w górę. Pani Verloc dźwignęła się z ziemi, a Ossipon pożałował, że nie wybiegł natychmiast na dwór. Ale zrozumiał w mig, że to by nie przydało się na nic. Rzuciłaby się za nim. Goniłaby go, krzycząc, ażby wszyscy okoliczni policjanci zaczęli go ścigać.",
  "start": 2812.77
 },
 {
  "i": 256,
  "pl": "A wtedy Bóg raczy wiedzieć, co by o nim powiedziała. Ossipon bał się do tego stopnia, że mignęła mu przez głowę obłędna myśl, aby ją udusić w ciemności. Przerażenie jego wzrosło do punktu kulminacyjnego. Jest w mocy tej kobiety!",
  "start": 2830.97
 },
 {
  "i": 257,
  "pl": "Ujrzał swą przyszłość: oto żyje przejęty nikczemnym strachem w jakiejś małej wiosce hiszpańskiej czy włoskiej; aż wreszcie pewnego pięknego dnia znajdują go martwego z nożem w piersi — jak Verloca. Odetchnął głęboko. Nie śmiał się ruszyć.",
  "start": 2844.65
 },
 {
  "i": 258,
  "pl": "A pani Verloc czekała w milczeniu na to, co jej zbawca raczy postanowić; jego milcząca zaduma działała na nią kojąco.",
  "start": 2859.81
 },
 {
  "i": 259,
  "pl": "Nagle odezwał się głosem prawie zupełnie naturalnym; jego rozmyślania dobiegły końca.",
  "start": 2868.17
 },
 {
  "i": 260,
  "pl": "— Chodźmy, bo się spóźnimy na pociąg.",
  "start": 2874.55
 },
 {
  "i": 261,
  "pl": "— Dokąd pojedziemy, Tomie? — zapytała nieśmiało pani Verloc. Nie była już kobietą wolną.",
  "start": 2877.49
 },
 {
  "i": 262,
  "pl": "— Najpierw do Paryża; tak będzie najlepiej… Wyjdź pierwsza i zobacz, czy tam kogoś nie ma.",
  "start": 2883.37
 },
 {
  "i": 263,
  "pl": "Usłuchała. Jej stłumiony głos doszedł przez ostrożnie uchylone drzwi:",
  "start": 2889.43
 },
 {
  "i": 264,
  "pl": "— Nie ma nikogo.",
  "start": 2893.87
 },
 {
  "i": 265,
  "pl": "Ossipon wysunął się na ulicę. Mimo jego wysiłków, aby uczynić to jak najciszej, pęknięty dzwonek zagrzechotał za drzwiami w pustym sklepie, jakby starając się na próżno ostrzec pana Verloca, że żona opuszcza go nieodwołalnie — w towarzystwie jego przyjaciela.",
  "start": 2895.45
 },
 {
  "i": 266,
  "pl": "W dorożce, którą zaraz znaleźli, krzepki anarchista udzielił pani Verloc wyjaśnień. Był wciąż straszliwie blady, oczy zapadły mu się na jakieś pół cala⁸⁹ w stężałej twarzy. Ale widać obmyślił wszystko z niezwykłą przezornością.",
  "start": 2911.01
 },
 {
  "i": 267,
  "pl": "— Gdy zajedziemy — mówił dziwnym, jednostajnym głosem — musisz wejść na stację osobno, jak gdybyśmy się nie znali. Kupię bilety i wsunę ci twój do ręki, kiedy cię będę mijał. Potem pójdziesz do poczekalni pierwszej klasy; posiedzisz przed odejściem pociągu z dziesięć minut i wyjdziesz na peron.",
  "start": 2925.49
 },
 {
  "i": 268,
  "pl": "Ja tam już będę. Wyminiesz mnie, jakbyś mnie nie znała. Mógłby tam znaleźć się szpicel i zwąchać, co się święci. Idąc samotnie, będziesz wyglądała jak kobieta wyruszająca w podróż. A mnie znają dobrze. Gdyby zobaczyli nas razem, mogliby zgadnąć, że jesteś uciekającą panią Verloc.",
  "start": 2943.91
 },
 {
  "i": 269,
  "pl": "Rozumiesz, kochanie — dodał z wysiłkiem.",
  "start": 2961.71
 },
 {
  "i": 270,
  "pl": "— Tak — rzekła pani Verloc, siedząc tuż przy Ossiponie, zmartwiała ze strachu przed szubienicą. — Dobrze, Tomie. — I powtórzyła po cichu jakby straszliwą zwrotkę: — „Spuszczono delikwenta z wysokości czternastu stóp”.",
  "start": 2964.77
 },
 {
  "i": 271,
  "pl": "Ossipon nie patrzył na nią; twarz jego wyglądała jak gipsowa maska zdjęta z niego po ciężkiej chorobie.",
  "start": 2979.94
 },
 {
  "i": 272,
  "pl": "— Ach, prawda — rzekł — potrzeba mi teraz pieniędzy na kupienie biletów.",
  "start": 2986.58
 },
 {
  "i": 273,
  "pl": "Pani Verloc rozpięła kilka haftek stanika, patrząc ciągle przed siebie, i podała mu nowy portfel ze świńskiej skóry. Wziął go bez słowa i wsunął, rzekłbyś, w głąb własnej piersi. Potem trzepnął się po wierzchu palta.",
  "start": 2991.82
 },
 {
  "i": 274,
  "pl": "Wszystko to odbyło się bez zamiany jednego spojrzenia; robili wrażenie dwojga ludzi, którzy wypatrują upragnionego celu. Dopiero gdy dorożka skręciła na rogu ulicy i zbliżała się do mostu, Ossipon znów otworzył usta.",
  "start": 3004.5
 },
 {
  "i": 275,
  "pl": "— Czy wiesz, ile tam jest pieniędzy? — zadał pytanie, jakby się zwracał do chochlika siedzącego na głowie konia między jego uszami.",
  "start": 3018.36
 },
 {
  "i": 276,
  "pl": "— Nie — rzekła pani Verloc. — Dał mi to. Nie liczyłam. Nie przyszło mi to wcale na myśl. A potem…",
  "start": 3026.12
 },
 {
  "i": 277,
  "pl": "Poruszyła z lekka prawą ręką. W nieznacznym ruchu tej prawej ręki, która przed niespełna godziną zadała śmiertelny cios, przebijając ludzkie serce, było tyle wyrazu, że Ossipon nie umiał powstrzymać dreszczu. Przedłużył go umyślnie i mruknął:",
  "start": 3032.8
 },
 {
  "i": 278,
  "pl": "— Zimno mi. Przemarzłem do szpiku kości.",
  "start": 3047.16
 },
 {
  "i": 279,
  "pl": "Pani Verloc patrzyła prosto przed siebie w perspektywę swej ucieczki. Niby żałobna chorągiew rozpostarta nad ulicą, słowa: „Spuszczono delikwenta z wysokości czternastu stóp” uderzały niekiedy o jej wytężone spojrzenie.",
  "start": 3049.96
 },
 {
  "i": 280,
  "pl": "Poprzez czarną woalkę białka wielkich oczu połyskiwały i lśniły jak u kobiety zamaskowanej.",
  "start": 3065.0
 },
 {
  "i": 281,
  "pl": "Sztywność Ossipona miała w sobie coś rzeczowego, jakiś dziwaczny urzędowy wyraz. Nagle zaczął znów mówić, jakby mu się język rozwiązał:",
  "start": 3071.28
 },
 {
  "i": 282,
  "pl": "— Słuchaj no, może wiesz, czy twój… czy konto w banku było na jego własne nazwisko, czy też na czyjeś inne?",
  "start": 3079.7
 },
 {
  "i": 283,
  "pl": "Pani Verloc zwróciła ku niemu zamaskowaną twarz o jaśniejących białkach.",
  "start": 3087.64
 },
 {
  "i": 284,
  "pl": "— Na czyjeś inne nazwisko? — rzekła z namysłem.",
  "start": 3092.65
 },
 {
  "i": 285,
  "pl": "— Odpowiedz mi na to dokładnie — pouczał Ossipon w sunącej szybko dorożce. — To niezmiernie ważne. Wytłumaczę ci. W banku zachowano numery tych banknotów.",
  "start": 3097.57
 },
 {
  "i": 286,
  "pl": "Jeśli wypłacili mu je na jego własne nazwisko, to kiedy się dowiedzą o jego… jego śmierci, będą mogli wyśledzić nas za pomocą tych banknotów, ponieważ innych pieniędzy nie posiadamy. Może masz przy sobie jakieś inne pieniądze?",
  "start": 3108.01
 },
 {
  "i": 287,
  "pl": "Pokręciła przecząco głową.",
  "start": 3122.89
 },
 {
  "i": 288,
  "pl": "— Ani trochę? — nalegał.",
  "start": 3125.03
 },
 {
  "i": 289,
  "pl": "— Kilka miedziaków.",
  "start": 3127.91
 },
 {
  "i": 290,
  "pl": "— Więc to by było niebezpieczne. Trzeba by operować tymi pieniędzmi w specjalny sposób. Bardzo specjalny. Musielibyśmy pewno stracić więcej niż połowę całej sumy, aby zmienić te banknoty w pewnym bezpiecznym miejscu w Paryżu.",
  "start": 3130.06
 },
 {
  "i": 291,
  "pl": "Natomiast w drugim wypadku, to znaczy jeśli miał konto pod jakimś przybranym nazwiskiem — powiedzmy, Smith — można z zupełnym bezpieczeństwem posługiwać się tymi pieniędzmi. Rozumiesz? Bank nie ma sposobu sprawdzić, że pan Verloc i, powiedzmy, pan Smith, są jedną i tą samą osobą.",
  "start": 3143.28
 },
 {
  "i": 292,
  "pl": "Rozumiesz, jakie to ważne, żebyś się nie pomyliła? I czy w ogóle możesz mi na to odpowiedzieć? Może tego nie wiesz. Co?",
  "start": 3160.1
 },
 {
  "i": 293,
  "pl": "Odpowiedziała ze spokojem:",
  "start": 3168.54
 },
 {
  "i": 294,
  "pl": "— Teraz sobie przypominam. Złożył pieniądze w banku nie na własne nazwisko. Mówił mi kiedyś, że złożył je na nazwisko Prozor.",
  "start": 3170.96
 },
 {
  "i": 295,
  "pl": "— Jesteś tego pewna? — Tak.",
  "start": 3180.28
 },
 {
  "i": 296,
  "pl": "— I nie przypuszczasz, aby ktoś w banku znał jego prawdziwe nazwisko? Może który z urzędników, albo…",
  "start": 3182.82
 },
 {
  "i": 297,
  "pl": "Wzruszyła ramionami.",
  "start": 3188.78
 },
 {
  "i": 298,
  "pl": "— Skądże mam wiedzieć? I czy to prawdopodobne, Tomie?",
  "start": 3190.72
 },
 {
  "i": 299,
  "pl": "— Nie. To chyba nie jest prawdopodobne. Choć lepiej byłoby wiedzieć… No, przyjechaliśmy. Wysiadaj pierwsza i idź prosto na dworzec. Ruszaj się żwawo.",
  "start": 3194.4
 },
 {
  "i": 300,
  "pl": "Został w tyle i zapłacił dorożkarzowi drobnymi z własnych pieniędzy. Program nakreślony z drobiazgową przezornością został wykonany. Gdy pani Verloc z biletem do St.",
  "start": 3205.74
 },
 {
  "i": 301,
  "pl": "Malo w ręku weszła do damskiej poczekalni, towarzysz Ossipon udał się do baru i w siedem minut wchłonął trzy szklanki wody sodowej z mocną wódką.",
  "start": 3215.86
 },
 {
  "i": 302,
  "pl": "— Chcę pozbyć się zaziębienia — wyjaśnił kelnerce z przyjaznym skinieniem głowy, uśmiechając się kurczowo. Po tym wesołym intermedium⁹⁰ opuścił bar z twarzą człowieka, który pił u samego Źródła Zgryzoty. Podniósł oczy na zegar. Już czas. Czekał.",
  "start": 3226.51
 },
 {
  "i": 303,
  "pl": "Pani Verloc ukazała się punktualnie, cała w czerni — czarna jak śmierć we własnej osobie — z opuszczoną woalką, z pęczkiem tanich, bladych kwiatów u kapelusza. Przeszła tuż koło grupy śmiejących się mężczyzn, których śmiech można było zgasić jednym słowem.",
  "start": 3243.17
 },
 {
  "i": 304,
  "pl": "Szła krokiem opieszałym, ale trzymała się prosto; towarzysz Ossipon popatrzył na nią ze zgrozą, nim ruszył z miejsca.",
  "start": 3259.84
 },
 {
  "i": 305,
  "pl": "Pociąg już stał, przed szeregiem otwartych drzwi wagonów nie było prawie nikogo. Ze względu na porę roku i ohydną pogodę pasażerowie stawili się nielicznie. Pani Verloc szła powoli wzdłuż pustych przedziałów, póki Ossipon nie dotknął z tyłu jej łokcia.",
  "start": 3266.96
 },
 {
  "i": 306,
  "pl": "— Wejdź tutaj.",
  "start": 3282.7
 },
 {
  "i": 307,
  "pl": "Weszła, a on został na peronie i rozglądał się wkoło. Pochyliła się ku niemu i rzekła szeptem:",
  "start": 3284.18
 },
 {
  "i": 308,
  "pl": "— Co to znaczy, Tomie? Jakieś niebezpieczeństwo?",
  "start": 3289.54
 },
 {
  "i": 309,
  "pl": "— Poczekaj. Tam idzie konduktor.",
  "start": 3293.51
 },
 {
  "i": 310,
  "pl": "Ossipon zaczepił człowieka w mundurze. Rozmawiali przez chwilę. Słyszała, jak konduktor powiedział: „Dobrze, proszę pana”, dotykając czapki. Ossipon wrócił i rzekł:",
  "start": 3295.31
 },
 {
  "i": 311,
  "pl": "— Powiedziałem mu, żeby nie wpuszczał nikogo do naszego przedziału.",
  "start": 3306.49
 },
 {
  "i": 312,
  "pl": "Pochyliła się naprzód, siedząc.",
  "start": 3310.73
 },
 {
  "i": 313,
  "pl": "— Ty myślisz o wszystkim… Uratujesz mnie, Tomie? — zapytała w porywie strachu, podnosząc raptem woalkę, aby spojrzeć na swego zbawcę.",
  "start": 3313.37
 },
 {
  "i": 314,
  "pl": "Odsłoniła twarz jak z kamienia. A z twarzy tej patrzyły źrenice wielkie, suche, rozwarte szeroko, matowe, wygasłe, jak dwie czarne dziury w świecących białkach.",
  "start": 3322.12
 },
 {
  "i": 315,
  "pl": "— Nic nam nie grozi — rzekł, spoglądając w nie z natężeniem prawie drapieżnym; pani Verloc, uciekającej przed szubienicą, to spojrzenie wydało się pełne tkliwości i siły. Wzruszyło ją głęboko — i ponura, surowa zgroza ustąpiła z kamiennej twarzy.",
  "start": 3332.8
 },
 {
  "i": 316,
  "pl": "Towarzysz Ossipon wpatrywał się w nią, jak nigdy kochanek nie wpatrywał się w ukochaną.",
  "start": 3349.12
 },
 {
  "i": 317,
  "pl": "Aleksander Ossipon, anarchista przezwany Doktorem, autor medycznej (i nieprzyzwoitej) broszury, były prelegent (zajmował się społeczną stroną higieny i wygłaszał odczyty w klubach robotniczych), był wyzwolony z pęt pospolitej moralności, lecz podlegał prawom nauki.",
  "start": 3354.81
 },
 {
  "i": 318,
  "pl": "Jako jej adept, patrzył z naukowego punktu widzenia na tę kobietę, siostrę degenerata i również degeneratkę należącą do typu zbrodniczego. Patrzył na nią i wzywał imienia Lombrosa, podobnie jak włoski wieśniak poleca się ulubionemu świętemu. Patrzył na nią jak człowiek nauki.",
  "start": 3371.66
 },
 {
  "i": 319,
  "pl": "Patrzył na jej policzki, na jej nos, na jej oczy, na jej uszy… Źle! Fatalna historia! Gdy blade wargi pani Verloc rozchyliły się, zmiękłszy pod jego zaciekle badawczym wzrokiem, spojrzał także na jej zęby… Nie ulega żadnej wątpliwości… typ zbrodniczy…",
  "start": 3389.7
 },
 {
  "i": 320,
  "pl": "Jeśli towarzysz Ossipon nie polecił Lombrosowi swej przerażonej duszy, to wyłącznie dlatego, że zgodnie z zasadami nauki nie wierzył, aby coś na kształt duszy mogło w nim przebywać.",
  "start": 3408.02
 },
 {
  "i": 321,
  "pl": "Natomiast żywił w sobie ducha wiedzy, który to duch skłonił go do oddania świadectwa prawdzie w nerwowych, urywanych zdaniach:",
  "start": 3418.14
 },
 {
  "i": 322,
  "pl": "— To był niezwykły chłopak, ten twój brat. Nadzwyczaj interesujący do studiowania. Doskonały typ w swoim rodzaju. Doskonały!",
  "start": 3426.98
 },
 {
  "i": 323,
  "pl": "Mówił pod wpływem ukrytego strachu, przybierając ton naukowca. A pani Verloc, słysząc te łaskawe słowa pochwały jej ukochanego brata, zachwiała się i pochyliła naprzód z błyskiem w mrocznych oczach, podobnym do słonecznego promienia, który poprzedza burzę.",
  "start": 3435.52
 },
 {
  "i": 324,
  "pl": "— On był naprawdę wyjątkowy — szepnęła cicho drżącymi wargami. — Ty się nim bardzo interesowałeś, Tomie. Wziąłeś mnie tym za serce.",
  "start": 3452.76
 },
 {
  "i": 325,
  "pl": "— To wprost niewiarygodne, do jakiego stopnia wyście byli do siebie podobni — ciągnął Ossipon, dając wyraz swej nieustannej obawie, a zarazem usiłując nie zdradzić chorobliwie nerwowej niecierpliwości, z jaką wyczekiwał odejścia pociągu. — Tak, on był do ciebie podobny.",
  "start": 3463.49
 },
 {
  "i": 326,
  "pl": "Z tych słów nie przebijało żadne szczególne wzruszenie ani też współczucie. Ale już sam fakt, że Ossipon podkreślał podobieństwo Winnie do brata, wstrząsnął silnie jej uczuciami. Z lekkim okrzykiem wyprężyła ramiona i wybuchnęła nareszcie płaczem.",
  "start": 3481.74
 },
 {
  "i": 327,
  "pl": "Ossipon wsiadł do wagonu, zamknął pośpiesznie drzwi i spojrzał przez okno na zegar stacyjny. Jeszcze osiem minut. Przez pierwsze trzy minuty pani Verloc nie przestawała łkać gwałtownie i bezradnie. Potem uspokoiła się trochę, szlochając po cichu wśród obfitych łez.",
  "start": 3497.44
 },
 {
  "i": 328,
  "pl": "Usiłowała mówić do swego zbawcy, do człowieka, który był wysłańcem życia.",
  "start": 3515.67
 },
 {
  "i": 329,
  "pl": "— Ach, Tomie! Jakże ja mogę bać się śmierci, kiedy wydarto mi go tak okrutnie? Jak ja mogę! Jak ja mogę być takim tchórzem!",
  "start": 3520.76
 },
 {
  "i": 330,
  "pl": "Żaliła się głośno na swoje przywiązanie do życia, do tego życia, które było pozbawione wdzięku i uroku, i niemal wszystkiego, co czyni je znośnym, lecz oddało się bez zastrzeżeń jedynemu celowi — wiernie aż do morderstwa.",
  "start": 3529.28
 },
 {
  "i": 331,
  "pl": "I jak się to często zdarza w chwilach rozpaczy nieszczęsnej ludzkości, bogatej w cierpienie, lecz ubogiej w słowa, Winnie zawarła najszczerszy okrzyk prawdy w formie wytartej i banalnej, służącej do wypowiadania sztucznych, sentymentalnych frazesów:",
  "start": 3543.19
 },
 {
  "i": 332,
  "pl": "— Jak ja mogę tak się bać śmierci! Chciałam się zabić, Tomie. Ale boję się. Chciałam ze sobą skończyć. Ale nie mogłam. Czy to znaczy, że nie mam serca? Widać kielich goryczy przeznaczony dla takich jak ja nie był jeszcze dość pełen. A kiedy ty się zjawiłeś….",
  "start": 3558.4
 },
 {
  "i": 333,
  "pl": "Umilkła. Po krótkiej chwili wyszlochała w porywie wdzięczności i zaufania:",
  "start": 3576.02
 },
 {
  "i": 334,
  "pl": "— Będę żyła tylko dla ciebie, Tomie!",
  "start": 3581.3
 },
 {
  "i": 335,
  "pl": "— Przesiądź się w tamten kąt, dalej od peronu — rzekł pieczołowicie Ossipon.",
  "start": 3584.37
 },
 {
  "i": 336,
  "pl": "Usłuchała swego zbawcy, który usadowił ją troskliwie i śledził na jej twarzy nadejście drugiego ataku płaczu, jeszcze gwałtowniejszego niż pierwszy. Przypatrywał jej się z miną, rzekłbyś, lekarza liczącego sekundy. Nareszcie usłyszał gwizd.",
  "start": 3589.45
 },
 {
  "i": 337,
  "pl": "W chwili gdy pociąg ruszał, mimowolny skurcz górnej wargi odsłonił zęby Ossipona i nadał jego twarzy wyraz dzikiej stanowczości. Pani Verloc była nieczuła na wszystko, a Ossipon, jej zbawca, stał jak wryty. Czuł, że wagony suną coraz szybciej, towarzysząc głuchym stukotem głośnym łkaniom kobiety.",
  "start": 3604.21
 },
 {
  "i": 338,
  "pl": "Nagle dwoma susami minął przedział, otworzył ostrożnie drzwi i wyskoczył.",
  "start": 3622.77
 },
 {
  "i": 339,
  "pl": "Wyskoczył u samego końca peronu; a z taką zawziętością przeprowadził swój desperacki plan, że zdołał jakimś cudem, niemal wisząc w powietrzu, zatrzasnąć drzwi od przedziału. Dokonawszy tego, poczuł, że toczy się po ziemi jak zastrzelony królik.",
  "start": 3628.27
 },
 {
  "i": 340,
  "pl": "Był potłuczony, wstrząśnięty, blady jak śmierć i bez tchu, kiedy się dźwignął na nogi. Ale był spokojny i potrafił zachować się jak należy wobec tłumu podnieconych kolejarzy, którzy go w mig otoczyli.",
  "start": 3643.29
 },
 {
  "i": 341,
  "pl": "Wyjaśnił cichym i przekonywającym tonem, że jego żona musiała nagle wyjechać do umierającej matki, do Bretanii; że niepokoi się o nią bardzo, bo jest strasznie przybita; że usiłując podtrzymać ją na duchu, wcale nie zauważył, iż pociąg rusza.",
  "start": 3655.17
 },
 {
  "i": 342,
  "pl": "Na ogólny okrzyk: „Więc dlaczego pan nie pojechał do Southampton?” odpowiedział, że w domu została tylko młoda, niedoświadczona siostra żony z trojgiem małych dzieci; niepokoiłaby się bardzo jego nieobecnością, a urzędy telegraficzne już zamknięte. Wyskoczył zupełnie odruchowo.",
  "start": 3669.53
 },
 {
  "i": 343,
  "pl": "— Ale drugi raz tego nie zrobię — rzekł w końcu; uśmiechnął się do wszystkich wokoło, rozdał trochę drobnych i opuścił stację, nawet nie kulejąc.",
  "start": 3686.82
 },
 {
  "i": 344,
  "pl": "Znalazłszy się przed dworcem, towarzysz Ossipon, zaopatrzony w banknoty jak jeszcze nigdy w życiu, odrzucił propozycję dorożkarza.",
  "start": 3696.62
 },
 {
  "i": 345,
  "pl": "— Mogę iść pieszo — rzucił z przyjaznym uśmiechem uprzejmemu dorożkarzowi.",
  "start": 3704.28
 },
 {
  "i": 346,
  "pl": "Mógł iść. I poszedł. Przebył most. Potem wieże Opactwa⁹¹, stojące w masywnym bezruchu, widziały żółty wiecheć jego czupryny sunący pod latarniami. Światła dzielnicy Victoria widziały go także, i Sloane Square, i sztachety Hyde Parku. Po jakimś czasie towarzysz Ossipon znalazł się znów na moście.",
  "start": 3709.06
 },
 {
  "i": 347,
  "pl": "Przyciągnęła jego uwagę rzeka, przepych mrocznych cieni i rozmigotanych blasków kłębiących się w dole wśród ponurej ciszy. Stał długi czas, patrząc na wodę znad parapetu. Zegar na wieży wydał spiżowy dźwięk nad jego pochyloną głową. Spojrzał na tarczę zegara…",
  "start": 3729.72
 },
 {
  "i": 348,
  "pl": "Pół do pierwszej — burzliwa noc szaleje nad Kanałem.",
  "start": 3746.54
 },
 {
  "i": 349,
  "pl": "Towarzysz Ossipon znowu zaczął iść. Jego krzepką postać widziano tej nocy w odległych dzielnicach miasta, które jak olbrzymi potwór drzemało na dywanie z błota pod welonem zimnej mgły.",
  "start": 3750.76
 },
 {
  "i": 350,
  "pl": "Przecinał ulice milczące i głuche, malał w nieskończenie długich, prostych perspektywach między rzędami niewyraźnych domów, ciągnących się wzdłuż pustych jezdni obrzeżonych sznurami świateł.",
  "start": 3762.64
 },
 {
  "i": 351,
  "pl": "Szedł przez skwery, place, przez monotonne ulice o nieznanych nazwach, ulice, na których strumień życia osadza bezwładne, beznadziejne okruchy ludzkości. Szedł ciągle. Nagle skręcił do frontowego ogródka o wyłysiałym trawniku i otworzywszy drzwi kluczem wyjętym z kieszeni, wszedł do brudnego domku.",
  "start": 3774.92
 },
 {
  "i": 352,
  "pl": "Tak jak stał, rzucił się ubrany na łóżko i leżał nieruchomo przez cały kwadrans. Nagle siadł, podciągnął kolana i objął je rękami. Brzask zastał go siedzącego w tej samej pozie z otwartymi oczyma.",
  "start": 3793.92
 },
 {
  "i": 353,
  "pl": "Ten człowiek, który mógł chodzić tak długo, tak daleko, tak zupełnie bez celu, nie zdradzając najlżejszego zmęczenia, mógł także siedzieć godzinami jak posąg, nie drgnąwszy ani ręką, ani nogą. Ale gdy późne słońce przeniknęło do pokoju, Ossipon opuścił ręce i padł w tył na poduszkę.",
  "start": 3806.92
 },
 {
  "i": 354,
  "pl": "Oczy jego patrzyły w sufit. Raptem zamknęły się. Towarzysz Ossipon spał w blasku słońca.",
  "start": 3825.08
 }
];
