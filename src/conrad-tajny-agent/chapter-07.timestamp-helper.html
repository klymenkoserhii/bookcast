<!doctype html>
<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to chapter-07.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-07.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

 {
  "i": 50,
  "pl": "— Bardzo słusznie — pochwalił z zadowoleniem wielki człowiek, spoglądając znad tłustego podbródka. — Cieszę się, że w waszej budzie jest ktoś, kto uważa, że i sekretarzowi stanu można czasem zaufać.",
  "start": 540.4
 },
 {
  "i": 51,
  "pl": "Nadinspektor uśmiechnął się wesoło.",
  "start": 554.83
 },
 {
  "i": 52,
  "pl": "— Właściwie to przyszło mi na myśl, że może by było lepiej, aby w tym stadium sprawy Heat został zastąpiony przez…",
  "start": 557.25
 },
 {
  "i": 53,
  "pl": "— Aha! Heat? Osioł, co? — wykrzyknął dostojnik z wyraźną niechęcią.",
  "start": 564.3
 },
 {
  "i": 54,
  "pl": "— Nic podobnego. Bardzo pana proszę, sir Ethelredzie, niech pan nie tłumaczy sobie mych słów tak niesprawiedliwie dla Heata.",
  "start": 571.63
 },
 {
  "i": 55,
  "pl": "— No więc? Pewno za sprytny?",
  "start": 579.73
 },
 {
  "i": 56,
  "pl": "— I to nie… przynajmniej nie zawsze. To on dostarczył mi podstaw do domysłów. Sam z siebie odkryłem jedynie to, że posługiwał się tym człowiekiem prywatnie. Czy można go za to potępić? On bardzo dawno pracuje w policji. Powiedział mi właściwie, iż musi mieć do pracy jakieś narzędzia.",
  "start": 582.31
 },
 {
  "i": 57,
  "pl": "Przyszło mi na myśl, że to konkretne narzędzie powinno służyć całemu Wydziałowi Przestępstw Specjalnych, zamiast stanowić prywatną własność komisarza Heata. Według mego przekonania obowiązkiem naszego wydziału jest pozbycie się tajnych agentów. Ale Heat pracuje w wydziale od dawna.",
  "start": 600.5
 },
 {
  "i": 58,
  "pl": "Zarzuciłby mi, że wypaczam moralność wydziału i szkodzę jego sprawności. Określiłby mój projekt z goryczą jako ochronę zbrodniczej klasy rewolucjonistów. Tak by to osądził.",
  "start": 617.46
 },
 {
  "i": 59,
  "pl": "— No tak. Ale co pan o tym myśli?",
  "start": 628.76
 },
 {
  "i": 60,
  "pl": "— Przede wszystkim chciałbym powiedzieć, co następuje: marna to pociecha jeśli stwierdzimy, że jakiś akt gwałtu — uszkodzenie czyjejś własności lub zabójstwo — nie jest wcale dziełem anarchizmu tylko czegoś zupełnie innego, mianowicie pewnej kategorii tolerowanego łotrostwa.",
  "start": 633.14
 },
 {
  "i": 61,
  "pl": "Zdaje mi się, że bywa tak znacznie częściej, niż przypuszczamy. Dalej widzimy, że istnienie ludzi pozostających na żołdzie obcych mocarstw niszczy w pewnej mierze sprawność naszego nadzoru. Szpieg tego rodzaju może sobie pozwolić na większą zuchwałość niż najzuchwalsi ze spiskowców.",
  "start": 650.54
 },
 {
  "i": 62,
  "pl": "Jego fach nie podlega żadnym ograniczeniom. Szpieg ma zbyt mało wiary, aby być zdolnym do zupełnej negacji i zbyt mało poczucia prawa, aby popełniać bezprawie.",
  "start": 667.6
 },
 {
  "i": 63,
  "pl": "Po trzecie, istnienie tych szpiegów wśród grup rewolucyjnych — którym udzielamy przytułku, ściągając na siebie zarzuty — wyklucza wszelką pewność. Niedawno odebrał pan uspokajający raport od komisarza Heata. Ów raport nie był wcale bezpodstawny — a jednak wiadomy epizod się zdarzył.",
  "start": 677.46
 },
 {
  "i": 64,
  "pl": "Nazywam go epizodem, bo ta sprawa, pozwalam sobie twierdzić, jest epizodyczna; nie stanowi części żadnego ogólnego planu, choćby i najszaleńszego. Właśnie te szczególne jej cechy, które zaskakują i zbijają z tropu komisarza Heata, ustalają w mych oczach jej charakter.",
  "start": 695.92
 },
 {
  "i": 65,
  "pl": "Wystrzegam się szczegółów, sir Ethelredzie.",
  "start": 713.12
 },
 {
  "i": 66,
  "pl": "Dygnitarz, stojący wciąż na dywanie przed kominkiem, słuchał z głęboką uwagą.",
  "start": 716.8
 },
 {
  "i": 67,
  "pl": "— Otóż to właśnie. Niech pan streszcza się możliwie najbardziej.",
  "start": 722.02
 },
 {
  "i": 68,
  "pl": "Nadinspektor zaznaczył gestem pełnym powagi i szacunku, że usiłuje być możliwie zwięzły.",
  "start": 727.24
 },
 {
  "i": 69,
  "pl": "— W przeprowadzeniu tego zamachu tkwi szczególna głupota i niedołęstwo, stąd mam jak najlepsze nadzieje, że ją zgłębię i znajdę w niej coś innego niż indywidualny wybryk fanatyzmu. Jest to z całą pewnością rzecz uknuta.",
  "start": 732.91
 },
 {
  "i": 70,
  "pl": "Tak to wygląda, jakby sprawcę zamachu dostawiono na miejsce, a potem porzucono spiesznie, zostawiając go własnej przemyślności. Stąd wniosek, iż został sprowadzony z zagranicy w celu popełnienia tego zamachu.",
  "start": 746.67
 },
 {
  "i": 71,
  "pl": "Przy tym albo musimy przypuścić, że znał za mało angielski, aby pytać o drogę, albo też przyjmiemy fantastyczne założenie, że był głuchoniemy. Chciałbym teraz wiedzieć… lecz moja ciekawość jest bezcelowa. Oczywiście wyleciał w powietrze przypadkiem. Nie był to przypadek nadzwyczajny.",
  "start": 759.59
 },
 {
  "i": 72,
  "pl": "Ale zaszedł pewien drobny fakt istotnie nadzwyczajny: do jego ubrania był przyszyty adres, znaleziony również przypadkiem. Ten fakt jest niewiarygodny, tak dalece niewiarygodny, że okoliczności, które go wytłumaczą, powinny rzucić światło na całą sprawę.",
  "start": 777.87
 },
 {
  "i": 73,
  "pl": "Otóż zamiast polecić Heatowi, aby prowadził śledztwo w dalszym ciągu, mam zamiar zająć się tym osobiście — i szukać wyjaśnienia w miejscu, gdzie można je znaleźć.",
  "start": 793.19
 },
 {
  "i": 74,
  "pl": "Tym miejscem jest pewien sklep na Brett Street, a wyjaśnienie powinienem otrzymać z ust pewnego tajnego agenta, który był ongi zaufanym szpiegiem nieboszczyka barona Stott-Wartenheima, ambasadora wielkiego mocarstwa przy Dworze Świętego Jakuba⁶².",
  "start": 803.01
 },
 {
  "i": 75,
  "pl": "Nadinspektor umilkł i dodał po chwili:",
  "start": 818.41
 },
 {
  "i": 76,
  "pl": "— Ci ludzie to istna plaga.",
  "start": 821.01
 },
 {
  "i": 77,
  "pl": "Wielki człowiek stojący przed kominkiem, chcąc spojrzeć spod przymkniętych powiek na nadinspektora, odchylał głowę w tył coraz bardziej, co nadało mu wygląd niezmiernie wyniosły.",
  "start": 823.83
 },
 {
  "i": 78,
  "pl": "— Dlaczego pan nie zostawi tego Heatowi?",
  "start": 836.15
 },
 {
  "i": 79,
  "pl": "— Ponieważ jest w naszym wydziale zasiedziały. Tacy ludzie mają swoją własną moralność. Uznałby mój sposób prowadzenia śledztwa za skandaliczne wynaturzenie obowiązku.",
  "start": 839.35
 },
 {
  "i": 80,
  "pl": "Dla niego jest jasne jak słońce, że obowiązek rozkazuje uznać winnymi tylu wybitnych anarchistów, ilu się tylko da, i to na podstawie bardzo niepewnych poszlak, które zebrał podczas śledztwa na miejscu zamachu; o mnie zaś powiedziałby, że usiłuję wykazać niewinność tychże anarchistów.",
  "start": 849.9
 },
 {
  "i": 81,
  "pl": "Staram się przedstawić panu możliwie jasno tę mętną sprawę, nie zapuszczając się w szczegóły.",
  "start": 867.34
 },
 {
  "i": 82,
  "pl": "— Więc wyraziłby się o panu w ten sposób — mruknął sir Ethelred z dumnie wzniesioną głową.",
  "start": 874.26
 },
 {
  "i": 83,
  "pl": "— Obawiam się, że tak… i to z oburzeniem i wstrętem, o których ani pan, ani ja nie mamy wyobrażenia. Urzędnikiem jest świetnym. Nie trzeba wystawiać jego lojalności na zbyt ciężką próbę. To jest zawsze błędem. Poza tym chcę mieć zupełną swobodę…",
  "start": 882.7
 },
 {
  "i": 84,
  "pl": "taką, jakiej nie uważałbym może za wskazane udzielić komisarzowi Heatowi. Nie mam najmniejszego zamiaru oszczędzać tego Verloca. Wyobrażam sobie, że zaskoczy go bardzo tak prędkie wykrycie jego związku z tą sprawą, bez względu na to, jaki jest ów związek. Nie będzie trudno go zastraszyć.",
  "start": 898.38
 },
 {
  "i": 85,
  "pl": "Ale nasz prawdziwy cel leży gdzieś poza tym człowiekiem. Chciałbym, aby mnie pan upoważnił do obiecania mu takich warunków bezpieczeństwa, jakie uznam za stosowne.",
  "start": 916.3
 },
 {
  "i": 86,
  "pl": "— Zgoda — rzekł dostojnik, stojąc wciąż na dywanie przed kominkiem. — Niech pan wyśledzi, co tylko się da; niech pan użyje do tego własnych sposobów.",
  "start": 926.65
 },
 {
  "i": 87,
  "pl": "— Muszę zabrać się do roboty natychmiast, jeszcze dziś wieczór — rzekł nadinspektor.",
  "start": 937.36
 },
 {
  "i": 88,
  "pl": "Sir Ethelred wsunął rękę pod poły surduta i odchyliwszy głowę, przypatrywał się spokojnie nadinspektorowi.",
  "start": 943.06
 },
 {
  "i": 89,
  "pl": "— Posiedzenie przeciągnie się do późna w nocy — powiedział. — Proszę, aby pan przyszedł do parlamentu donieść mi o swych odkryciach, jeśli się jeszcze nie rozejdziemy. Zawiadomię Toodlesa⁶³, żeby na pana czekał. Zaprowadzi pana do mego pokoju.",
  "start": 951.21
 },
 {
  "i": 90,
  "pl": "Liczni krewni oraz przyjaciele sekretarza o młodzieńczym wyglądzie żywili dlań nadzieję poważnej, wspaniałej przyszłości — a tymczasem sfera towarzyska, którą w wolnych chwilach ozdabiał swoją osobą, wybrała dla swego faworyta wyżej wymienione przezwisko.",
  "start": 967.0
 },
 {
  "i": 91,
  "pl": "Sir Ethelred słyszał je co dzień z ust żony i córek (przeważnie przy śniadaniu) i uczynił przezwisku ten zaszczyt, że je zaadaptował z powagą.",
  "start": 983.18
 },
 {
  "i": 92,
  "pl": "Nadinspektor był zaskoczony i uradowany.",
  "start": 992.91
 },
 {
  "i": 93,
  "pl": "— Naturalnie, że stawię się w parlamencie, aby podzielić się z panem swymi odkryciami, jeśli pan będzie miał chwilę czasu, aby…",
  "start": 996.98
 },
 {
  "i": 94,
  "pl": "— Nie będę miał czasu — przerwał wielki człowiek. — Ale zobaczę się z panem. Teraz też nie mam czasu… Czy panu nikt nie będzie towarzyszył?",
  "start": 1004.0
 },
 {
  "i": 95,
  "pl": "— Nikt. Sądzę, że tak będzie najlepiej.",
  "start": 1015.19
 },
 {
  "i": 96,
  "pl": "Wielki człowiek odchylił głowę tak bardzo, aby nie spuszczać wzroku z nadinspektora, że musiał prawie zamknąć powieki.",
  "start": 1018.23
 },
 {
  "i": 97,
  "pl": "— Hm! Aha! A jak pan zamierza… Czy pan się za kogoś przebierze?",
  "start": 1027.12
 },
 {
  "i": 98,
  "pl": "— Właściwie to nie! Ale oczywiście zmienię ubranie.",
  "start": 1035.02
 },
 {
  "i": 99,
  "pl": "— Oczywiście — powtórzył wielki człowiek jakby z wyniosłym roztargnieniem. Odwrócił z wolna dużą głowę i przez ramię rzucił z ukosa dumnym wzrokiem na ciężki marmurowy zegar, który tykał chytrze i słabo.",
  "start": 1039.21
 },
 {
  "i": 100,
  "pl": "Złocone wskazówki skorzystały tymczasem ze sposobności i przesunęły się za plecami dostojnika o całych dwadzieścia minut.",
  "start": 1051.9
 },
 {
  "i": 101,
  "pl": "Nadinspektor, który nie mógł dojrzeć wskazówek, zdenerwował się trochę w czasie tej przerwy. Lecz wielki człowiek zwrócił ku niemu oblicze spokojne i niezamącone.",
  "start": 1059.24
 },
 {
  "i": 102,
  "pl": "— Doskonale — powiedział i umilkł, jakby w zdecydowanej pogardzie dla urzędowego zegara. — Ale co przede wszystkim skierowało pana na tę drogę?",
  "start": 1070.4
 },
 {
  "i": 103,
  "pl": "— Zawsze byłem zdania… — zaczął nadinspektor.",
  "start": 1082.22
 },
 {
  "i": 104,
  "pl": "— No tak, naturalnie, że pan był zdania… To się samo przez się rozumie. Ale pytam o powód bezpośredni.",
  "start": 1086.3
 },
 {
  "i": 105,
  "pl": "— Jakże mam to określić? Antagonizm nowego człowieka w stosunku do starych metod. Chęć dowiedzenia się czegoś z pierwszej ręki. Trochę niecierpliwości. Pracuję wciąż w tym samym zakresie, tylko że uprząż jest inna. Uwierała mnie trochę w paru czułych miejscach.",
  "start": 1096.06
 },
 {
  "i": 106,
  "pl": "— Mam nadzieję, że się panu powiedzie — rzekł łaskawie wielki człowiek, wyciągając rękę miękką w dotknięciu, lecz szeroką i potężną jak dłoń monumentalnego farmera. Nadinspektor uścisnął ją i wyszedł.",
  "start": 1113.75
 },
 {
  "i": 107,
  "pl": "W sąsiednim pokoju Toodles, który czekał, siedząc na brzegu stołu, podszedł do nadinspektora, miarkując wrodzoną sobie wesołość.",
  "start": 1128.41
 },
 {
  "i": 108,
  "pl": "— No jakże? Zadowolony pan? — zapytał żywo z powagą.",
  "start": 1137.89
 },
 {
  "i": 109,
  "pl": "— Najzupełniej. Winienem panu wieczną wdzięczność — odrzekł nadinspektor; jego długie oblicze wyglądało jak wyciosane z drzewa, w przeciwieństwie do niby to poważnej twarzy sekretarza, gotowej lada chwila rozpłynąć się w uśmiechu i chichocie.",
  "start": 1142.81
 },
 {
  "i": 110,
  "pl": "— To świetnie. Ale mówię panu, nie może pan sobie wyobrazić, jaki on jest rozdrażniony z powodu tych ataków na jego prawo o upaństwowieniu łowisk. Nazywają to początkiem rewolucji społecznej. Naturalnie, że to jest krok rewolucyjny. Ale tamci są wprost pozbawieni przyzwoitości. Te ataki osobiste…",
  "start": 1159.46
 },
 {
  "i": 111,
  "pl": "— Ja czytam dzienniki — zauważył nadinspektor.",
  "start": 1179.62
 },
 {
  "i": 112,
  "pl": "— Ohydne! Prawda? A pan nie ma pojęcia, jakie on mnóstwo roboty musi dzień w dzień odwalić. Sam wszystko załatwia, jakby nikomu nie ufał w sprawie tych łowisk.",
  "start": 1183.99
 },
 {
  "i": 113,
  "pl": "— A jednak poświęcił całe pół godziny na rozpatrywanie mojej drobnej sprawy — wtrącił nadinspektor.",
  "start": 1195.12
 },
 {
  "i": 114,
  "pl": "— Drobnej! Naprawdę? Bardzo mnie to cieszy. Wobec tego szkoda, że go pan tym zaprzątał. Ta walka strasznie go dużo kosztuje. Coraz bardziej jest wyczerpany. Czuję to, gdy opiera się na moim ramieniu w drodze do parlamentu. A czy on naprawdę jest na ulicy bezpieczny?",
  "start": 1201.29
 },
 {
  "i": 115,
  "pl": "Dziś po południu Mullins rozstawił tu swój oddział. Przy każdej latarni sterczy policjant i co drugi człowiek, którego spotykamy po drodze do Palace Yard, jest oczywistym szpiclem. On wkrótce będzie miał tego dosyć.",
  "start": 1218.43
 },
 {
  "i": 116,
  "pl": "Proszę pana, chyba to niemożliwe, aby któryś z tych zagranicznych łotrów podniósł na niego rękę… jak pan myśli? To by była klęska narodowa. Jakżeby kraj bez niego się obszedł?",
  "start": 1232.53
 },
 {
  "i": 117,
  "pl": "— Nie mówiąc już o panu. Przecież on wspiera się na pana ramieniu — zauważył chłodno nadinspektor. — Zginęlibyście obaj.",
  "start": 1246.81
 },
 {
  "i": 118,
  "pl": "— Byłby to dla młodego człowieka łatwy sposób przejścia do historii. Zamordowano tak niewielu brytyjskich ministrów, że nie przeszłoby to bez wrażenia. Ale mówiąc poważnie…",
  "start": 1258.63
 },
 {
  "i": 119,
  "pl": "— Jeśli pan chce przejść do historii, będzie pan musiał coś w tym celu uczynić. Mówię poważnie, że poza przepracowaniem nie grozi obu panom żadne niebezpieczeństwo.",
  "start": 1270.35
 },
 {
  "i": 120,
  "pl": "— Mnie łowiska nie uśmiercą, a do przesiadywania późno w nocy jestem przyzwyczajony — oświadczył Toodles z niewinną lekkomyślnością. Ale poczuł natychmiast skruchę i jął przybierać minę posępną, a dyplomatyczną, jakby naciągał rękawiczki.",
  "start": 1281.42
 },
 {
  "i": 121,
  "pl": "— Jego potężny intelekt da sobie radę choćby z największym nawałem pracy. Ja się boję tylko o jego nerwy. Banda reakcjonistów z tym gburowatym bydlęciem Cheesemannem na czele wciąż go znieważa.",
  "start": 1297.61
 },
 {
  "i": 122,
  "pl": "— A jeśli będzie chciał rozpętać rewolucję? — mruknął nadinspektor.",
  "start": 1309.92
 },
 {
  "i": 123,
  "pl": "— Nadszedł już czas; on jest jedynym człowiekiem dość wielkim na to, aby się podjąć tego dzieła — zapewnił wywrotowy Toodles, zapalając się pod spokojnym, rozważnym wzrokiem nadinspektora. Gdzieś na korytarzu daleki dzwonek zabrzmiał nagląco i młody człowiek nadstawił ucha ze zbożną czujnością.",
  "start": 1316.83
 },
 {
  "i": 124,
  "pl": "— Już jest gotów do wyjścia — wyszeptał gorączkowo, porwał kapelusz i znikł z pokoju.",
  "start": 1336.39
 },
 {
  "i": 125,
  "pl": "Nadinspektor wyszedł innymi drzwiami krokiem mniej elastycznym. Przeciął znów szeroką aleję, potem szedł śpiesznie wąską uliczką i powrócił do gmachu, gdzie mieścił się jego wydział. Nie zwalniając kroku, znalazł się u drzwi swego gabinetu. Nim zdążył je zamknąć, jego oczy pobiegły do biurka.",
  "start": 1342.95
 },
 {
  "i": 126,
  "pl": "Stał chwilę bez ruchu, potem przeszedł kilka kroków, rozejrzał się po podłodze, siadł na fotelu, zadzwonił i czekał.",
  "start": 1361.37
 },
 {
  "i": 127,
  "pl": "— Czy komisarz Heat jut poszedł?",
  "start": 1369.25
 },
 {
  "i": 128,
  "pl": "— Tak jest, panie nadinspektorze. Pół godziny temu.",
  "start": 1372.44
 },
 {
  "i": 129,
  "pl": "Nadinspektor skinął głową.",
  "start": 1376.42
 },
 {
  "i": 130,
  "pl": "— Dobrze.",
  "start": 1378.85
 },
 {
  "i": 131,
  "pl": "Siedząc nieruchomo, w kapeluszu zsuniętym z czoła, pomyślał, że to wygląda zupełnie na bezczelność Heata, żeby jakby nigdy nic zabrać z sobą jedyny dowód rzeczowy. Ale pomyślał to bez niechęci. Dawni, cenieni słudzy pozwalają sobie na takie rzeczy.",
  "start": 1380.12

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
