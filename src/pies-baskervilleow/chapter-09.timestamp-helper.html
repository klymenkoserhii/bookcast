  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to mp3/pies-baskervilleow_010_ix-drugie-sprawozdanie-doktora-watsona.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-09.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

  "start": 582.04
 },
 {
  "i": 59,
  "pl": "Ale ten nieznośny brat nie pozwala nam się porozumieć. Dziś po raz pierwszy zdarzyła mi się sposobność widzieć ją sam na sam. Cieszyło ją to widocznie, choć nie chciała słuchać moich wynurzeń miłosnych.",
  "start": 605.46
 },
 {
  "i": 60,
  "pl": "Wracała wciąż do jednego przedmiotu, ostrzegając mnie o grożącym niebezpieczeństwie i dowodząc, że póty nie będzie miała spokoju, dopóki ja tych stron nie opuszczę.",
  "start": 621.7
 },
 {
  "i": 61,
  "pl": "Powiedziałem jej, że nie pilno mi odjeżdżać, skoro ona tu przebywa, i że jeśli dba istotnie o moje bezpieczeństwo, to opuści tę okolicę wraz ze mną, i prosiłem o jej rękę. Zanim jednak zdążyła mi odpowiedzieć, ten jej utrapiony brat wpadł między nas jak kula.",
  "start": 634.36
 },
 {
  "i": 62,
  "pl": "Był blady z gniewu, trząsł się, a z jasnych oczu padały pioruny.",
  "start": 655.74
 },
 {
  "i": 63,
  "pl": "Jak śmiałem przemawiać w ten sposób do jego siostry? — wołał. — Czy dlatego, że jestem baronetem, to wszystko mi wolno?...",
  "start": 661.1
 },
 {
  "i": 64,
  "pl": "Tłumaczyłem mu, że nie potrzebuję wstydzić się moich uczuć dla miss Beryl i że mam nadzieję, iż zaszczyci mnie swoją ręką.",
  "start": 669.94
 },
 {
  "i": 65,
  "pl": "Nie polepszyło to sprawy. Stapleton rozwścieczył się na dobre. I mnie zbrakło cierpliwości. Odpowiedziałem mu za ostro ze względu na jej obecność.",
  "start": 677.39
 },
 {
  "i": 66,
  "pl": "Skończyło się na tym, że on odszedł z siostrą, a ja powracam jak niepyszny. Wytłumacz mi, co to znaczy, a będę ci wdzięczny do śmierci.",
  "start": 692.13
 },
 {
  "i": 67,
  "pl": "Dawałem kilka wyjaśnień, ale nie zadowoliły sir Henryka, bo istotnie, co można mu zarzucić?",
  "start": 704.3
 },
 {
  "i": 68,
  "pl": "Przemawia za nim tytuł, fortuna, charakter, wiek i uroda. Jedyny zarzut, jaki można by mu czynić — to że fatalizm ściga jego rodzinę. Ale Stapleton, jako człowiek uczony, nie powinien by przywiązywać wagi do przesądów.",
  "start": 713.42
 },
 {
  "i": 69,
  "pl": "Toteż nie pojmuję, dlaczego odrzuca jego zabiegi, nie pytając nawet, czy siostra jest mu przychylna, a dziwi mnie nadto, że ona słucha go ślepo.",
  "start": 732.77
 },
 {
  "i": 70,
  "pl": "Nasze domysły na ten temat przerwał sam Stapleton, który przybył po południu, aby przeprosić baroneta za swoją porywczość.",
  "start": 744.0
 },
 {
  "i": 71,
  "pl": "Po długiej rozmowie sam na sam z sir Henrykiem w jego gabinecie wyszli pogodzeni. Dla przypieczętowania zgody zaprosił nas na obiad do Merripit House.",
  "start": 752.95
 },
 {
  "i": 72,
  "pl": "— Dziwny to człowiek — rzekł do mnie sir Henryk po jego odejściu. — Nie mogę zapomnieć wzroku, jakim mnie piorunował dziś rano, ale mimo to muszę przyznać, że teraz znalazł się<sup>20<\/sup> przyzwoicie.",
  "start": 764.48
 },
 {
  "i": 73,
  "pl": "— Czy wytłumaczył swe postąpienie?",
  "start": 776.32
 },
 {
  "i": 74,
  "pl": "— Mówił, że siostra jest mu wszystkim na świecie. Żyli zawsze razem, ona mu była jedynym towarzyszem. Sama myśl o utraceniu jej doprowadza go do rozpaczy.",
  "start": 780.61
 },
 {
  "i": 75,
  "pl": "Nie spostrzegł mojej skłonności ku Beryl, a gdy ją ujrzał w moich objęciach, ogarnął go taki gniew samolubny, że stracił przytomność i nie odpowiada za swoje słowa i czyny. Przepraszał jednak i uznawał, że byłoby szaleństwem chcieć zatrzymać przy sobie kobietę tak piękną, jak jego siostra.",
  "start": 791.87
 },
 {
  "i": 76,
  "pl": "Jeżeli ma go opuścić, to on, Stapleton, woli, żeby poślubiła sąsiada mieszkającego tak blisko niż kogokolwiek innego. Ale musi oswoić się z tą myślą.",
  "start": 811.72
 },
 {
  "i": 77,
  "pl": "Gotów jest mi przyrzec jej rękę, jeżeli w zamian zobowiążę się słowem honoru, że przez trzy miesiące nie wspomnę jej o miłości, nie będę starał się widywać jej sam na sam i zadowolę się zwykłym stosunkiem towarzyskim. Obiecałem mu to solennie i rzeczy na tym stanęły.",
  "start": 826.31
 },
 {
  "i": 78,
  "pl": "A więc jedna z tajemnic już wyjaśniona. Uczuliśmy grunt pod nogami w bagnie, po którym błądzimy po omacku.",
  "start": 849.58
 },
 {
  "i": 79,
  "pl": "Wiemy już teraz, dlaczego Stapleton patrzał niechętnie na konkurenta siostry; chociaż ten konkurent jest jedną z pierwszych partii w kraju.",
  "start": 860.36
 },
 {
  "i": 80,
  "pl": "A teraz przechodzę do innej nici, którą wyciągnąłem ze splątanego motka — do przyczyny łez pani Barrymore i tajemniczych nocnych wędrówek jej męża.",
  "start": 869.15
 },
 {
  "i": 81,
  "pl": "Powinszuj mi, Holmes, i przyznaj, że nie zawiodłem twego zaufania. Ta zagadka została wyjaśniona w jedną noc.",
  "start": 881.45
 },
 {
  "i": 82,
  "pl": "Napisałem: „w jedną noc”, właściwie jednak stało się to w ciągu dwóch nocy, albowiem pierwsze próby chybiły.",
  "start": 890.17
 },
 {
  "i": 83,
  "pl": "Siedziałem z sir Henrykiem w jego pokoju do trzeciej z rana, ale nie doleciał nas żaden inny szmer oprócz głosu zegara. Wreszcie usnęliśmy obaj na krzesłach.",
  "start": 899.34
 },
 {
  "i": 84,
  "pl": "Niezrażeni tym, postanowiliśmy próbę ponowić. Następnej nocy zgasiliśmy lampkę i zapaliwszy papierosy, czekaliśmy, co będzie dalej.",
  "start": 912.97
 },
 {
  "i": 85,
  "pl": "Godziny wlokły się powoli. Wybiła pierwsza, druga; już nas sen morzył, gdy nagle obaj wyprostowaliśmy się na krzesłach. Doleciał nas odgłos kroków.",
  "start": 923.84
 },
 {
  "i": 86,
  "pl": "Zakradały się cichutko i wreszcie umilkły w oddali. Wtedy baronet drzwi otworzył i wyszliśmy na palcach.",
  "start": 940.59
 },
 {
  "i": 87,
  "pl": "Barrymore minął już galerię, korytarz był pogrążony w ciemnościach.",
  "start": 951.97
 },
 {
  "i": 88,
  "pl": "Doszliśmy na palcach do drugiego skrzydła w chwili, gdy kamerdyner wsuwał się do pokoju na końcu korytarza. Zamknął drzwi za sobą. Podsunęliśmy się cichutko, stąpając ostrożnie, w obawie, aby nas nie zdradziło skrzypnięcie podłogi. Zajrzeliśmy przez dziurkę od klucza.",
  "start": 958.21
 },
 {
  "i": 89,
  "pl": "Barrymore stał przy oknie ze świecą w ręku.",
  "start": 978.08
 },
 {
  "i": 90,
  "pl": "Nie ułożyliśmy planu kampanii, ale baronet uważa prostą drogę za najkrótszą i najwłaściwszą. Nie namyślając się, wszedł do pokoju. Barrymore odskoczył od okna.",
  "start": 983.2
 },
 {
  "i": 91,
  "pl": "— Co ty tu robisz? — zapytał go sir Henryk.",
  "start": 995.54
 },
 {
  "i": 92,
  "pl": "— Nic, proszę pana.",
  "start": 999.58
 },
 {
  "i": 93,
  "pl": "Był tak wystraszony, że świeca podskakiwała mu w ręku.",
  "start": 1001.0
 },
 {
  "i": 94,
  "pl": "— Przyszedłem zobaczyć, czy okno zamknięte... Zamykam co dzień wszystkie okna, żeby się złodziej nie zakradł.",
  "start": 1005.55
 },
 {
  "i": 95,
  "pl": "— Tak, zwłaszcza tutaj, na... drugie piętro. Słuchaj, Barrymore — rzekł — postanowiliśmy obaj zmusić cię do powiedzenia prawdy. Im prędzej ją wyznasz, tym lepiej dla ciebie. Dość tych kłamstw. Gadaj! Coś tu robił?",
  "start": 1013.1
 },
 {
  "i": 96,
  "pl": "Spojrzał na nas z rozpaczą, załamał ręce bezradnie.",
  "start": 1032.7
 },
 {
  "i": 97,
  "pl": "— Nie robiłem nic złego — szepnął. — Trzymałem świecę w oknie.",
  "start": 1038.23
 },
 {
  "i": 98,
  "pl": "— A dlaczego ją trzymałeś?",
  "start": 1044.59
 },
 {
  "i": 99,
  "pl": "— Niech mnie pan o to nie pyta. Daję panu słowo honoru, że to cudza tajemnica. Nie mogę jej wyjawić. Gdyby chodziło tylko o mnie, wyznałbym panu całą prawdę.",
  "start": 1046.75
 },
 {
  "i": 100,
  "pl": "Błysnęła mi nagła myśl. Wziąłem świecę, którą Barrymore postawił był na oknie.",
  "start": 1058.48
 },
 {
  "i": 101,
  "pl": "— To zapewne sygnał umówiony — rzekłem. — Zobaczmy, jaka będzie odpowiedź.",
  "start": 1064.24
 },
 {
  "i": 102,
  "pl": "Podniosłem świecę w górę i trzymałem ją tak, jak on przed naszym wejściem. Pomimo ciemności, bo księżyc był zasłonięty chmurami, widać było drzewa, a dalej łąkę. Wtem zobaczyłem blade światełko na bagnie.",
  "start": 1072.54
 },
 {
  "i": 103,
  "pl": "— Jest sygnał! — zawołałem.",
  "start": 1088.8
 },
 {
  "i": 104,
  "pl": "— Nie, proszę pana, to nic nie znaczy — przerwał mi Barrymore. — Upewniam pana, że to przypadkowe.",
  "start": 1091.46
 },
 {
  "i": 105,
  "pl": "— Poruszaj świecą, Watson — zawołaj baronet. — Widzisz? I tamto światło rusza się... Czy i teraz, łotrze, będziesz przeczył, że dawaliście sobie sygnały?... Chodź no tutaj. Mów, kto jest twoim wspólnikiem i jaki knujecie spisek?",
  "start": 1100.01
 },
 {
  "i": 106,
  "pl": "Twarz kamerdynera pociemniała od tłumionego gniewu.",
  "start": 1119.99
 },
 {
  "i": 107,
  "pl": "— Nie powiem! — oświadczył butnie. — To moja rzecz, nie pańska.",
  "start": 1124.91
 },
 {
  "i": 108,
  "pl": "— W takim razie wynoś się zaraz z mego domu!",
  "start": 1129.03
 },
 {
  "i": 109,
  "pl": "— Dobrze. Jeśli trzeba, to trudno.",
  "start": 1131.98
 },
 {
  "i": 110,
  "pl": "— I żebyś mi się nie pokazywał na oczy! To wstyd, hańba!... Twoja rodzina służyła mojej przez kilka pokoleń, a ty knujesz przeciwko mnie spiski?...",
  "start": 1134.08
 },
 {
  "i": 111,
  "pl": "— Nie, nie przeciw panu.",
  "start": 1142.34
 },
 {
  "i": 112,
  "pl": "Słowa te były wypowiedziane głosem kobiecym. Na progu stała pani Barrymore, jeszcze bledsza od męża.",
  "start": 1144.02
 },
 {
  "i": 113,
  "pl": "— Wynosimy się stąd, Elizo — oznajmił jej kamerdyner. — Pakuj nasze rzeczy.",
  "start": 1153.97
 },
 {
  "i": 114,
  "pl": "— O, John! John! Ja cię zgubiłam!... To wszystko moja wina, sir Henryku, moja wyłącznie... On nie winien. Robił to dla mnie, bo go o to prosiłam.",
  "start": 1159.37
 },
 {
  "i": 115,
  "pl": "— Mów pani, wytłumacz, co to znaczy! — zawołał sir Henryk.",
  "start": 1172.32
 },
 {
  "i": 116,
  "pl": "— Mój nieszczęsny brat umiera z głodu, tam, na bagnie... Nie możemy go opuścić... To światło jest sygnałem, że przygotowaliśmy dla niego pożywienie... a tamto światełko wskazuje, gdzie mamy je przynieść...",
  "start": 1176.24
 },
 {
  "i": 117,
  "pl": "— A więc brat pani jest...",
  "start": 1189.4
 },
 {
  "i": 118,
  "pl": "— Zbiegłym więźniem... mordercą... Seldon.",
  "start": 1192.72
 },
 {
  "i": 119,
  "pl": "— To prawda — przytwierdził Barrymore. — Mówiłem, że tajemnica nie jest moja i że nie mam prawa jej zdradzić. Ale teraz sir Henryk przekonał się, że to nie był spisek przeciw niemu...",
  "start": 1197.56
 },
 {
  "i": 120,
  "pl": "Takie jest zatem wyjaśnienie nocnych wędrówek i światła w oknie.",
  "start": 1211.44
 },
 {
  "i": 121,
  "pl": "Sir Henryk i ja patrzaliśmy na tę kobietę ze zdumieniem. Czyż podobna, aby osoba tak przyzwoita i poważna miała w swoich żyłach tę samą krew, co słynny zbrodniarz?...",
  "start": 1217.21
 },
 {
  "i": 122,
  "pl": "— Tak, panie — mówiła jakby w odpowiedzi na nasze myśli. — Moje panieńskie nazwisko było Seldon, a to mój młodszy brat... Psuliśmy go za jego lat dziecinnych, wszystko mu było wolno, więc nabrał przekonania, że świat istnieje dla jego przyjemności...",
  "start": 1231.32
 },
 {
  "i": 123,
  "pl": "Gdy dorósł, wdał się w złe towarzystwo, zaczął hulać i jeszcze gorzej... Wpędził naszą biedną matkę do grobu, a nasze nazwisko błotem obryzgał. Upadał coraz niżej, wreszcie spełnił tę ostatnią zbrodnię...",
  "start": 1250.23
 },
 {
  "i": 124,
  "pl": "Ale dla mnie jest on zawsze małym chłopaczkiem z jasnymi kędziorami, którego niańczyłam jako starsza siostra. Dlatego uciekł z więzienia. Wiedział, że ja tu jestem i że mu nie odmówię pomocy... Przywlókł się do nas, wycieńczony, zgłodniały, ścigany przez policję. Cóż miałam począć?...",
  "start": 1266.59
 },
 {
  "i": 125,
  "pl": "Wzięliśmy go, zamknęli na strychu, żywiliśmy go, przyodziali. Po powrocie jaśnie pana brat sądził, że będzie bezpieczniejszy na bagnie, i tam się ukrywa. Z dnia na dzień spodziewaliśmy się, że opuści te strony, lecz dopóki tu jest, my nie możemy go opuścić.",
  "start": 1289.26
 },
 {
  "i": 126,
  "pl": "Jeżeli kto zawinił, to ja, nie mój mąż; on go ukrywał i żywił przez wzgląd na mnie...",
  "start": 1306.9
 },
 {
  "i": 127,
  "pl": "W głosie jej była szczerość.",
  "start": 1313.76
 },
 {
  "i": 128,
  "pl": "— Czy to prawda, Barrymore?... — zapytał sir Henryk.",
  "start": 1317.63
 },
 {
  "i": 129,
  "pl": "— Tak, panie, święta prawda.",
  "start": 1321.5
 },
 {
  "i": 130,
  "pl": "— Ha! Nie mogę mieć ci za złe, żeś uległ prośbom żony. Wracajcie oboje do waszego pokoju. Pomówimy o tym jutro.",
  "start": 1325.12
 },
 {
  "i": 131,
  "pl": "Wyjrzeliśmy znowu przez okno. Sir Henryk otworzył je; chłodny wiatr smagnął nas po twarzach. Daleko na bagnie płonęło blade światełko.",
  "start": 1334.44
 },
 {
  "i": 132,
  "pl": "— Dziwna rzecz, że on nie boi się zdradzać swej obecności... — rzekł baronet.",
  "start": 1345.45
 },
 {
  "i": 133,
  "pl": "— Może tak światło umieścił, że widać je tylko z tego punktu.",
  "start": 1352.38
 },
 {
  "i": 134,
  "pl": "— Jak ci się zdaje: czy to stąd daleko?",
  "start": 1357.42
 },
 {
  "i": 135,
  "pl": "— Półtorej mili, dwie najwyżej. O ile mogę zmiarkować, jest to w pobliżu Cleft Tor.",
  "start": 1361.33
 },
 {
  "i": 136,
  "pl": "— Nie musi to być daleko, jeśli Barrymore co dzień zanosi tam żywność. Słuchaj, Watson, schwytam tego łotra!",
  "start": 1370.07
 },
 {
  "i": 137,
  "pl": "I mnie ta sama myśl przeszła przez głowę. Wszak Barrymore nie wyjawił nam tajemnicy dobrowolnie, lecz pod naciskiem; nie byliśmy więc zobowiązani do sekretu, a to tym bardziej, że chodziło o łotra, wobec którego ustawały wszelkie względy współczucia.",
  "start": 1378.3
 },
 {
  "i": 138,
  "pl": "Obowiązkiem naszym było oddać go w ręce sprawiedliwości, uniemożliwić mu dalsze zbrodnie. Gdybyśmy go oszczędzili, mogliby to przypłacić życiem sąsiedzi, Stapletonowie na przykład.",
  "start": 1396.4
 },
 {
  "i": 139,
  "pl": "Niepokój o nich wpływał zapewne na to postanowienie sir Henryka.",
  "start": 1409.85
 },
 {
  "i": 140,
  "pl": "— Pójdę z tobą — oświadczyłem.",
  "start": 1415.27
 },
 {
  "i": 141,
  "pl": "— A zatem bierz rewolwer i wdziewaj buty — (byliśmy obaj boso, żeby ciszej stąpać). — Im wcześniej wyruszymy, tym lepiej. Łotr może lada chwila zgasić światło i nie odszukamy go po nocy.",
  "start": 1417.51
 },
 {
  "i": 142,
  "pl": "W pięć minut byliśmy już gotowi i wyruszyliśmy na ową niebezpieczną ekspedycję.",
  "start": 1431.39
 },
 {
  "i": 143,
  "pl": "Noc była pochmurna, wilgotna, od czasu do czasu księżyc wyłaniał się spoza chmur, a gdyśmy doszli do bagna, począł kropić drobny deszczyk.",
  "start": 1437.44
 },
 {
  "i": 144,
  "pl": "Światło wciąż płonęło.",
  "start": 1449.11
 },
 {
  "i": 145,
  "pl": "— Czy masz broń? — spytałem.",
  "start": 1451.44
 },
 {
  "i": 146,
  "pl": "— Mam nóż myśliwski — odparł sir Henryk.",
  "start": 1453.68
 },
 {
  "i": 147,
  "pl": "— Musimy wpaść na niego znienacka, bo mówią, że jest silny, jak lew. Powalimy go, zanim zdoła stawić nam opór.",
  "start": 1457.16
 },
 {
  "i": 148,
  "pl": "— Ciekaw jestem, co by też Holmes powiedział na naszą wyprawę — rzekł baronet. — To godzina duchów; grasują teraz po bagnie... — dodał na wpół żartobliwie.",
  "start": 1465.73
 },
 {
  "i": 149,
  "pl": "Jakby w odpowiedzi na te słowa po trzęsawisku rozległ się ów głos przeraźliwy, który już raz słyszałem w pobliżu Grimpen Mire. Wiatr niósł go wśród nocnej ciszy; z początku było to ciche warczenie, niebawem przeszło w straszne wycie. Baronet zbladł i chwycił się mojego rękawa.",
  "start": 1478.14
 },
 {
  "i": 150,
  "pl": "— Na miłość boską, co to takiego, Watson? — spytał szeptem.",
  "start": 1500.5
 },
 {
  "i": 151,
  "pl": "— Nie wiem. Podobno ten głos rozlega się często po bagnie — odparłem. — Już go raz słyszałem.",
  "start": 1504.64
 },
 {
  "i": 152,
  "pl": "Zaległa znowu cisza, przerażająca, złowroga. Staliśmy, nasłuchując, ale żaden dźwięk nie wpadł nam w ucho.",
  "start": 1512.59
 },
 {
  "i": 153,

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
