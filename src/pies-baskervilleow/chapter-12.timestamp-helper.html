  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to mp3/pies-baskervilleow_013_xii-smierc-na-bagnie.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-12.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

 {
  "i": 57,
  "pl": "— Jeżeli ta kobieta jest istotnie jego żoną, jakiż jego stosunek do pani Lyons?",
  "start": 569.06
 },
 {
  "i": 58,
  "pl": "— Twoja rozmowa z tą damą rzuciła właśnie światło na ten ciemny punkt. Nie wiedziałem, że pani Lyons chce się rozwodzić. Widocznie ma nadzieję wyjść za Stapletona.",
  "start": 575.18
 },
 {
  "i": 59,
  "pl": "— A gdy się zawiedzie w tych nadziejach?",
  "start": 588.9
 },
 {
  "i": 60,
  "pl": "— Ha! Wtedy zgodzi się z nami współpracować. Przede wszystkim musimy obaj widzieć się z nią jutro. Ale czy nie znajdujesz, Watsonie, że zbyt długo pozostawiłeś podopiecznego bez opieki?... Twoje miejsce jest obecnie w Baskerville Hall.",
  "start": 592.12
 },
 {
  "i": 61,
  "pl": "Ostatnie promienie słońca gasły na zachodzie.",
  "start": 612.0
 },
 {
  "i": 62,
  "pl": "— Jeszcze jedno pytanie — rzekłem, wstając. — Wszak między nami nie powinno być sekretów. Powiedz mi, jaki on ma w tym cel?",
  "start": 615.86
 },
 {
  "i": 63,
  "pl": "Holmes zniżył głos.",
  "start": 624.89
 },
 {
  "i": 64,
  "pl": "— Jego celem jest... morderstwo: chłodne, wyrafinowane — odparł. — Nie pytaj mnie o szczegóły. Oplątuję go w sieci, tak jak on sir Henryka. Jednego tylko obawiam się, a mianowicie, żeby on nie wykonał swego zamiaru, zanim będziemy gotowi do walki.",
  "start": 627.32
 },
 {
  "i": 65,
  "pl": "Jeszcze jeden dzień, dwa najwyżej, a będę w stanie zmierzyć się z tym łotrem, ale tymczasem strzeż sir Henryka; żałuję nawet, żeś go dziś opuścił.",
  "start": 651.67
 },
 {
  "i": 66,
  "pl": "Straszny jęk przerwał ciszę. Krew zamarła w mych żyłach.",
  "start": 663.71
 },
 {
  "i": 67,
  "pl": "— Co to takiego? — zawołałem.",
  "start": 668.91
 },
 {
  "i": 68,
  "pl": "Holmes zerwał się na nogi, wybiegł przed jaskinię, nastawił ucha.",
  "start": 671.78
 },
 {
  "i": 69,
  "pl": "— Cicho! — szepnął. — Cicho!",
  "start": 677.96
 },
 {
  "i": 70,
  "pl": "Ten sam jęk powtórzył się bliżej, dźwięczał w nim strach i ból.",
  "start": 680.94
 },
 {
  "i": 71,
  "pl": "— Skąd to dochodzi? — spytał Holmes szeptem.",
  "start": 687.27
 },
 {
  "i": 72,
  "pl": "— Zdaje mi się, że stamtąd — odparłem, wskazując na lewo.",
  "start": 691.37
 },
 {
  "i": 73,
  "pl": "— Nie, nie — zaprzeczył.",
  "start": 695.49
 },
 {
  "i": 74,
  "pl": "I znowu rozdarł ciszę okrzyk pełen rozpaczy i trwogi. Towarzyszył mu teraz dziki pomruk.",
  "start": 697.46
 },
 {
  "i": 75,
  "pl": "— To pies! — zawołał Holmes. — Biegnijmy na pomoc! Prędzej! Prędzej!",
  "start": 705.71
 },
 {
  "i": 76,
  "pl": "Rzucił się naprzód, ja za nim. Po raz trzeci, do uszu naszych doleciał jęk ludzki i straszne warczenie. Stanęliśmy, nasłuchując. Znowu zaległa cisza.",
  "start": 711.03
 },
 {
  "i": 77,
  "pl": "Holmes załamał ręce. Nigdy jeszcze nie widziałem go tak bezradnym.",
  "start": 725.44
 },
 {
  "i": 78,
  "pl": "— Za późno już, za późno!... — mówił z rozpaczą. — Że też siedziałem tu jak bałwan, z założonymi rękoma!... A ty, jak mogłeś wypuścić z opieki sir Henryka!...",
  "start": 730.2
 },
 {
  "i": 79,
  "pl": "Biegliśmy dalej wśród ogarniającej nas mgły i coraz większych ciemności.",
  "start": 741.26
 },
 {
  "i": 80,
  "pl": "— Czy nic nie widzisz? — spytał mnie Holmes.",
  "start": 746.86
 },
 {
  "i": 81,
  "pl": "— Nie — odparłem.",
  "start": 749.6
 },
 {
  "i": 82,
  "pl": "— A to co takiego? — zawołał nagle.",
  "start": 751.84
 },
 {
  "i": 83,
  "pl": "Dało się słyszeć rzężenie. Dolatywało spoza nagiej skały sterczącej przed nami. Podbiegliśmy i oczom naszym przedstawił się straszny widok. U stóp skały, twarzą do ziemi, z rozpostartymi rękoma, leżał martwy już mężczyzna. To rzężenie było jego ostatnim oddechem.",
  "start": 754.86
 },
 {
  "i": 84,
  "pl": "Potarłem zapałkę — w jej świetle ujrzeliśmy coś, od czego krew zastygła nam w żyłach: zwłoki sir Henryka Baskerville’a.",
  "start": 778.46
 },
 {
  "i": 85,
  "pl": "Znaliśmy obaj kraciasty garnitur — ten sam, w którym ukazał nam się po raz pierwszy w mieszkaniu Holmesa. Zapałka zgasła, a z nią nadzieja w naszych sercach.",
  "start": 791.74
 },
 {
  "i": 86,
  "pl": "— Nie daruję sobie nigdy, żem go zostawił samego... — szepnąłem.",
  "start": 805.71
 },
 {
  "i": 87,
  "pl": "— Ja jestem jeszcze bardziej winny, Watsonie. Dla „zaokrąglenia” i „uzupełnienia” dowodów naraziłem życie mojego klienta... Jest to największy cios, jaki mnie kiedykolwiek spotkał w moim fachu!...",
  "start": 811.75
 },
 {
  "i": 88,
  "pl": "Ale skąd mogliśmy przewidzieć, że pomimo naszych próśb i ostrzeżeń puści się sam na to przeklęte bagno?...",
  "start": 825.91
 },
 {
  "i": 89,
  "pl": "— I pomyśleć, że słyszeliśmy jego jęki i nie mogliśmy nadbiec mu z pomocą... Gdzież jest ten przeklęty pies? Lada chwila może wyskoczyć zza skały... A gdzie Stapleton? Pociągniemy go do odpowiedzialności!",
  "start": 833.92
 },
 {
  "i": 90,
  "pl": "— Tak, nie omieszkam tego uczynić — mówił Holmes. — Stryj i bratanek zostali zamordowani! To nie ulega wątpliwości. Jednego wystraszono na śmierć samym widokiem tego zwierzęcia, które wziął za nadprzyrodzone zjawisko; drugi spadł ze skały, uciekając przed tym potworem...",
  "start": 849.98
 },
 {
  "i": 91,
  "pl": "Ale trzeba wykazać łączność pomiędzy psem i jego ofiarą. Jakże dowiedziemy istnienia tego czworonożnego potwora?... Sir Henryk umarł widocznie skutkiem upadku. Ale pomimo całej swej przebiegłości Stapleton nie wymknie się z rąk policji!...",
  "start": 874.28
 },
 {
  "i": 92,
  "pl": "Staliśmy nad zwłokami, bezradni wobec katastrofy, która obróciła wniwecz wszystkie nasze zabiegi. Wreszcie wzeszedł księżyc; weszliśmy na szczyt skały, z której spadł nasz nieszczęśliwy przyjaciel i ogarnęliśmy okiem ponurą płaszczyznę, osrebrzoną teraz łagodnym blaskiem księżyca.",
  "start": 894.0
 },
 {
  "i": 93,
  "pl": "Daleko, w stronie Grimpen-Mire, błyszczało żółte światełko. Płonęło ono niewątpliwie w domu Stapletona. Zacisnąłem pięść w bezsilnym gniewie.",
  "start": 917.5
 },
 {
  "i": 94,
  "pl": "— Aresztujmy go zaraz! — krzyknąłem.",
  "start": 931.18
 },
 {
  "i": 95,
  "pl": "— Nie mamy jeszcze dowodów — przekładał Holmes. — Ten nędznik jest przebiegły, potrafi się bronić. Chodzi nie o to, co wiemy, lecz o to, czego zdołamy dowieść. Jeden krok fałszywy, a wyśliźnie nam się pomiędzy palcami.",
  "start": 934.22
 },
 {
  "i": 96,
  "pl": "— Cóż nam teraz pozostaje?",
  "start": 952.32
 },
 {
  "i": 97,
  "pl": "— Będziemy radzili jutro; dziś trzeba pomyśleć o oddaniu ostatniej posługi przyjacielowi.",
  "start": 955.58
 },
 {
  "i": 98,
  "pl": "Zeszliśmy ze skały i zbliżaliśmy się do zwłok, oświetlonych teraz księżycem.",
  "start": 962.88
 },
 {
  "i": 99,
  "pl": "— Trzeba sprowadzić ludzi — rzekłem. — We dwóch nie przeniesiemy go do Baskerville Hall. Co ci jest? Czyś oszalał?...",
  "start": 969.03
 },
 {
  "i": 100,
  "pl": "Holmes, patrząc na trupa, śmiał się, ręce zacierał. Cóż się stało mojemu przyjacielowi, tak poważnemu zazwyczaj?...",
  "start": 978.94
 },
 {
  "i": 101,
  "pl": "— Broda! Broda! Ten człowiek miał brodę! — wołał.",
  "start": 991.8
 },
 {
  "i": 102,
  "pl": "— Brodę? — podchwyciłem.",
  "start": 1000.56
 },
 {
  "i": 103,
  "pl": "— To nie sir Henryk. To mój sąsiad-skazaniec!",
  "start": 1003.3
 },
 {
  "i": 104,
  "pl": "Z gorączkową skwapliwością odwróciliśmy zwłoki twarzą do księżyca. Nie było wątpliwości: skrwawione czoło, zapadłe oczy, ruda broda — tak, to Seldon. W jednej chwili zrozumiałem, jak się rzeczy miały. Baronet mówił mi, że swoją starą garderobę ofiarował Barrymore’owi.",
  "start": 1009.32
 },
 {
  "i": 105,
  "pl": "Widocznie Barrymore, na prośbę żony, obdarzył nią Seldona, aby mu ułatwić ucieczkę. Buty, czapka, garnitur — wszystko było sir Henryka. Straszny los spotkał więźnia, ale ten człowiek zasłużył na karę i byłby ją poniósł z ramienia sprawiedliwości. Wytłumaczyłem Holmesowi przyczynę naszej pomyłki.",
  "start": 1032.45
 },
 {
  "i": 106,
  "pl": "— To ubranie jest powodem śmierci Seldona — rzekł. — Oczywiście przyuczano psa poznawać sir Henryka po odzieży. Rozumiem teraz, dlaczego but znikł z hotelu; pies zwęszył zapach ubrania na skazańcu i gonił go.",
  "start": 1053.65
 },
 {
  "i": 107,
  "pl": "Jedno tylko mnie zastanawia: jakim sposobem Seldon wśród ciemności mógł wiedzieć, że pies go ściga?...",
  "start": 1075.18
 },
 {
  "i": 108,
  "pl": "— Słyszał warczenie, tak jak my.",
  "start": 1083.51
 },
 {
  "i": 109,
  "pl": "— Samo warczenie psa nie wystraszyłoby go tak dalece, żeby wzywał pomocy, zdradzając swą obecność i narażając się, że go schwytają strażnicy. Z jego okrzyków miarkuję, że odbiegł spory kawał od miejsca, z którego pies go spłoszył.",
  "start": 1086.38
 },
 {
  "i": 110,
  "pl": "— A ja nie rozumiem, dlaczego ten pies został spuszczony dziś właśnie. Sądzę, że nie zawsze jest na swobodzie. Jeżeli Stapleton spuścił go z łańcucha, to chyba spodziewał się, że sir Henryk będzie przechodził przez bagno.",
  "start": 1105.39
 },
 {
  "i": 111,
  "pl": "— Cóż teraz zrobić z tym trupem? Niepodobna zostawić go tutaj na pastwę dzikiego ptactwa.",
  "start": 1119.63
 },
 {
  "i": 112,
  "pl": "— Najlepiej złożyć go w jednej z jaskiń, dopóki nie uwiadomimy policji.",
  "start": 1128.62
 },
 {
  "i": 113,
  "pl": "— Masz słuszność — przyznał Holmes. — Udźwigniemy go chyba we dwóch? Ale patrz... Watson... to on!... Co za zuchwalstwo!... Ani słowa przed nim o naszych podejrzeniach... ani słowa! Bo inaczej, wszystkie moje plany pójdą wniwecz.",
  "start": 1134.52
 },
 {
  "i": 114,
  "pl": "Ujrzałem światełko cygara. W blasku księżyca widziałem wyraźnie drobną postać naturalisty. Spostrzegłszy nas, zatrzymał się, ale po chwili szedł dalej.",
  "start": 1154.09
 },
 {
  "i": 115,
  "pl": "— Kogo ja widzę! — rzekł. — Jeśli mnie oczy nie mylą, doktor Watson. Nie spodziewałem się spotkać pana tutaj... Co to takiego?... Ktoś został ranny... Nie, to niepodobna... Nasz przyjaciel, sir Henryk!...",
  "start": 1168.65
 },
 {
  "i": 116,
  "pl": "Podbiegł i nachylił się nad zwłokami. Słyszałem jego oddech przyśpieszony, cygaro z rąk mu wypadło.",
  "start": 1196.74
 },
 {
  "i": 117,
  "pl": "— Kto to? Kto to taki? — szeptał.",
  "start": 1205.32
 },
 {
  "i": 118,
  "pl": "— To Seldon, więzień, który zbiegł z Princetown.",
  "start": 1212.59
 },
 {
  "i": 119,
  "pl": "Stapleton zbladł okropnie, ale nadludzkim wysiłkiem zapanował nad uczuciem gorzkiego zawodu. Przenosił wzrok z Holmesa na mnie i ze mnie na Holmesa.",
  "start": 1219.34
 },
 {
  "i": 120,
  "pl": "— Co za okropna sprawa! — mówił. — Jakże on umarł?",
  "start": 1232.13
 },
 {
  "i": 121,
  "pl": "— Skręcił kark, spadając z tej skały. Spacerowałem właśnie z moim przyjacielem, gdy doleciał nas przeraźliwy krzyk.",
  "start": 1243.67
 },
 {
  "i": 122,
  "pl": "— I ja ten krzyk słyszałem. To właśnie sprowadza mnie tutaj. Byłem niespokojny o sir Henryka...",
  "start": 1254.4
 },
 {
  "i": 123,
  "pl": "— Dlaczego właśnie o sir Henryka?... — spytałem.",
  "start": 1266.55
 },
 {
  "i": 124,
  "pl": "— Bo miał przyjść do mnie. Ponieważ się spóźniał, wyszedłem na jego spotkanie i wtedy usłyszałem okrzyk... Ale, prawda... — i znowu przeniósł wzrok z mojej twarzy na twarz Holmesa — czyście panowie nie słyszeli nic więcej, oprócz tego okrzyku?",
  "start": 1273.17
 },
 {
  "i": 125,
  "pl": "— Nie, a pan? — spytał Holmes.",
  "start": 1296.97
 },
 {
  "i": 126,
  "pl": "— I ja nie.",
  "start": 1301.26
 },
 {
  "i": 127,
  "pl": "— Więc co znaczy to pytanie?",
  "start": 1304.48
 },
 {
  "i": 128,
  "pl": "— Myślałem o legendach krążących wśród wieśniaków... Podobno słychać szczekanie wśród nocy... Byłem ciekawy, czy i teraz rozlegały się podobne dźwięki...",
  "start": 1306.9
 },
 {
  "i": 129,
  "pl": "— Niceśmy nie słyszeli<sup>23<\/sup> — odparłem.",
  "start": 1320.08
 },
 {
  "i": 130,
  "pl": "— A jak panowie tłumaczą sobie śmierć tego łotra?",
  "start": 1323.93
 },
 {
  "i": 131,
  "pl": "— Przypuszczam — mówiłem — że coś go wystraszyło; uciekał, biegł na oślep, aż mu się noga powinęła i spadł z tej skały głową na dół. Zabił się na miejscu, bo skała jest wysoka i z tej strony prostopadle spuszcza się w kotlinę; druga jej strona łączy się z płaskowzgórzem.",
  "start": 1328.78
 },
 {
  "i": 132,
  "pl": "Biegnąc, więzień w przerażeniu swym nie spostrzegł, że stoi nad przepaścią.",
  "start": 1352.41
 },
 {
  "i": 133,
  "pl": "— To bardzo prawdopodobne — przyznał Stapleton i westchnął z widoczną ulgą, jak gdyby kamień spadł mu z serca. — A cóż pan o tym myśli, panie Holmes?",
  "start": 1358.56
 },
 {
  "i": 134,
  "pl": "— Przypuszczam to samo, co mój przyjaciel.",
  "start": 1376.14
 },
 {
  "i": 135,
  "pl": "— Spodziewaliśmy się pana od chwili, gdy zjechał tu doktor Watson. Zjawiasz się pan w chwili tragicznej...",
  "start": 1380.82
 },
 {
  "i": 136,
  "pl": "— Mam nadzieję, że wyjaśnienie mojego przyjaciela zostanie uznane jako jedynie możliwe. Bądź co bądź, wracając jutro do Londynu, wywiozę stąd przykre wspomnienie...",
  "start": 1390.73
 },
 {
  "i": 137,
  "pl": "— Więc pan wraca jutro?",
  "start": 1403.14
 },
 {
  "i": 138,
  "pl": "— Taki mam zamiar.",
  "start": 1406.91
 },
 {
  "i": 139,
  "pl": "— Spodziewam się, że pańskie badania rzucą światło na tajemniczą sprawę, która zajmuje nas od paru miesięcy.",
  "start": 1409.29
 },
 {
  "i": 140,
  "pl": "— A ja wątpię — odrzekł Holmes z doskonale udaną szczerością. — Detektyw w swoich wywodach zwykł opierać się na faktach, nie zaś na legendach ludowych. To sprawa trudna i zawiła. Nie spodziewam się jej rozwikłać.",
  "start": 1419.19
 },
 {
  "i": 141,
  "pl": "Stapleton spojrzał na niego bystro, potem zwrócił się do mnie:",
  "start": 1438.91
 },
 {
  "i": 142,
  "pl": "— Chętnie bym zaproponował przeniesienie tego biedaka do nas, ale boję się wystraszyć siostrę. Najlepiej Seldonowi zakryć twarz, a zwłoki będą bezpieczne do jutra rana.",
  "start": 1444.06
 },
 {
  "i": 143,
  "pl": "Takeśmy też zrobili, Stapleton zapraszał nas do siebie, ale wymówiliśmy się i obaj podążyliśmy do Baskerville Hall. Naturalista powrócił sam.",
  "start": 1459.86
 },
 {
  "i": 144,
  "pl": "— Trzymamy go już prawie... — mówił Holmes. — A jaka przytomność umysłu! Co za zimna krew!... Jak śmiało patrzał na zwłoki tego, którego uważał za swoją ofiarę!... Mówiłem ci już w Londynie, a teraz powtarzam, że nie miałem jeszcze tak groźnego przeciwnika.",
  "start": 1473.9
 },
 {
  "i": 145,
  "pl": "— Żałuję, że nas widział.",
  "start": 1494.11
 },
 {
  "i": 146,
  "pl": "— I ja żałowałem w pierwszej chwili; ale nie było innej rady.",
  "start": 1496.45
 },
 {
  "i": 147,
  "pl": "— Jak sądzisz: czy świadomość, że jesteś tutaj, wpłynie na jego plany?",
  "start": 1502.61
 },
 {
  "i": 148,
  "pl": "— Zmusi go do ostrożności, a może skłoni do ostatecznych czynów. Jak wielu mądrych zbrodniarzy, jest zapewne zbyt zadufany w swoim rozumie i wyobraża sobie, że nas wywiedzie w pole.",
  "start": 1509.58
 },
 {
  "i": 149,
  "pl": "— I czemuż nie aresztujemy go zaraz?",
  "start": 1524.48
 },
 {
  "i": 150,
  "pl": "— Drogi Watsonie, ty jesteś stworzony na człowieka czynu. Pierwszym twoim popędem jest działać. Ale przypuściwszy, że go aresztujemy dziś wieczorem, cóż nam z tego przyjdzie? Nie zdołamy mu nic dowieść.",
  "start": 1528.52
 },
 {
  "i": 151,
  "pl": "Gdyby mu dopomagał człowiek, moglibyśmy znaleźć dowody; ale choćbyśmy odszukali psa, nie pomoże nam zaciągnąć pętli na szyi swego pana.",
  "start": 1544.94
 },
 {
  "i": 152,
  "pl": "— Mamy przecież dowód.",
  "start": 1556.08
 },
 {
  "i": 153,
  "pl": "— Ani jednego: same tylko przypuszczenia i wnioski. Sąd wyśmiałby nas, gdybyśmy stanęli wobec niego z takim materiałem dowodowym.",
  "start": 1558.73
 },
 {
  "i": 154,
  "pl": "— Wszak możemy się powołać na śmierć sir Karola...",
  "start": 1569.77
 },
 {
  "i": 155,

 {

 },

 },
 {

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
</body>
</html>
