  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to mp3/pies-baskervilleow_012_xi-nieznajomy-ukrywajacy-sie-w-jaskini.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-11.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================

 {

  "pl": "— Przytoczyłeś pan jeden ustęp dosłownie.",
  "start": 535.32
 },
 {
  "i": 65,
  "pl": "— Tak, dopisek. List, jak już raz nadmieniłem, został spalony i nie można go było odczytać. Raz jeszcze pytam panią: dlaczego nalegałaś, aby sir Karol spalił list, który otrzymał w dniu swojej śmierci?",
  "start": 538.47
 },
 {
  "i": 66,
  "pl": "— To sprawa czysto osobista.",
  "start": 559.52
 },
 {
  "i": 67,
  "pl": "— Tym bardziej powinno pani chodzić o oszczędzenie publicznego śledztwa.",
  "start": 563.21
 },
 {
  "i": 68,
  "pl": "— A więc powiem panu. Słyszał pan zapewne o mojej smutnej historii i musi pan wiedzieć, że wyszłam za mąż zbyt pośpiesznie i że miałam powód tego żałować.",
  "start": 569.62
 },
 {
  "i": 69,
  "pl": "— Słyszałem.",
  "start": 581.08
 },
 {
  "i": 70,
  "pl": "— Moje życie było szeregiem prześladowań ze strony męża, którego nienawidzę. Prawo jest po jego stronie, Lyons w każdej chwili może zażądać, abym z nim żyła. Przed napisaniem owego listu do sir Karola dowiedziałam się właśnie, że jest sposób odzyskania wolności, lecz że wymaga to znacznych kosztów.",
  "start": 583.13
 },
 {
  "i": 71,
  "pl": "Byłoby to dla mnie spokojem, szczęściem, wszystkim na świecie. Znałam hojność sir Karola i sądziłam, że gdy usłyszy te smutne dzieje z moich własnych ust, dopomoże mi niewątpliwie.",
  "start": 604.92
 },
 {
  "i": 72,
  "pl": "— Więc dlaczego pani nie poszła na umówione miejsce?",
  "start": 619.95
 },
 {
  "i": 73,
  "pl": "— Bo otrzymałam pomoc z innego źródła.",
  "start": 623.37
 },
 {
  "i": 74,
  "pl": "— Czemuż więc nie uprzedziłaś pani o tym sir Karola?",
  "start": 629.5
 },
 {
  "i": 75,
  "pl": "— Byłabym to uczyniła, gdybym nazajutrz nie wyczytała w dziennikach wiadomości o jego śmierci.",
  "start": 633.84
 },
 {
  "i": 76,
  "pl": "Słowa pani Lyons były dość logicznie powiązane, nie mogłem jej złapać na sprzeczności. Pozostawało tylko sprawdzić, czy istotnie w owym czasie przedsięwzięła kroki rozwodowe.",
  "start": 639.28
 },
 {
  "i": 77,
  "pl": "Wierzyłem, iż tej nocy nie była w Baskerville Hall, bo widziano by konie i wehikuł przy furtce; taka wycieczka nie utrzymałaby się w tajemnicy. Mrs Lyons mówiła więc prawdę lub część prawdy.",
  "start": 651.7
 },
 {
  "i": 78,
  "pl": "Wyszedłem zniechęcony. Więc znowu rozbijałem się o mur zagradzający dalszą drogę odkryć! A jednak, im bardziej przypominałem sobie każdy rys jej twarzy i każde słowo, tym pewniejszy byłem, że nie powiedziała mi wszystkiego.",
  "start": 671.03
 },
 {
  "i": 79,
  "pl": "Bo i czemuż zbladła w pierwszej chwili? Czemu nie od razu przyznała się do listu?... Niewątpliwie była bardziej winna, niż się przedstawiała.",
  "start": 688.18
 },
 {
  "i": 80,
  "pl": "Musiałem tymczasowo poprzestać na jej informacjach i zwrócić się po dalsze w inną stronę — ku jaskiniom naszych przedhistorycznych przodków.",
  "start": 697.58
 },
 {
  "i": 81,
  "pl": "Ale niełatwo było odnaleźć nieznajomego na podstawie ogólnikowej wskazówki. Barrymore powiedział mi, że nieznajomy ukrywa się w jednej z jaskiń, ale takich jaskiń było mnóstwo na każdym kroku. Pamiętałem jednak skałę, na której ukazała mi się postać w blasku księżyca.",
  "start": 709.57
 },
 {
  "i": 82,
  "pl": "Ta skała, Black Tor (Czarne Wrota) miała mi służyć za drogowskaz. Od niej miałem zacząć poszukiwania. Obiecywałem sobie, że znajdę nieznajomego i że musi mi wyznać, dlaczego tu przebywa. Łatwiej mu było umknąć na Regent Street niż na tej otwartej równinie.",
  "start": 729.96
 },
 {
  "i": 83,
  "pl": "Wyślizgnął się pomiędzy palcami wielkiego Holmesa. Jakiż byłby to dla mnie tryumf, gdybym go zdołał schwytać!",
  "start": 754.42
 },
 {
  "i": 84,
  "pl": "Dotychczas w moim śledztwie nie dopisywało mi szczęście — teraz uśmiechnęło się do mnie. Zwiastunem dobrej wieści był pan Frankland.",
  "start": 763.08
 },
 {
  "i": 85,
  "pl": "Stał właśnie przy furtce swego ogrodu, wznoszącego się przy gościńcu.",
  "start": 772.14
 },
 {
  "i": 86,
  "pl": "— Dzień dobry, doktorze Watson! — zagadnął mnie w chwili, gdym przejeżdżał mimo jego siedziby. — Daj koniom odpocząć, a sam zechciej wstąpić do mnie na kieliszek wina.",
  "start": 777.7
 },
 {
  "i": 87,
  "pl": "Nie żywiłem dla niego uczuć przyjaznych po tym, com słyszał o jego postępowaniu z córką, ale chciałem jak najprędzej odprawić grooma<sup>22<\/sup> Perkinsa z wehikułem i końmi.",
  "start": 790.11
 },
 {
  "i": 88,
  "pl": "Korzystając więc ze sposobności, wysiadłem i kazałem powiedzieć sir Henrykowi, że wrócę dopiero na obiad i że przyjdę pieszo.",

 },
 {
  "i": 89,
  "pl": "Wszedłem do domu Franklanda.",
  "start": 811.36
 },
 {
  "i": 90,
  "pl": "— Powinszuj mi pan! — zawołał na wstępie.",
  "start": 814.87
 },
 {
  "i": 91,
  "pl": "— Jest to dla mnie dzień pamiętny;",
  "start": 818.48
 },
 {
  "i": 92,
  "pl": "zapiszę go sobie czerwonym ołówkiem, przyniósł mi bowiem zadowolenie podwójne: naprzód, dał mi sposobność wykazania im, że nie można deptać prawa bezkarnie: odkryłem dokument stwierdzający, że przez park starego Middletona, o sto jardów od dworu, powinna iść droga publiczna.",

 },
 {

 },
 {

 },

  "start": 881.17
 },
 {

 },
 {

 {

 },
 {

  "pl": "Drgnąłem mimo woli.",
  "start": 920.08
 },
 {

 },
 {

 {
  "i": 102,
  "pl": "Dowodzenie było bardzo logiczne.",

 {
  "i": 103,
  "pl": "— Bez wątpienia — odparłem — ale skąd pan wie, że on kryje się na bagnie?",

 },
 {
  "i": 104,

 },
 {
  "i": 105,
  "pl": "Zaniepokoiłem się o Barrymore’a. Niebezpiecznie było dostać się na pastwę przekornego starca. Jego następne słowa zdjęły mi kamień z serca.",

 },
 {

 },
 {

  "pl": "Dzięki Bogu! Frankland był na fałszywym tropie. Udawałem, że ta wiadomość jest mi zupełnie obojętna.",

 },
 {
  "i": 108,
  "pl": "Już Barrymore mówił mi, że nieznajomego obsługuje chłopak. A więc Frankland odkrył ślad tajemniczej postaci, nie zaś Seldona. Jeżeli potrafię wydobyć z niego więcej faktów, oszczędzi mi to czasu i trudu. Jedynie niedowiarstwo mogło skłonić Franklanda do udzielenia mi bliższych informacji.",

 },
 {

 },
 {
  "i": 110,

 },
 {

  "pl": "Nie ma tam ani źdźbła trawy, więc cóż by skubała trzoda, a bez trzody nie ma pastucha.",

 },
 {
  "i": 112,
  "pl": "Odpowiedziałem pokornie, że uznaję nietrafność mojej hipotezy. Rozbroiło go to, skłaniając do dalszych wynurzeń.",
  "start": 1061.86
 },
 {
  "i": 113,
  "pl": "— Wierzaj mi pan, że zanim wyrażę mój sąd, staram się go oprzeć na pewnych danych. Widuję chłopaka z zawiniątkiem codziennie, a czasem dwa razy na dzień. Poczekaj pan chwilkę. Jeżeli mnie oczy nie mylą, coś porusza się na górze...",
  "start": 1069.82
 },
 {
  "i": 114,
  "pl": "Od danego miejsca dzieliło nas kilka mil, lecz mogłem wyraźnie dojrzeć czarny punkcik.",
  "start": 1088.23
 },
 {
  "i": 115,
  "pl": "— Chodź pan, chodź — zawołał Frankland, biegnąc na górę. — Zobaczysz pan na własne oczy i przekonasz się, że nie rzucam słów na wiatr.",
  "start": 1095.03
 },
 {

  "pl": "Na dachu ustawiony był olbrzymi teleskop. Frankland spojrzał przez niego i krzyknął z radości:",

 },
 {

  "start": 1112.7
 },
 {
  "i": 118,
  "pl": "Istotnie ujrzałem malca niosącego zawiniątko na plecach. Wspinał się pod górę powoli. Gdy doszedł do szczytu, ujrzałem wyraźnie jego drobną postać na tle nieba. Rozejrzał się dokoła, jak gdyby obawiał się pogoni, następnie spuścił się drugim stokiem.",

 },
 {
  "i": 119,
  "pl": "— No i cóż? Mam rację? — zagadnął Frankland.",

 {

  "pl": "— Tak, widziałem chłopca na własne oczy; z jego zachowania się można poznać, że spełnia jakąś potajemną misję.",

 {

 },
 {

  "start": 1163.4
 },
 {
  "i": 124,
  "pl": "Nie dałem się jednak uprosić i potrafiłem go odwieść od zamiaru towarzyszenia mi do Baskerville Hall. Trzymałem się gościńca, dopóki mógł mnie widzieć, następnie skręciłem w bok i dążyłem w stronę góry, po której przeszedł chłopak.",
  "start": 1178.48
 },
 {
  "i": 125,
  "pl": "Wszystko mi sprzyjało; postanawiałem skorzystać z okoliczności i dziś jeszcze tę tajemnicę wykryć.",
  "start": 1196.38
 },
 {
  "i": 126,
  "pl": "Słońce już było na zachodzie, gdym doszedł do szczytu góry. Cała równina była pogrążona w grobowej ciszy. Nie było nigdzie chłopca. Rozglądając się dokoła wśród rozrzuconych kamieni, dojrzałem trzy tak ułożone, że mogły służyć za kryjówkę. Serce zabiło we mnie żywiej. Tu musiał przebywać nieznajomy.",
  "start": 1204.04
 },
 {
  "i": 127,
  "pl": "Zbliżywszy się, spostrzegłem dwa kamienie, stojące prostopadle; jeden leżał na nich poziomo. Wszedłem do tej skalistej nory, a przyznaję, że z pewną obawą. Miejsce było puste, ale były w nim ślady, że zamieszkiwała je ludzka istota.",
  "start": 1229.7
 },
 {
  "i": 128,
  "pl": "Na płaskim, wydrążonym kamieniu, który zapewne służył przedhistorycznemu człowiekowi za łoże, była kołdra, zawinięta w pled, na ziemi pozostał jeszcze popiół od zagaszonego ogniska, obok były rondelki i blaszana konewka z wodą, w drugim rogu dostrzegłem butelkę z dżinem.",

 },
 {

  "pl": "Pośrodku był płaski kamień w rodzaju stołu; leżało na nim zawiniątko — to samo zapewne, które przez teleskop widziałem na plecach chłopaka. Rozwiązałem je — był tam bochenek chleba, wędzony ozór i dwa słoiki owocowych konserw. Pod prowiantami leżał kawałek papieru.",
  "start": 1268.34
 },
 {
  "i": 130,
  "pl": "Wziąłem go do rąk i w świetle zapałki odczytałem te słowa skreślone ołówkiem niewprawną ręką:",
  "start": 1290.86
 },
 {
  "i": 131,
  "pl": "Dr. Watson pojechał do Coombe Tracey.",
  "start": 1297.33
 },
 {
  "i": 132,
  "pl": "Przez chwilę stałem z kartką w ręku, nie rozumiejąc, co znaczy to uwiadomienie. A więc śledzono nie sir Henryka, lecz mnie... Tajemniczy nieznajomy, nie mogąc sam mnie tropić, polecił to owemu chłopcu. Ten donosił mu zapewne o każdym moim kroku.",

 },
 {
  "i": 133,
  "pl": "Szukałem innych kartek, ale na próżno; nie mogłem też znaleźć niczego, co by mnie objaśniło o zamiarach człowieka, który obrał tak dziwne miejsce pobytu. Bądź co bądź, odznaczał się spartańskimi obyczajami...",
  "start": 1322.81
 },
 {
  "i": 134,
  "pl": "Wśród dni słotnych kapało mu pewno na głowę, kostniał z zimna wśród chłodnych nocy, a jednak nie opuszczał swej kryjówki. Ważny cel przykuwał go zapewne do tej nory... Poprzysiągłem sobie, że stąd nie wyjdę, dopóki nie dowiem się, czy ten człowiek jest naszym przyjacielem, czy wrogiem.",

 },
 {
  "i": 135,

  "start": 1361.27
 },
 {
  "i": 136,
  "pl": "Usiadłem u wejścia do jaskini i czekałem na przybycie jej lokatora.",
  "start": 1384.17
 },
 {
  "i": 137,
  "pl": "Nareszcie doszedł mnie odgłos jego kroków. Wsunąłem się w najciemniejszy kącik i wyjąłem rewolwer z kieszeni. Kroki umilkły, nagle cień zasłonił otwór.",

 },

 }
];

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
</body>
</html>
