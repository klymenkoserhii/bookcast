<!--
  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to mp3/lalka_005_lalka-tom-pierwszy_tom-i-rozdzial-v.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-05.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================
-->

 {
  "i": 40,
  "pl": "Ten świat wiecznej wiosny, gdzie szeleściły jedwabie, rosły tylko rzeźbione drzewa, a glina pokrywała się artystycznymi malowidłami, ten świat miał swoją specjalną ludność.",
  "start": 575.88
 },
 {
  "i": 41,
  "pl": "Właściwymi jego mieszkańcami były księżniczki i książęta, hrabianki i hrabiowie tudzież bardzo stara i majętna szlachta obojej płci.",
  "start": 587.4
 },
 {
  "i": 42,
  "pl": "Znajdowały się tam jeszcze damy zamężne i panowie żonaci w charakterze gospodarzy domów, matrony strzegące wykwintnego obejścia i dobrych obyczajów i starzy panowie, którzy zasiadali na pierwszych miejscach przy stole, oświadczali młodzież, błogosławili ją i grywali w karty.",
  "start": 596.42
 },
 {
  "i": 43,
  "pl": "Byli też biskupi, wizerunki Boga na ziemi, wysocy urzędnicy, których obecność zabezpieczała świat od nieporządków społecznych i trzęsienia ziemi, a nareszcie dzieci, małe cherubiny, zesłane z nieba po to, ażeby starsi mogli urządzać kinderbale<sup>122<\/sup>.",
  "start": 614.46
 },
 {
  "i": 44,
  "pl": "Wśród stałej ludności zaczarowanego świata ukazywał się od czasu do czasu zwykły śmiertelnik, który na skrzydłach reputacji potrafił wzbić się aż do szczytów Olimpu<sup>123<\/sup>. Zwykle bywał nim jakiś inżynier, który łączył oceany albo wiercił czy też budował Alpy.",
  "start": 632.23
 },
 {
  "i": 45,
  "pl": "Był jakiś kapitan, który w walce z dzikimi stracił swoją kompanię, a sam okryty ranami ocalał dzięki miłości murzyńskiej księżniczki. Był podróżnik, który podobno odkrył nową część świata, rozbił się z okrętem na bezludnej wyspie i bodaj czy nie kosztował ludzkiego mięsa.",
  "start": 649.75
 },
 {
  "i": 46,
  "pl": "Bywali tam wreszcie sławni malarze, a nade wszystko natchnieni poeci, którzy w sztambuchach<sup>124<\/sup> hrabianek pisywali ładne wiersze, mogli kochać się bez nadziei i uwieczniać wdzięki swoich okrutnych bogiń naprzód w gazetach, a następnie w oddzielnych tomikach,",
  "start": 667.67
 },
 {
  "i": 47,
  "pl": "drukowanych na welinowym papierze<sup>125<\/sup>.",
  "start": 683.63
 },
 {
  "i": 48,
  "pl": "Cała ta ludność, między którą ostrożnie przesuwali się wygalonowani<sup>126<\/sup> lokaje, damy do towarzystwa, ubogie kuzynki i łaknący wyższych posad kuzyni, cała ta ludność obchodziła wieczne święto.",
  "start": 687.16
 },
 {
  "i": 49,
  "pl": "Od południa składano sobie i oddawano wizyty i rewizyty albo zjeżdżano się w magazynach. Ku wieczorowi bawiono się przed obiadem, w czasie obiadu i po obiedzie. Potem jechano na koncert lub do teatru, ażeby tam zobaczyć inny sztuczny świat, gdzie bohaterowie rzadko kiedy jedzą i pracują,",
  "start": 700.53
 },
 {
  "i": 50,
  "pl": "ale za to wciąż gadają sami do siebie — gdzie niewierność kobiet staje się źródłem wielkich katastrof i gdzie kochanek, zabity przez męża w piątym akcie, na drugi dzień zmartwychwstaje w pierwszym akcie, ażeby popełniać te same błędy i gadać do siebie nie będąc słyszanym przez osoby obok stojące.",
  "start": 719.31
 },
 {
  "i": 51,
  "pl": "Po wyjściu z teatru znowu zbierano się w salonach, gdzie służba roznosiła zimne i gorące napoje, najęci artyści śpiewali, młode mężatki słuchały opowiadań porąbanego kapitana o murzyńskiej księżniczce, panny rozmawiały z poetami o powinowactwie dusz,",
  "start": 738.03
 },
 {
  "i": 52,
  "pl": "starsi panowie wykładali inżynierom swoje poglądy na inżynierię, a damy w średnim wieku półsłówkami i spojrzeniami walczyły między sobą o podróżnika, który jadł ludzkie mięso.",
  "start": 754.33
 },
 {
  "i": 53,
  "pl": "Potem zasiadano do kolacji, gdzie usta jadły, żołądki trawiły, a buciki rozmawiały o uczuciach lodowatych serc i marzeniach głów niezawrotnych. A potem — rozjeżdżano się, ażeby w śnie rzeczywistym nabrać sił do snu życia.",
  "start": 766.05
 },
 {
  "i": 54,
  "pl": "Poza tym czarodziejskim był jeszcze inny świat — zwyczajny.",
  "start": 784.93
 },
 {
  "i": 55,
  "pl": "O jego istnieniu wiedziała panna Izabela i nawet lubiła mu się przypatrywać z okna karety, wagonu albo z własnego mieszkania. W takich ramach i z takiej odległości wydawał on się jej malowniczym i nawet sympatycznym.",
  "start": 789.49
 },
 {
  "i": 56,
  "pl": "Widywała rolników powoli orzących ziemię — duże fury ciągnione przez chudą szkapę — roznosicieli owoców i jarzyn — starca, który tłukł kamienie na szosie — posłańców idących gdzieś z pośpiechem — ładne i natrętne kwiaciarki — rodzinę złożoną z ojca, bardzo otyłej matki i czworga dzieci,",
  "start": 803.96
 },
 {
  "i": 57,
  "pl": "parami trzymających się za ręce — eleganta niższej sfery, który jechał dorożką i rozpierał się w sposób bardzo zabawny — czasem pogrzeb. I mówiła sobie, że tamten świat, choć niższy, jest ładny; jest nawet ładniejszy od obrazów rodzajowych<sup>127<\/sup>, gdyż porusza się i zmienia co chwilę.",
  "start": 823.56
 },
 {
  "i": 58,
  "pl": "I jeszcze wiedziała panna Izabela, że jak w oranżeriach rosną kwiaty, a w winnicach winogrona, tak w tamtym, niższym świecie, wyrastają rzeczy jej potrzebne.",
  "start": 841.7
 },
 {
  "i": 59,
  "pl": "Stamtąd pochodzi jej wierny Mikołaj i Anusia, tam robią rzeźbione fotele, porcelany, kryształy i firanki, tam rodzą się froterzy<sup>128<\/sup>, tapicerowie, ogrodnicy i panny szyjące suknie.",
  "start": 854.3
 },
 {
  "i": 60,
  "pl": "Będąc raz w magazynie kazała zaprowadzić się do szwalni i bardzo ciekawym wydał się jej widok kilkudziesięciu pracownic, które krajały, fastrygowały i układały na formach fałdy ubrań.",
  "start": 867.66
 },
 {
  "i": 61,
  "pl": "Była pewna, że robi im to wielką przyjemność, ponieważ te panny, które brały jej miarę albo przymierzały suknie, były zawsze uśmiechnięte i bardzo zainteresowane tym, ażeby strój leżał na niej dobrze.",
  "start": 879.5
 },
 {
  "i": 62,
  "pl": "I jeszcze wiedziała panna Izabela, że na tamtym, zwyczajnym świecie trafiają się ludzie nieszczęśliwi.",
  "start": 892.96
 },
 {
  "i": 63,
  "pl": "Więc każdemu ubogiemu, o ile spotkał ją, kazała dawać po kilka złotych; raz spotkawszy mizerną matkę z bladym jak wosk dzieckiem przy piersi oddała jej bransoletę, a brudne, żebrzące dzieci obdarzała cukierkami i całowała z pobożnym uczuciem.",
  "start": 899.53
 },
 {
  "i": 64,
  "pl": "Zdawało się jej, że w którymś z tych biedaków, a może w każdym, jest utajony Chrystus, który zastąpił jej drogę, ażeby dać okazję do spełnienia dobrego czynu.",
  "start": 915.26
 },
 {
  "i": 65,
  "pl": "W ogóle dla ludzi z niższego świata miała serce życzliwe. Przychodziły jej na myśl słowa Pisma świętego: „W pocie czoła pracować będziesz.”<sup>129<\/sup>. Widocznie popełnili oni jakiś ciężki grzech, skoro skazano ich na pracę; ależ tacy jak ona aniołowie nie mogli nie ubolewać nad ich losem.",
  "start": 925.44
 },
 {
  "i": 66,
  "pl": "Tacy jak ona, dla której największą pracą było dotknięcie elektrycznego dzwonka albo wydanie rozkazu.",
  "start": 943.43
 },
 {
  "i": 67,
  "pl": "Raz tylko niższy świat zrobił na niej potężne wrażenie.",
  "start": 949.45
 },
 {
  "i": 68,
  "pl": "Pewnego dnia, we Francji, zwiedzała fabrykę żelazną. Zjeżdżając z góry, w okolicy pełnej lasów i łąk, pod szafirowym niebem zobaczyła otchłań wypełnioną obłokami czarnych dymów i białych par i usłyszała głuchy łoskot, zgrzyt i sapanie machin. Potem widziała piece, jak wieże średniowiecznych zamków,",
  "start": 953.53
 },
 {
  "i": 69,
  "pl": "dyszące płomieniami — potężne koła, które obracały się z szybkością błyskawic — wielkie rusztowania, które same toczyły się po szynach — strumienie rozpalonego do białości żelaza i półnagich robotników, jak spiżowe posągi, o ponurych wejrzeniach.",
  "start": 975.37
 },
 {
  "i": 70,
  "pl": "Ponad tym wszystkim — krwawa łuna, warczenie kół, jęki miechów, grzmot młotów i niecierpliwe oddechy kotłów, a pod stopami dreszcz wylęknionej ziemi.",
  "start": 990.83
 },
 {
  "i": 71,
  "pl": "Wtedy zdało się jej, że z wyżyn szczęśliwego Olimpu zstąpiła do beznadziejnej otchłani Wulkana<sup>130<\/sup>, gdzie cyklopowie<sup>131<\/sup> kują pioruny mogące zdruzgotać sam Olimp.",
  "start": 1002.33
 },
 {
  "i": 72,
  "pl": "Przyszły jej na myśl legendy o zbuntowanych olbrzymach, o końcu tego pięknego świata, w którym przebywała, i pierwszy raz w życiu ją, boginię, przed którą gięli się marszałkowie i senatorzy, zdjęła trwoga.",
  "start": 1013.61
 },
 {
  "i": 73,
  "pl": "— To są straszni ludzie, papo... — szepnęła do ojca.",
  "start": 1027.91
 },
 {
  "i": 74,
  "pl": "Ojciec milczał, tylko mocniej przycisnął jej ramię.",
  "start": 1032.26
 },
 {
  "i": 75,
  "pl": "— Ale kobietom oni nic złego nie zrobią?",
  "start": 1035.74
 },
 {
  "i": 76,
  "pl": "— Tak, nawet oni — odpowiedział pan Tomasz.",
  "start": 1039.06
 },
 {
  "i": 77,
  "pl": "W tej chwili pannę Izabelę ogarnął wstyd na myśl, że troszczyła się tylko o kobiety. Więc szybko dodała:",
  "start": 1043.12
 },
 {
  "i": 78,
  "pl": "— A jeżeli nam, to i wam nie zrobią nic złego...",
  "start": 1049.79
 },
 {
  "i": 79,
  "pl": "Ale pan Tomasz uśmiechnął się i potrząsnął głową. W owym czasie dużo mówiono o zbliżającym się końcu starego świata, a pan Tomasz głęboko odczuwał to, z wielkimi trudnościami wydobywając pieniądze od swoich pełnomocników.",
  "start": 1054.5
 },
 {
  "i": 80,
  "pl": "Odwiedziny fabryki stanowiły ważną epokę w życiu panny Izabeli. Z religijną czcią czytywała ona poezje swego dalekiego kuzyna, Zygmunta<sup>132<\/sup>, i zdawało się jej, że dziś znalazła ilustrację do Nie-Boskiej komedii.",
  "start": 1069.34
 },
 {
  "i": 81,
  "pl": "Odtąd często marzyła o zmroku, że na górze kąpiącej się w słońcu, skąd zjeżdżał jej powóz do fabryki, stoją Okopy Św. Trójcy<sup>133<\/sup>, a w tej dolinie zasnutej dymami i parą było obozowisko zbuntowanych demokratów, gotowych lada chwila ruszyć do szturmu i zburzyć jej piękny świat.",
  "start": 1083.28
 },
 {
  "i": 82,
  "pl": "Teraz dopiero zrozumiała, jak gorąco kocha tę swoją duchową ojczyznę, gdzie kryształowe pająki zastępują słońce, dywany — ziemię, posągi i kolumny — drzewa. Tę drugą ojczyznę, która ogarnia arystokrację wszystkich narodów, wykwintność wszystkich czasów i najpiękniejsze zdobycze cywilizacji.",
  "start": 1103.22
 },
 {
  "i": 83,
  "pl": "I to wszystko miałoby runąć, umrzeć albo rozpierzchnąć się!... Rycerska młodzież, która śpiewa z takim uczuciem, tańczy z wdziękiem, pojedynkuje się z uśmiechem albo skacze na środku jeziora w wodę za zgubionym kwiatkiem?...",
  "start": 1124.89
 },
 {
  "i": 84,
  "pl": "Mają zginąć te ukochane przyjaciółki, które okrywały ją tyloma pieszczotami albo siedząc u jej nóg opowiadały jej tyle drobnych tajemnic, albo oddalone od niej pisywały takie długie, bardzo długie listy, w których tkliwe uczucia mieszały się z nader wątpliwą ortografią?",
  "start": 1139.61
 },
 {
  "i": 85,
  "pl": "A ta dobra służba, która ze swymi panami postępuje tak, jakby zaprzysięgała im dozgonną miłość, wierność i posłuszeństwo? A te modystki, które zawsze witają ją z uśmiechem i tak pamiętają o najdrobniejszym szczególe jej toalety, tak dokładnie wiedzą o jej triumfach?",
  "start": 1156.11
 },
 {
  "i": 86,
  "pl": "A te piękne konie, którym jaskółka mogłaby zazdrościć lotu, a te psy mądre i przywiązane jak ludzie, a te ogrody, gdzie ręka ludzka powznosiła pagórki, wylewała strumienie, modelowała drzewa?... I to wszystko miałoby kiedyś zniknąć?...",
  "start": 1172.79
 },
 {
  "i": 87,
  "pl": "Od tych rozmyślań przybył pannie Izabeli na twarz nowy wyraz — łagodnego smutku, który ją robił jeszcze piękniejszą. Mówiono, że już zupełnie dojrzała.",
  "start": 1188.95
 },
 {
  "i": 88,
  "pl": "Rozumiejąc, że wielki świat jest wyższym światem, panna Izabela dowiedziała się powoli, że do tych wyżyn wzbić się można i stale na nich przebywać tylko za pomocą dwóch skrzydeł: urodzenia i majątku.",
  "start": 1200.81
 },
 {
  "i": 89,
  "pl": "Urodzenie zaś i majątek są przywiązane do pewnych wybranych familii, jak kwiat i owoc pomarańczy do pomarańczowego drzewa.",
  "start": 1214.39
 },
 {
  "i": 90,
  "pl": "Bardzo też jest możliwym, że dobry Bóg widząc dwie dusze z pięknymi nazwiskami, połączone węzłem sakramentu, pomnaża ich dochody i zsyła im na wychowanie aniołka, który w dalszym ciągu podtrzymuje sławę rodów swoimi cnotami, dobrym ułożeniem i pięknością.",
  "start": 1223.66
 },
 {
  "i": 91,
  "pl": "Stąd wynika obowiązek oględnego zawierania małżeństw, na czym najlepiej znają się stare damy i sędziwi panowie. Wszystko znaczy trafny dobór nazwisk i majątków.",
  "start": 1240.35
 },
 {
  "i": 92,
  "pl": "Miłość bowiem, nie ta szalona, o jakiej marzą poeci, ale prawdziwie chrześcijańska, zjawia się dopiero po sakramencie i najzupełniej wystarcza, ażeby żona umiała pięknie prezentować się w domu, a mąż z powagą asystować jej w świecie.",
  "start": 1251.62
 },
 {
  "i": 93,
  "pl": "Tak było dawniej i było dobrze, według zgodnej opinii wszystkich matron. Dziś zapomniano o tym i jest źle: mnożą się mezalianse i upadają wielkie rodziny.",
  "start": 1266.87
 },
 {
  "i": 94,
  "pl": "„I nie ma szczęścia w małżeństwach” — dodawała po cichu panna Izabela, której młode mężatki opowiedziały niejeden sekret domowy.",
  "start": 1279.12
 },
 {
  "i": 95,
  "pl": "Dzięki nawet tym opowiadaniom nabrała dużego wstrętu do małżeństwa i lekkiej wzgardy dla mężczyzn.",
  "start": 1289.0
 },
 {
  "i": 96,
  "pl": "Mąż w szlafroku, który ziewa przy żonie, całuje ją mając pełne usta dymu z cygar, często odzywa się: „A dajże mi spokój”, albo po prostu: „Głupia jesteś!...” — ten mąż, który robi hałasy w domu za nowy kapelusz, a za domem wydaje pieniądze na ekwipaże dla aktorek, to wcale nieciekawe stworzenie.",
  "start": 1296.44
 },
 {
  "i": 97,
  "pl": "Co najgorsze, że każdy z nich przed ślubem był gorącym wielbicielem, mizerniał nie widząc długo swej pani, rumienił się, kiedy ją spotkał, a nawet niejeden obiecywał zastrzelić się z miłości.",
  "start": 1315.36
 },
 {
  "i": 98,
  "pl": "Toteż mając lat osiemnaście, panna Izabela tyranizowała mężczyzn chłodem. Kiedy Wiktor Emanuel raz pocałował ją w rękę, uprosiła ojca, że tego samego dnia wyjechali z Rzymu. W Paryżu oświadczył się jej pewien bogaty hrabia francuski; odpowiedziała mu, że jest Polką i za cudzoziemca nie wyjdzie.",
  "start": 1329.17
 },
 {
  "i": 99,
  "pl": "Podolskiego magnata odepchnęła zdaniem, że odda swoją rękę tylko temu, kogo pokocha, a na co się jeszcze nie zanosi, a oświadczyny jakiegoś amerykańskiego milionera zbyła wybuchem śmiechu.",
  "start": 1349.18
 },
 {
  "i": 100,
  "pl": "Takie postępowanie na kilka lat wytworzyło dokoła panny pustkę. Podziwiano ją i wielbiono, ale z daleka; nikt bowiem nie chciał narażać się na szyderczą odmowę.",
  "start": 1362.04
 },
 {
  "i": 101,
  "pl": "Po przejściu pierwszego niesmaku panna Izabela zrozumiała, że małżeństwo trzeba przyjąć takim, jakie jest. Była już zdecydowana wyjść za mąż, pod tym wszakże warunkiem, aby przyszły towarzysz — podobał się jej, miał piękne nazwisko i odpowiedni majątek.",
  "start": 1372.28
 },
 {
  "i": 102,
  "pl": "Rzeczywiście, trafiali się jej ludzie piękni, majętni i utytułowani; na nieszczęście jednak, żaden nie łączył w sobie wszystkich trzech warunków, więc — znowu upłynęło kilka lat.",
  "start": 1388.7
 },
 {
  "i": 103,
  "pl": "Nagle rozeszły się wieści o złym stanie interesów pana Tomasza i — z całego legionu konkurentów — zostało pannie Izabeli tylko dwu poważnych: pewien baron i pewien marszałek<sup>134<\/sup>, bogaci, ale starzy.",
  "start": 1400.57
 },
 {
  "i": 104,
  "pl": "Teraz spostrzegła panna Izabela, że w wielkim świecie usuwa jej się grunt pod nogami, więc zdecydowała się obniżyć skalę wymagań. Ale że baron i marszałek pomimo swoich majątków budzili w niej niepokonaną odrazę, więc odkładała stanowczą decyzję z dnia na dzień.",
  "start": 1414.56
 },
 {
  "i": 105,
  "pl": "Tymczasem pan Tomasz zerwał z towarzystwem. Marszałek nie mogąc się doczekać odpowiedzi wyjechał na wieś, strapiony baron za granicę i — panna Izabela pozostała kompletnie samą. Wprawdzie wiedziała, że każdy z nich wróci na pierwsze zawołanie, ale — którego tu wybrać?... jak przytłumić wstręt?...",
  "start": 1431.56
 },
 {
  "i": 106,

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
</body>
</html>
