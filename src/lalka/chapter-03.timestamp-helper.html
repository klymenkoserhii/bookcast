  ==========================================================================
  timestamp-helper.html — manual boundary stamping (standalone)
  ··········································································
  Use this when align_audio.py got a boundary wrong, or to build timestamps
  by ear for a chapter you have not run ASR on.

  HOW IT WORKS
  1. Open this file next to mp3/lalka_003_lalka-tom-pierwszy_tom-i-rozdzial-iii.mp3 (or use "Load MP3…").
  2. Press  ▶ Play  (or the P key).
  3. At the exact moment each Polish section STARTS, press  SPACE.
     The stamp lands on the highlighted row and the cursor moves to the
     next row automatically — so you just follow the recording and tap.
  4. SPACE again = play/pause.  BACKSPACE = undo last stamp.  ↑/↓ = move row.
  5. Copy the generated `const AUDIO_TIMES = [...]` block into
     chapter-03.html (section 2), replacing the old array. That is all.

  Rows are pre-filled with the current AUDIO_TIMES, so you only need to
  correct the ones that are off. Times are in seconds, editable by hand.
  ==========================================================================

 {
  "i": 56,
  "pl": "Ojciec zerwał się, lecz znowu upadł na poduszki. Tylko wyciągnął do mnie rękę i patrząc wzrokiem, którego nie zapomnę, wyszeptał:",
  "start": 529.8
 },
 {
  "i": 57,
  "pl": "— Pamiętaj!... Wszystko pamiętaj...",
  "start": 538.72
 },
 {
  "i": 58,
  "pl": "Z tym umarł.",
  "start": 542.63
 },
 {
  "i": 59,
  "pl": "W późniejszym życiu przekonałem się, jak proroczymi były poglądy ojca. Wszyscy widzieliśmy drugą gwiazdę napoleońską, która obudziła Włochy i Węgry<sup>72<\/sup>; a chociaż spadła pod Sedanem<sup>73<\/sup>, nie wierzę w jej ostateczne zagaśnięcie. Co mi tam Bismarck, Gambetta albo Beaconsfield!",
  "start": 544.03
 },
 {
  "i": 60,
  "pl": "Niesprawiedliwość dopóty będzie władać światem, dopóki nowy Napoleon nie urośnie.",
  "start": 565.79
 },
 {
  "i": 61,
  "pl": "W parę miesięcy po śmierci ojca pan Raczek i pan Domański wraz z ciotką Zuzanną zebrali się na radę: co ze mną począć? Pan Domański chciał mnie zabrać do swoich biur i powoli wypromować na urzędnika; ciotka zalecała rzemiosło, a pan Raczek zieleniarstwo.",
  "start": 570.77
 },
 {
  "i": 62,
  "pl": "Lecz gdy zapytano mnie: do czego mam ochotę? odpowiedziałem, że do sklepu.",
  "start": 590.68
 },
 {
  "i": 63,
  "pl": "— Kto wie, czy to nie będzie najlepsze — zauważył pan Raczek. — A do jakiegoż byś chciał kupca?",
  "start": 596.94
 },
 {
  "i": 64,
  "pl": "— Do tego na Podwalu<sup>74<\/sup>, co ma we drzwiach pałasz, a w oknie kozaka.",
  "start": 603.34
 },
 {
  "i": 65,
  "pl": "— Wiem — wtrąciła ciotka. — On chce do Mincla.",
  "start": 608.87
 },
 {
  "i": 66,
  "pl": "— Można spróbować — rzekł pan Domański. — Wszyscy przecież znamy Mincla<sup>75<\/sup>.",
  "start": 612.83
 },
 {
  "i": 67,
  "pl": "Pan Raczek na znak zgody plunął aż w komin.",
  "start": 618.19
 },
 {
  "i": 68,
  "pl": "— Boże miłosierny — jęknęła ciotka — ten drab już chyba na mnie pluć zacznie, kiedy brata nie stało... Oj! nieszczęśliwa ja sierota!...",
  "start": 622.71
 },
 {
  "i": 69,
  "pl": "— Wielka rzecz! — odezwał się pan Raczek. — Wyjdź jejmość za mąż, to nie będziesz sierotą.",
  "start": 631.27
 },
 {
  "i": 70,
  "pl": "— A gdzież ja znajdę takiego głupiego, co by mnie wziął?",
  "start": 636.99
 },
 {
  "i": 71,
  "pl": "— Phi! może i ja bym się ożenił z jejmością, bo nie ma mnie kto smarować — mruknął pan Raczek, ciężko schylając się do ziemi, ażeby wypukać popiół z fajki. Ciotka rozpłakała się, a wtedy odezwał się pan Domański:",
  "start": 640.39
 },
 {
  "i": 72,
  "pl": "— Po co robić duże ceregiele. Jejmość nie masz opieki, on nie ma gospodyni; pobierzcie się i przygarnijcie Ignasia, a będziecie nawet mieli dziecko. Jeszcze tanie dziecko, bo Mincel da mu wikt i kwaterę, a wy tylko odzież.",
  "start": 655.36
 },
 {
  "i": 73,
  "pl": "— Hę?... — spytał pan Raczek patrząc na ciotkę.",
  "start": 670.4
 },
 {
  "i": 74,
  "pl": "— No, oddajcie pierwej chłopca do terminu, a potem... może się odważę — odparła ciotka. — Zawsze miałam przeczucie, że marnie skończę...",
  "start": 674.37
 },
 {
  "i": 75,
  "pl": "— To i jazda do Mincla! — rzekł pan Raczek podnosząc się z krzesełka. — Tylko jejmość nie zrób mi zawodu! — dodał grożąc ciotce pięścią.",
  "start": 684.8
 },
 {
  "i": 76,
  "pl": "Wyszli z panem Domańskim i może w półtorej godziny wrócili obaj mocno zarumienieni. Pan Raczek ledwie oddychał, a pan Domański z trudnością trzymał się na nogach, podobno z tego, że nasze schody były bardzo niewygodne.",
  "start": 695.01
 },
 {
  "i": 77,
  "pl": "— Cóż?... — spytała ciotka.",
  "start": 708.77
 },
 {
  "i": 78,
  "pl": "— Nowego Napoleona wsadzili do prochowni!<sup>76<\/sup> — odpowiedział pan Domański.",
  "start": 711.24
 },
 {
  "i": 79,
  "pl": "— Nie do prochowni, tylko do fortecy. A–u... A–u... — dodał pan Raczek i rzucił czapkę na stół.",
  "start": 716.34
 },
 {
  "i": 80,
  "pl": "— Ale z chłopcem co?",
  "start": 723.88
 },
 {
  "i": 81,
  "pl": "— Jutro ma przyjść do Mincla z odzieniem i bielizną — odrzekł pan Domański. — Nie do fortecy A–u..., A–u... tylko do Ham–ham czy Cham... bo nawet nie wiem...",
  "start": 726.26
 },
 {
  "i": 82,
  "pl": "— Zwariowaliście, pijaki! — krzyknęła ciotka chwytając pana Raczka za ramię.",
  "start": 738.28
 },
 {
  "i": 83,
  "pl": "— Tylko bez poufałości! — oburzył się pan Raczek. — Po ślubie będzie poufałość, teraz... Ma przyjść do Mincla jutro z bielizną i odzieniem... Nieszczęsny Napoleonie!...",
  "start": 742.78
 },
 {
  "i": 84,
  "pl": "Ciotka wypchnęła za drzwi pana Raczka, potem pana Domańskiego i wyrzuciła za nimi czapkę.",
  "start": 756.16
 },
 {
  "i": 85,
  "pl": "— Precz mi stąd, pijaki!",
  "start": 761.42
 },
 {
  "i": 86,
  "pl": "— Wiwat Napoleon! — zawołał pan Raczek, a pan Domański zaczął śpiewać:",
  "start": 763.56
 },
 {
  "i": 87,
  "pl": "Głos jego stopniowo cichnął, jakby zagłębiając się w studni, potem umilkł na schodach, lecz znowu doleciał nas z ulicy. Po chwili zrobił się tam jakiś hałas, a gdy wyjrzałem oknem, zobaczyłem, że pana Raczka policjant prowadził do ratusza<sup>77<\/sup>.",
  "start": 779.8
 },
 {
  "i": 88,
  "pl": "Takie to wypadki poprzedziły moje wejście do zawodu kupieckiego.",
  "start": 795.57
 },
 {
  "i": 89,
  "pl": "Sklep Mincla znałem od dawna, ponieważ ojciec wysyłał mnie do niego po papier, a ciotka po mydło. Zawsze biegłem tam z radosną ciekawością, ażeby napatrzeć się wiszącym za szybami zabawkom.",
  "start": 799.96
 },
 {
  "i": 90,
  "pl": "O ile pamiętam, był tam w oknie duży kozak, który sam przez się skakał i machał rękoma, a we drzwiach — bęben, pałasz i skórzany koń z prawdziwym ogonem.",
  "start": 812.18
 },
 {
  "i": 91,
  "pl": "Wnętrze sklepu wyglądało jak duża piwnica, której końca nigdy nie mogłem dojrzeć z powodu ciemności. Wiem tylko, że po pieprz, kawę i liście bobkowe szło się na lewo do stołu, za którym stały ogromne szafy od sklepienia do podłogi napełnione szufladami.",
  "start": 824.44
 },
 {
  "i": 92,
  "pl": "Papier zaś, atrament, talerze i szklanki sprzedawano przy stole na prawo, gdzie były szafy z szybami, a po mydło i krochmal szło się w głąb sklepu, gdzie było widać beczki i stosy pak drewnianych.",
  "start": 840.48
 },
 {
  "i": 93,
  "pl": "Nawet sklepienie było zajęte. Wisiały tam długie szeregi pęcherzy naładowanych gorczycą i farbami, ogromna lampa z daszkiem, która w zimie paliła się cały dzień, sieć pełna korków do butelek, wreszcie — wypchany krokodylek, długi może na półtora łokcia<sup>78<\/sup>.",
  "start": 855.94
 },
 {
  "i": 94,
  "pl": "Właścicielem sklepu był Jan Mincel, starzec z rumianą twarzą i kosmykiem siwych włosów pod brodą. W każdej porze dnia siedział on pod oknem na fotelu obitym skórą, ubrany w niebieski barchanowy kaftan, biały fartuch i takąż szlafmycę.",
  "start": 874.13
 },
 {
  "i": 95,
  "pl": "Przed nim na stole leżała wielka księga, w której notował dochód, a tuż nad jego głową wisiał pęk dyscyplin<sup>79<\/sup>, przeznaczonych głównie na sprzedaż.",
  "start": 890.87
 },
 {
  "i": 96,
  "pl": "Starzec odbierał pieniądze, zdawał gościom resztę, pisał w księdze, niekiedy drzemał, lecz pomimo tylu zajęć, z niepojętą uwagą czuwał nad biegiem handlu w całym sklepie.",
  "start": 901.38
 },
 {
  "i": 97,
  "pl": "On także, dla uciechy przechodniów ulicznych, od czasu do czasu pociągał za sznurek skaczącego w oknie kozaka i on wreszcie, co mi się najmniej podobało, za rozmaite przestępstwa karcił nas jedną z pęka dyscyplin.",
  "start": 912.04
 },
 {
  "i": 98,
  "pl": "Mówię: nas, bo było nas trzech kandydatów do kary cielesnej: ja tudzież dwaj synowcy starego — Franc i Jan Minclowie.",
  "start": 926.92
 },
 {
  "i": 99,
  "pl": "Czujności pryncypała i jego biegłości w używaniu sarniej nogi<sup>80<\/sup> doświadczyłem zaraz na trzeci dzień po wejściu do sklepu.",
  "start": 936.67
 },
 {
  "i": 100,
  "pl": "Franc odmierzył jakiejś kobiecie za dziesięć groszy rodzynków. Widząc, że jedno ziarno upadło na kontuar (stary miał w tej chwili oczy zamknięte), podniosłem je nieznacznie i zjadłem.",
  "start": 944.94
 },
 {
  "i": 101,
  "pl": "Chciałem właśnie wyjąć pestkę, która wcisnęła mi się między zęby, gdy uczułem na plecach coś, jakby mocne dotknięcie rozpalonego żelaza.",
  "start": 957.98
 },
 {
  "i": 102,
  "pl": "— A, szelma! — wrzasnął stary Mincel i nim zdałem sobie sprawę z sytuacji, przeciągnął po mnie jeszcze parę razy dyscyplinę, od wierzchu głowy do podłogi.",
  "start": 965.7
 },
 {
  "i": 103,
  "pl": "Zwinąłem się w kłębek z bólu, lecz od tej pory nie śmiałem wziąć do ust niczego w sklepie. Migdały, rodzynki, nawet rożki miały dla mnie smak pieprzu.",
  "start": 976.14
 },
 {
  "i": 104,
  "pl": "Urządziwszy się ze mną w taki sposób, stary zawiesił dyscyplinę na pęku, wpisał rodzynki i z najdobroduszniejszą miną począł ciągnąć za sznurek kozaka. Patrząc na jego półuśmiechniętą twarz i przymrużone oczy, prawie nie mogłem wierzyć, że ten jowialny staruszek posiada taki zamach w ręku.",
  "start": 987.0
 },
 {
  "i": 105,
  "pl": "I dopiero teraz spostrzegłem, że ów kozak widziany z wnętrza sklepu wydaje się mniej zabawnym niż od ulicy.",
  "start": 1006.48
 },
 {
  "i": 106,
  "pl": "Sklep nasz był kolonialno-galanteryjno-mydlarski. Towary kolonialne wydawał gościom Franc Mincel, młodzieniec trzydziestokilkoletni, z rudą głową i zaspaną fizjognomią<sup>81<\/sup>.",
  "start": 1016.13
 },
 {
  "i": 107,
  "pl": "Ten najczęściej dostawał dyscypliną od stryja, gdyż palił fajkę, późno wchodził za kontuar, wymykał się z domu po nocach, a nade wszystko niedbale ważył towar.",
  "start": 1029.34
 },
 {
  "i": 108,
  "pl": "Młodszy zaś, Jan Mincel, który zawiadywał galanterią i obok niezgrabnych ruchów odznaczał się łagodnością, był znowu bity za wykradanie kolorowego papieru i pisywanie na nim listów do panien.",
  "start": 1040.14
 },
 {
  "i": 109,
  "pl": "Tylko August Katz, pracujący przy mydle, nie ulegał żadnym surowcowym<sup>82<\/sup> upomnieniom. Mizerny ten człeczyna odznaczał się niezwykłą punktualnością.",
  "start": 1054.37
 },
 {
  "i": 110,
  "pl": "Najraniej przychodził do roboty, krajał mydło i ważył krochmal jak automat; jadł, co mu podano, w najciemniejszym kącie sklepu, prawie wstydząc się tego, że doświadcza ludzkich potrzeb. O dziesiątej wieczorem gdzieś znikał.",
  "start": 1066.42
 },
 {
  "i": 111,
  "pl": "W tym otoczeniu upłynęło mi osiem lat, z których każdy dzień był podobny do wszystkich innych dni, jak kropla jesiennego deszczu do innych kropli jesiennego deszczu. Wstawałem rano o piątej, myłem się i zamiatałem sklep. O szóstej otwierałem główne drzwi tudzież okiennicę.",
  "start": 1081.73
 },
 {
  "i": 112,
  "pl": "W tej chwili gdzieś z ulicy zjawiał się August Katz, zdejmował surdut, kładł fartuch i milcząc stawał między beczką mydła szarego a kolumną ułożoną z cegiełek mydła żółtego.",
  "start": 1099.74
 },
 {
  "i": 113,
  "pl": "Potem drzwiami od podwórka wbiegał stary Mincel mrucząc: Morgen!<sup>83<\/sup>, poprawiał szlafmycę, dobywał z szuflady księgę, wciskał się w fotel i parę razy ciągnął za sznurek kozaka.",
  "start": 1112.08
 },
 {
  "i": 114,
  "pl": "Dopiero po nim ukazywał się Jan Mincel i ucałowawszy stryja w rękę stawał za swoim kontuarem, na którym podczas lata łapał muchy, a w zimie kreślił palcem albo pięścią jakieś figury.",
  "start": 1124.3
 },
 {
  "i": 115,
  "pl": "Franca zwykle sprowadzano do sklepu. Wchodził z oczyma zaspanymi, ziewający, obojętnie całował stryja w ramię i przez cały dzień skrobał się w głowę w sposób, który mógł oznaczać wielką senność lub wielkie zmartwienie.",
  "start": 1137.61
 },
 {
  "i": 116,
  "pl": "Prawie nie było ranka, ażeby stryj patrząc na jego manewry nie wykrzywiał mu się i nie pytał:",
  "start": 1153.28
 },
 {
  "i": 117,
  "pl": "— No... a gdzie, ty szelma, latała?",
  "start": 1159.58
 },
 {
  "i": 118,
  "pl": "Tymczasem na ulicy budził się szmer i za szybami sklepu coraz częściej przesuwali się przechodnie. To służąca, to drwal, jejmość w kapturze, to chłopak od szewca, to jegomość w rogatywce szli w jedną i drugą stronę jak figury w ruchomej panoramie<sup>84<\/sup>.",
  "start": 1163.9
 },
 {
  "i": 119,
  "pl": "Środkiem ulicy toczyły się wozy, beczki, bryczki — tam i na powrót... Coraz więcej ludzi, coraz więcej wozów, aż nareszcie utworzył się jeden wielki potok uliczny, z którego co chwilę ktoś wpadał do nas za sprawunkiem.",
  "start": 1182.67
 },
 {
  "i": 120,
  "pl": "— Pieprzu za trojaka<sup>85<\/sup>...",
  "start": 1197.86
 },
 {
  "i": 121,
  "pl": "— Proszę funt<sup>86<\/sup> kawy...",
  "start": 1199.26
 },
 {
  "i": 122,
  "pl": "— Niech pan da ryżu...",
  "start": 1200.98
 },
 {
  "i": 123,
  "pl": "— Pół funta mydła...",
  "start": 1202.7
 },
 {
  "i": 124,
  "pl": "— Za grosz liści bobkowych...",
  "start": 1204.52
 },
 {
  "i": 125,
  "pl": "Stopniowo sklep zapełniał się po największej części służącymi i ubogo odzianymi jejmościami.",
  "start": 1206.92
 },
 {
  "i": 126,
  "pl": "Wtedy Franc Mincel krzywił się najwięcej: otwierał i zamykał szuflady, obwijał towar w tutki<sup>87<\/sup> z szarej bibuły, wbiegał na drabinkę, znowu zwijał, robiąc to wszystko z żałosną miną człowieka, któremu nie pozwalają ziewnąć.",
  "start": 1214.2
 },
 {
  "i": 127,
  "pl": "W końcu zbierało się takie mnóstwo interesantów, że i Jan Mincel, i ja musieliśmy pomagać Francowi w sprzedaży.",
  "start": 1229.0
 },
 {
  "i": 128,
  "pl": "Stary wciąż pisał i zdawał resztę, od czasu do czasu dotykając palcami swojej białej szlafmycy, której niebieski kutasik zwieszał mu się nad okiem. Czasem szarpnął kozaka, a niekiedy z szybkością błyskawicy zdejmował dyscyplinę i ćwiknął<sup>88<\/sup> nią którego ze swych synowców.",
  "start": 1237.52
 },
 {
  "i": 129,
  "pl": "Nader rzadko mogłem zrozumieć: o co mu chodzi? synowcy bowiem niechętnie objaśniali mi przyczyny jego popędliwości.",
  "start": 1255.14
 },
 {
  "i": 130,
  "pl": "Około ósmej napływ interesantów zmniejszał się. Wtedy w głębi sklepu ukazywała się gruba służąca z koszem bułek i kubkami (Franc odwracał się do niej tyłem), a za nią — matka naszego pryncypała, chuda staruszka w żółtej sukni, w ogromnym czepcu na głowie, z dzbankiem kawy w rękach.",
  "start": 1263.5
 },
 {
  "i": 131,
  "pl": "Ustawiwszy na stole swoje naczynie, staruszka odzywała się schrypniętym głosem:",
  "start": 1284.33
 },
 {
  "i": 132,
  "pl": "— Gut Morgen, meine Kinder! Der Kaffee ist schon fertig...<sup>89<\/sup>",
  "start": 1289.17
 },
 {
  "i": 133,
  "pl": "I zaczynała rozlewać kawę w białe fajansowe kubki.",
  "start": 1293.49
 },
 {
  "i": 134,
  "pl": "Wówczas zbliżał się do niej stary Mincel i całował ją w rękę mówiąc:",
  "start": 1297.75
 },
 {
  "i": 135,
  "pl": "— Gut Morgen, meine Mutter!<sup>90<\/sup>",
  "start": 1302.4
 },
 {
  "i": 136,
  "pl": "Za co dostawał kubek kawy z trzema bułkami.",
  "start": 1305.3
 },
 {
  "i": 137,
  "pl": "Potem przychodził Franc Mincel, Jan Mincel, August Katz, a na końcu ja. Każdy całował staruszkę w suchą rękę, porysowaną niebieskimi żyłami, każdy mówił:",
  "start": 1308.29
 },
 {
  "i": 138,
  "pl": "— Gut Morgen, Grossmutter!<sup>91<\/sup>",
  "start": 1319.27
 },
 {
  "i": 139,
  "pl": "I otrzymywał należny mu kubek tudzież trzy bułki.",
  "start": 1321.23
 },
 {
  "i": 140,
  "pl": "A gdyśmy z pośpiechem wypili naszą kawę, służąca zabierała pusty kosz i zamazane kubki, staruszka swój dzbanek i obie znikały.",
  "start": 1325.62
 },
 {
  "i": 141,
  "pl": "Za oknem wciąż toczyły się wozy i płynął w obie strony potok ludzki, z którego co chwila odrywał się ktoś i wchodził do sklepu.",
  "start": 1334.92
 },
 {
  "i": 142,
  "pl": "— Proszę krochmalu...",
  "start": 1343.5
 },
 {
  "i": 143,
  "pl": "— Dać migdałów za dziesiątkę...",
  "start": 1345.08
 },
 {
  "i": 144,

/* ===================================================================== */
/* 2. STATE                                                             */
/* ===================================================================== */
const audio = document.getElementById("audio");
const rowsEl = document.getElementById("rows");
const outEl = document.getElementById("out");
const nowEl = document.getElementById("tnow");
const durEl = document.getElementById("tdur");
const counterEl = document.getElementById("counter");
const seekEl = document.getElementById("seek");
const playBtn = document.getElementById("play");
const toastEl = document.getElementById("toast");

const stamps = SECTIONS.map((s) => (s.start == null ? null : Number(s.start)));
const history = [];
let cursor = 0;          // row that receives the next Space press
let raf = 0;

const fmt = (s, tenths) => {
  if (!isFinite(s)) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m + ":" + (tenths ? sec.toFixed(1).padStart(4, "0") : String(Math.floor(sec)).padStart(2, "0"));
};
const fmt2 = (s) => (s == null ? "—" : s.toFixed(2) + "s");
const preview = (t, n = 46) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const firstWords = (t, n = 6) => t.split(/\s+/).slice(0, n).join(" ");

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

/* ===================================================================== */
/* 3. RENDER                                                            */
/* ===================================================================== */
function render() {
  rowsEl.textContent = "";
  SECTIONS.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row" + (i === cursor ? " active" : "") + (stamps[i] == null ? " empty" : "");
    li.dataset.i = String(i);

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = preview(s.pl);
    txt.title = s.pl;

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmt2(stamps[i]);

    const inp = document.createElement("input");
    inp.className = "t";
    inp.type = "number";
    inp.step = "0.01";
    inp.min = "0";
    inp.value = stamps[i] == null ? "" : stamps[i].toFixed(2);
    inp.setAttribute("aria-label", "start time for section " + (i + 1));
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", () => {
      const v = parseFloat(inp.value);
      pushHistory(i);
      stamps[i] = isFinite(v) ? Math.max(0, v) : null;
      render();
      updateOutput();
    });

    const stamp = document.createElement("button");
    stamp.type = "button";
    stamp.className = "stamp";
    stamp.textContent = "⏺";
    stamp.title = "Stamp the playhead into this row";
    stamp.addEventListener("click", (e) => { e.stopPropagation(); stampRow(i); });

    li.append(idx, txt, val, inp, stamp);
    li.addEventListener("click", () => { cursor = i; seekTo(stamps[i]); render(); });
    rowsEl.appendChild(li);
  });
  counterEl.textContent = stamps.filter((v) => v != null).length;
}

function seekTo(t) {
  if (t == null) return;
  if (audio.readyState >= 1) audio.currentTime = Math.max(0, t);
}

/* ===================================================================== */
/* 4. STAMPING                                                          */
/* ===================================================================== */
function pushHistory(i) {
  history.push({ i, prev: stamps[i] });
  if (history.length > 200) history.shift();
}

function stampRow(i) {
  if (audio.readyState < 1) { toast("Audio not loaded"); return; }
  pushHistory(i);
  stamps[i] = Math.round(audio.currentTime * 100) / 100;
  cursor = Math.min(SECTIONS.length - 1, i + 1);
  render();
  updateOutput();
  const active = rowsEl.querySelector('li.row.active');
  if (active) active.scrollIntoView({ block: "nearest" });
}

function undo() {
  const last = history.pop();
  if (!last) { toast("Nothing to undo"); return; }
  stamps[last.i] = last.prev;
  cursor = last.i;
  render();
  updateOutput();
  toast("Undone row " + (last.i + 1));
}

/* ===================================================================== */
/* 5. OUTPUT                                                            */
/* ===================================================================== */
function updateOutput() {
  const width = String(SECTIONS.length - 1).length;
  const lines = ["const AUDIO_TIMES = ["];
  stamps.forEach((t, i) => {
    const value = t == null ? "null" : t.toFixed(2);
    lines.push(`  ${(value + ",").padEnd(8)} // [${String(i).padStart(width)}] "${firstWords(SECTIONS[i].pl)}…"`);
  });
  lines.push("];");
  outEl.textContent = lines.join("\n");
}

/* ===================================================================== */
/* 6. TRANSPORT                                                         */
/* ===================================================================== */
function refreshPlayLabel() {
  playBtn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function tick() {
  if (audio.paused) return;
  nowEl.textContent = fmt(audio.currentTime, true);
  if (isFinite(audio.duration) && audio.duration > 0) {
    seekEl.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  raf = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play().catch(() => toast("Cannot play — load the MP3 first"));
  else audio.pause();
});
audio.addEventListener("play", () => { refreshPlayLabel(); tick(); });
audio.addEventListener("pause", () => { refreshPlayLabel(); cancelAnimationFrame(raf); nowEl.textContent = fmt(audio.currentTime, true); });
audio.addEventListener("ended", refreshPlayLabel);

audio.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(audio.duration); });

seekEl.addEventListener("input", () => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = (Number(seekEl.value) / 1000) * audio.duration;
  nowEl.textContent = fmt(audio.currentTime, true);
});

document.getElementById("file").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (f) { audio.src = URL.createObjectURL(f); audio.load(); toast("Loaded " + f.name); }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("markNext").addEventListener("click", () => stampRow(cursor));
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Clear every timestamp?")) return;
  stamps.forEach((_, i) => (stamps[i] = null));
  history.length = 0;
  cursor = 0;
  render();
  updateOutput();
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = outEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied AUDIO_TIMES");
  } catch (e) {
    // file:// fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied AUDIO_TIMES"); }
    catch (e2) { toast("Select the array and copy manually"); }
    ta.remove();
  }
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([outEl.textContent + "\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "audio-times.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* --- theme ------------------------------------------------------------ */
const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("helper.theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* --- keyboard --------------------------------------------------------- */
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" && ev.target.type !== "range") return;
  if (tag === "select" || tag === "textarea") return;

  if (ev.code === "Space") {
    ev.preventDefault();                 // never scroll the page
    if (audio.paused) { playBtn.click(); return; }
    stampRow(cursor);                    // playing -> tap on every boundary
  } else if (ev.key === "Backspace") {
    ev.preventDefault();
    undo();
  } else if (ev.key === "ArrowDown") {
    ev.preventDefault();
    cursor = Math.min(SECTIONS.length - 1, cursor + 1);
    render();
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    cursor = Math.max(0, cursor - 1);
    render();
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    seekTo(stamps[cursor]);
    audio.play().catch(() => {});
  } else if (ev.key === "p" || ev.key === "P") {
    ev.preventDefault();
    playBtn.click();
  }
});

/* --- boot ------------------------------------------------------------- */
applyTheme(localStorage.getItem("helper.theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
render();
updateOutput();
refreshPlayLabel();
</script>
